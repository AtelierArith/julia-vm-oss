# Parser corpus divergence allowlist (Issue #8636).
# Every failing file from the corpus sweep must have an entry here,
# classified as (a) intentional-subset-exclusion, (b) unsupported-feature, or (c) bug.
# All entries are (b) unsupported-feature — the Issues above track them.
# No (c) bug entries: sjulia never "silently mis-parses" a clean file (oracle check shows
# no case where sjulia returns OK but JuliaSyntax sees errors on the same source).
# (a) intentional-subset-exclusion: none — sjulia targets full Julia syntax by design.
#
# Ratchet: scripts/check_parser_corpus_allowlist.sh enforces this list only grows
# by removal (Issue #8637).
#
# Schema per entry:
#   file = "julia/relative/path.jl"
#   classification = "unsupported-feature"  # (a)/(b)/(c) — see header
#   issue = "#NNNN"  # GitHub Issue tracking this gap
#   family = "short-family-slug"  # internal grouping key
#   reason = "one-line English description"

# --- additional-parser-gaps (0 files) ---

[[allowlist]]
file = 'julia/base/broadcast.jl'
classification = 'unsupported-feature'
issue = '#8753'
family = 'newline-continuation'
reason = 'Remaining parser gaps after #8753 partial fix (dotted-operator issues, ;;, etc.)'

