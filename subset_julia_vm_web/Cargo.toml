[package]
name = "subset_julia_vm_web"
version = "0.10.3"
edition = "2021"
rust-version.workspace = true
description = "WebAssembly binding for SubsetJuliaVM - Julia subset interpreter"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Forwards the Issue #8562 handler-table dispatch experiment into the VM and
# compiles the `HandlerTableBench` wasm binding. Measurement-only; never a
# default (build with `wasm-pack build ... -- --features vm-handler-table`).
vm-handler-table = ["subset_julia_vm/vm-handler-table"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }

# Use subset_julia_vm as a path dependency, but exclude tree-sitter for WASM
# Note: We'll handle parsing on the JS side with web-tree-sitter
# This crate only needs lowering, compile, and VM execution

[dependencies.subset_julia_vm]
path = "../subset_julia_vm"
default-features = false
# tree-sitter C code doesn't compile for wasm32-unknown-unknown target
# We now use subset_julia_vm_parser (pure Rust) for parsing
features = ["wasm"]

[dependencies.subset_julia_vm_parser]
path = "../subset_julia_vm_parser"

[dependencies.subset_julia_vm_bytecode]
path = "../subset_julia_vm_bytecode"

# NOTE: profiles must live at the workspace root — a `[profile.*]` block here is
# silently ignored by Cargo. The WASM size-optimized profile (`opt-level = "s"`,
# `lto = true`) is defined as `[profile.web-release]` in the root `Cargo.toml`
# and selected via `wasm-pack build --profile web-release` (Issue #6922).
