# deny.toml — cargo-deny configuration for SubsetJuliaVM (Issue #9000)
#
# Philosophy: gate on NEW problems, not on pre-existing known-acceptable state.
# Every allowlist entry is commented with WHY it is explicitly permitted.
# Goal: reliably green gate on main, with new advisories/license/source
# changes surfacing as CI failures.
#
# Placement (Issue #9000):
#   Advisories change without code changes, so all checks run in the nightly
#   `supply-chain` job (nightly-gates.yml). Failures create a GitHub Issue via
#   the existing notify-on-failure mechanism.

# ── Advisories ────────────────────────────────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
ignore = [
    # RUSTSEC-2025-0141: bincode 1.3.3 unmaintained.
    # WHY: bincode is a DIRECT dependency used for Base cache serialization
    # (Issue #2929). The advisory notes 1.3.3 is "complete" — no CVE/vuln.
    # Migration to an alternative (bitcode/postcard) is tracked as follow-up
    # in Issue #9000.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 DIRECT dep for Base cache; advisory says 'complete', no CVE. Migration tracked in Issue #9000." },

    # RUSTSEC-2024-0436: paste proc-macro no longer maintained.
    # WHY: paste is a TRANSITIVE compile-time proc-macro. It has no runtime
    # attack surface. The crate is archived but not broken. The dtolnay
    # ecosystem crates that pull it in will migrate on their own schedules.
    { id = "RUSTSEC-2024-0436", reason = "paste is a transitive compile-time proc-macro; no runtime surface. Not a direct dep; will clear when upstreams migrate." },

    # RUSTSEC-2026-0190: anyhow unsound Error::downcast_mut.
    # WHY: anyhow is a TRANSITIVE dependency. The specific unsound code path
    # (Error::downcast_mut + subsequent manipulation) is not reachable in this
    # project. Upstream fix expected imminently; tracked in Issue #9000.
    { id = "RUSTSEC-2026-0190", reason = "anyhow is a transitive dep; downcast_mut unsoundness not reachable in this project. Upstream fix pending; tracked in Issue #9000." },
]

# ── Licenses ──────────────────────────────────────────────────────────────────
[licenses]
# Allowlist of SPDX license identifiers actually present in the dependency
# graph. Any crate with an unlisted license is a hard error.
#
# WHY each is present:
#   MIT, Apache-2.0          — dominant Rust ecosystem licenses
#   Apache-2.0 WITH LLVM-exception — cranelift* and Rust stdlib crates
#   Unlicense                — e.g. aho-corasick, memchr (public domain)
#   BSD-2-Clause             — some crypto / systems crates
#   Zlib                     — e.g. miniz_oxide (compression)
#   Unicode-3.0              — ICU4X locale/unicode data crates
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unlicense",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-3.0",
]

# ── Bans ──────────────────────────────────────────────────────────────────────
[bans]
# Warn (not error) on duplicate semver-incompatible copies pulled in by the
# graph. Most duplicates here come from cargo-deny's own transitive deps
# bringing newer minor versions than the VM's direct deps; they do not
# represent a real risk.
multiple-versions = "warn"
# Workspace-internal path dependencies legitimately omit version numbers
# (they are not published to crates.io). Warn rather than deny; the note
# from cargo-deny that allow-wildcard-paths doesn't suppress "public crates"
# is expected — these are private workspace members.
wildcards = "warn"
allow-wildcard-paths = true

# ── Sources ───────────────────────────────────────────────────────────────────
[sources]
# Only allow crates from crates.io. Any crate sourced from an unknown
# registry or git URL is a supply-chain risk and is a hard error.
#
# vendor/astro-float-num is wired via [patch.crates-io] in Cargo.toml
# (Issue #6794). cargo-deny treats path patches as local overrides and does
# NOT require an allow-git entry for them — sources ok passes already.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
