<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SubsetJuliaVM Playground</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="preload" href="plotly.min.js?v=2.35.2" as="script">
    <link rel="stylesheet" href="styles.css?v=1">
    <!-- Plotly and JSXGraph ship UMD wrappers that register as AMD modules when a
         `define` is present, so they must load BEFORE Monaco's RequireJS loader
         (which defines `define.amd`). Otherwise the global `Plotly` / `JXG` the
         renderers rely on is never set and plots/boards silently fail to draw
         (Issue #7286). -->
    <script src="plotly.min.js?v=2.35.2"></script>
    <script src="jsxgraph.min.js?v=1.12.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>
<body>
    <header class="app-header">
        <h1>SubsetJuliaVM Playground</h1>
        <select id="sample-select" class="sample-select" aria-label="Choose a sample"></select>
    </header>

    <nav class="tab-bar" role="tablist" aria-label="Editor and output tabs">
        <button class="tab active" data-tab="edit" role="tab" aria-selected="true">Edit</button>
        <button class="tab" data-tab="output" role="tab" aria-selected="false">Output</button>
    </nav>

    <main>
        <div class="workspace">
            <section id="edit-pane" class="pane active" role="tabpanel" aria-labelledby="tab-edit">
                <div class="editor-toolbar">
                    <button id="run-btn" class="primary">Run</button>
                    <button id="share-btn">Share</button>
                    <button id="copy-source-btn">Copy</button>
                </div>
                <div class="editor-wrapper">
                    <div id="monaco-container" aria-label="Julia code editor"></div>
                </div>
            </section>

            <section id="output-pane" class="pane" role="tabpanel" aria-labelledby="tab-output">
                <div class="output-header">
                    <h2>Output</h2>
                    <button id="clear-output-btn" title="Clear output">Clear</button>
                    <button id="copy-btn" title="Copy output to clipboard">Copy</button>
                </div>
                <div id="unsupported-notice" class="unsupported-notice hidden"></div>
                <div id="error" class="error hidden"></div>
                <pre id="output"></pre>
                <div id="plot-output" class="hidden"></div>
                <div id="result"></div>
            </section>
        </div>
    </main>

    <footer>
        <p>
            <a href="https://github.com/terasakisatoshi/subset_julia" target="_blank">GitHub</a>
            |
            <span id="version"></span>
        </p>
    </footer>

    <script type="module" src="app.js?v=1"></script>
</body>
</html>
