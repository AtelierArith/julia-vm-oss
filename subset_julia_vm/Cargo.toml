[package]
name = "subset_julia_vm"
version = "0.10.3"
edition = "2021"
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib"]

[features]
default = []
wasm = ["dep:js-sys", "subset_julia_vm_vm/wasm"]
# `profiling` arms the per-instruction VM profiler (Issue #5090). When OFF (the
# default for library/iOS/wasm builds), `profiler::record`/`record_event` compile
# down to nothing, so the hot interpreter dispatch loop pays zero overhead. The
# `repl` binary opts in so its `SJULIA_VM_PROFILE` env switch keeps working.
profiling = ["subset_julia_vm_compile/profiling", "subset_julia_vm_vm/profiling"]
# `vm-handler-table` compiles the Issue #8562 handler-function-pointer
# dispatch experiment (armed per-Vm by `SJULIA_HANDLER_TABLE=1` or
# `set_handler_table_forced`). Never a default: default builds must keep the
# shipped `match` dispatch loop byte-for-byte unchanged.
vm-handler-table = ["subset_julia_vm_vm/vm-handler-table"]
repl = ["dep:rustyline", "profiling"]
aot = ["dep:subset_julia_vm_runtime", "dep:thiserror"]
cranelift = ["aot", "dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-module", "dep:cranelift-jit", "dep:cranelift-object", "dep:gimli", "dep:object", "dep:target-lexicon"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
subset_julia_vm_ir = { path = "../subset_julia_vm_ir" }
subset_julia_vm_lowering = { path = "../subset_julia_vm_lowering" }
subset_julia_vm_compile = { path = "../subset_julia_vm_compile" }
subset_julia_vm_vm = { path = "../subset_julia_vm_vm" }
subset_julia_vm_bytecode = { path = "../subset_julia_vm_bytecode" }
subset_julia_vm_parser = { path = "../subset_julia_vm_parser" }
subset_julia_vm_types = { path = "../subset_julia_vm_types" }
sha2 = "0.10"
once_cell = "1.19"
toml = "0.9"
js-sys = { version = "0.3", optional = true }
rustyline = { version = "17", optional = true }
tempfile = { version = "3", optional = true }
subset_julia_vm_runtime = { path = "../subset_julia_vm_runtime", optional = true }
thiserror = { version = "1.0", optional = true }
cranelift-codegen = { version = "0.115", optional = true }
cranelift-frontend = { version = "0.115", optional = true }
cranelift-module = { version = "0.115", optional = true }
cranelift-jit = { version = "0.115", optional = true }
cranelift-object = { version = "0.115", optional = true }
gimli = { version = "0.31", optional = true, features = ["write"] }
object = { version = "0.36", optional = true, default-features = false, features = ["read", "write"] }
target-lexicon = { version = "0.12", optional = true }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
# Issue #9197 slice 2: inline-buffer arg-id sequence for the exact-match L1
# call-site dispatch cache key (small ≤4-arg keys stay off the heap).
smallvec = "1"
regex = "1.10"
half = { version = "2.4", default-features = false, features = ["serde"] }
bincode = "1"
# Issue #10118: Base cache section wire format (compile/precompile.rs). ~3-5x
# faster decode than bincode's varint mode with a smaller payload, and no
# migration risk beyond a codec swap (still plain serde Serialize/Deserialize
# -- unlike rkyv, no #[derive(Archive)] across the IR/bytecode type graph).
postcard = { version = "1", features = ["use-std"] }
strum = { version = "0.27", features = ["derive"] }
astro-float = "0.9"
nalgebra = { version = "0.34", default-features = false, features = ["std"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
insta = { version = "1.41", features = ["yaml"] }
criterion = { version = "0.8", features = ["html_reports"] }

[[bin]]
name = "sjulia"
required-features = ["repl"]

[[bin]]
name = "bundle"
required-features = ["tempfile"]

[[bin]]
name = "juliars"
path = "src/bin/juliars.rs"
required-features = ["aot"]

[[bin]]
name = "aot"
path = "src/bin/aot.rs"
required-features = ["aot"]

[[bin]]
name = "handler_table_bench_8562"
path = "src/bin/handler_table_bench_8562.rs"
required-features = ["vm-handler-table"]

[[test]]
name = "handler_table_parity_8562_tests"
required-features = ["vm-handler-table"]

# Consolidated CLI tests (Issue #9671 Phase 1): the former sjulia_cli_{stdin,
# stderr,dump_bytecode,cache_status,vm_bytecode} and sjulia_cli_soft_scope_9283
# binaries now live as inline `mod`s in sjulia_cli_tests.rs.
[[test]]
name = "sjulia_cli_tests"
required-features = ["repl"]

[[test]]
name = "sjulia_precompile_determinism_tests"
required-features = ["repl"]

[[test]]
name = "repl_session_fixture_tests"
required-features = ["repl"]

