expected = true
description = "PCRE2 escape-class parity at Regex construction (Issues #10179/#10180/#10203): octal \\ddd / \\o{...} / \\cX control escapes, \\v/\\V vertical-whitespace class, \\h/\\H horizontal-whitespace class (incl. inside [...] and nested-negated complements), while genuine back references are preserved. Verified against upstream julia 1.12."

[[tests]]
name = "regex_recursion_reject_10181"
file = "regex_recursion_reject_10181.jl"
expected = true
description = "Issue #10181: PCRE2 pattern-recursion / subroutine-call constructs — (?R), (?0), numbered/relative (?n)/(?+n)/(?-n), and named (?&name)/(?P>name) — are rejected at Regex construction with a clear 'recursion is not supported' error instead of fancy-regex silently mis-matching (?R) or failing (?1) opaquely. NOTE: deliberate sjulia-vs-upstream DIVERGENCE (upstream julia/PCRE2 supports these), so skip_julia_test = true; look-alikes ((?:), (?i), atomic (?>), lookaround, named captures, conditionals, comments) still compile."
