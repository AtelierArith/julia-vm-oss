[[tests]]
name = "io_parametric_where_show_4853"
file = "parametric_where_show_4853.jl"
expected = true
description = "a parametric Base.show(io::IO, b::Box{T}) where T method dispatches from repr, string, print(io, x) and sprint(show, x); the second param's JuliaType is Struct(\"Box{T}\") so the show-method registration also keys the bare base name (\"Box\") that user_show_method_for falls back to, instead of only the typevar form which never matched the runtime concrete name Box{Int64} (Issue #4853)"

[[tests]]
name = "io_println_iobuffer_user_show_4853"
file = "println_iobuffer_user_show_4853.jl"
expected = true
description = "println(buf, x) with a single value where buf is a local IOBuffer() (statically Any, not IO) dispatches a user show(io, ::T)/show(io, ::Box{T}) method instead of field-dumping; the single-value println(io_or_val, x) lowering now Dup-splits into IOPrint(2); Pop; IOPrintlnNewline so the two-arg user-show dispatch fires and the trailing newline is routed to the first arg's runtime sink (IO) or stdout (non-IO) without re-printing the value (Issue #4853 follow-up)"

[[tests]]
name = "io_multiarg_print_io_user_show_4827"
file = "multiarg_print_io_user_show_4827.jl"
expected = true
description = "multi-arg print(io, a, x, b) / println(io, a, x, b) with a statically-IO first arg dispatch each struct value x through a user-defined Base.show(io::IO, ::T) method instead of bundling every value into one IOPrint(N) (which skips dispatch and field-dumps the struct). The compiler now splits the statically-IO multi-arg case into a sequence of `Dup; compile(value); IOPrint(2); Pop` writes (each two-arg IOPrint dispatches show), leaving the IO handle for the trailing newline (println) / result; single-arg print(io, x) and stdout print/println(x) keep working (Issue #4827, follow-up to #4761)"

[[tests]]
name = "io_println_closure_captured_iobuffer_5035"
file = "println_closure_captured_iobuffer_5035.jl"
expected = true
description = "print/println(buf, ...) where buf is a *top-level* (global) IOBuffer() referenced from inside a function/closure routes to the IO sink instead of dumping the buffer value to stdout. Two fixes: (1) infer_value_type_with_structs maps IOBuffer() -> IO so the global binding is typed IO in global_types (the generic compiler then routes via IOPrint); (2) the runtime function specializer's stdout-only print/println fast path now bails to the generic bytecode whenever the first argument is not a statically-known non-IO primitive, since it has no IO type info for globals (Issue #5035)"

[[tests]]
name = "io_array_element_structref_5234"
file = "array_element_structref_5234.jl"
expected = true
description = "string/repr/sprint(print, ...) of an array whose ELEMENTS are heap-allocated structs (Pair / Complex / user struct), via literals and comprehensions, resolve each StructRef through the element show form instead of leaking StructRef(heap_idx=N). The bare stdout single-arg print/println (BuiltinId::Print/Println, PrintAny/PrintAnyNoNewline) only did a top-level StructRef deref, not the deep resolve_struct_refs_for_format used by string/repr; #5234 switches all four to the deep resolver so array elements no longer leak. The bare-stdout entry points are also guarded by a Rust stdout-capture integration test (Issue #5234)"

[[tests]]
name = "io_inline_typed_array_literal_show_5241"
file = "inline_typed_array_literal_show_5241.jl"
expected = true
description = "An INLINE typed-array literal T[...] (Int8[1,2], Float64[1.0], Any[1,\"x\"], String[...], Char[...], Bool[...], user-struct Foo[...]) passed directly to show / repr / sprint(show, ...) / string renders its elements (with the correct eltype prefix) instead of the empty-constructor form Vector{T}(). The literal lowers to Expr::Index { array: Var(\"T\"), .. }; infer_expr_type previously reported ValueType::Any for it, so resolve_sprint_function_ref could not dispatch show(io::IO, ::Array) and fell back to the generic struct show(io, x) which printed typeof(x)() = Vector{T}(). The shared typed_array_literal_element_type helper now makes inference return ValueType::ArrayOf(elem) for the literal, matching the runtime value and the variable-bound form. Includes variable-bound and untyped-literal regression coverage (Issue #5241, follows #5234/#5236)"

[[tests]]
name = "io_iobuffer_from_string_5686"
file = "io_iobuffer_from_string_5686.jl"
expected = true
description = "IOBuffer(s::AbstractString) constructs a readable buffer initialized with s (Issue #5686); read(io, String) / String(take!(io)) return the content. Adds the IOBufferFromString builtin and routes read(io::IO, String) to take! (returns buffer content). The empty writable IOBuffer() form and read(filename, String) are unaffected."
