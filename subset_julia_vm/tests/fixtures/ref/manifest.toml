# WeakRef/GC semantics change with the persistent-cache mode (the #10092 escape:
# has_inner_constructor lost on cache restore). Tagging any entry in this
# category makes scripts/check_cache_sensitive_fixture_lane.sh run the whole
# ref:: category under BOTH cache modes (Issue #10223).
