expected = true
description = "Issue #7970: convert(Bool, x) and Bool[...] literals only accept 0/1 (signed/unsigned/float sources), raising InexactError otherwise instead of a lenient x!=0 truthiness test (convert(Bool,2) was true, Bool[2] was Bool[1])"

[[tests]]
name = "conversion_bool_constructor_7971"
file = "bool_constructor_7971.jl"
expected = true
description = "Issue #7971: Bool(x) numeric constructor is callable (was 'Unknown function: Bool'), routing through the range-checked convert(Bool,x): 0/1 from signed/unsigned/float/Bool sources, InexactError otherwise; usable first-class via map; Bool-as-type unaffected"

[[tests]]
