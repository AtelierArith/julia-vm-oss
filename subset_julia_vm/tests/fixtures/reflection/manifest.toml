description = "code_warntype / @code_warntype type-stability diagnostic (Issue #5145), verified against upstream Julia 1.12 with matching 8/8 pass count. Core.Compiler.return_type routes through the shared inference surface and reports a concrete type for a type-stable method (cwt_stable_5145::Int64 -> Int64) and a Union for a type-unstable one (cwt_unstable_5145 -> Union{Int64,String}); Base.infer_return_type agrees (cwt_add_5145(Int64,Float64) -> Float64). code_warntype([io],f,types) prints a subset type-stability report (matched method signature plus inferred return type, flagged non-concrete) and returns nothing; output is directed to devnull. The @code_warntype f(args...) macro (requires `using InteractiveUtils`) is lowered in Rust to code_warntype(f, typeof((args...,))), extracting the argument types from the call, and returns nothing"

