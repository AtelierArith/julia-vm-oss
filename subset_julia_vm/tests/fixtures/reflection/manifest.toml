[[tests]]
name = "reflection_typevar_reflection_read_order_identity_10603"
file = "typevar_reflection_read_order_identity_10603.jl"
expected = true
description = "UnionAll TypeVar reflection identity is read-order INDEPENDENT in both directions (Issue #10603, complements the load-bearing-order #10420 fixture): Direction A reads a wrapper body `.parameters` BEFORE `.var` after a user Vector{T}/Matrix{S} construction — the body param resolves to the wrapper's own owner-scoped var (=== .var, !== the user TypeVar), not the leaked global constructed-TypeVar entry; Direction B reads Dict.var/Set.var BEFORE constructing Dict{K,V}/Set{T} — the constructed `.parameters` still resolve to the user TypeVars (=== K/V/T), not the wrapper projection. The reversed orders the #10420 fixture does not exercise; fixed on main by the canonical-source UnionAll-body / runtime-TypeVar-identity work"

