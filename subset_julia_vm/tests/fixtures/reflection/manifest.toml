[[tests]]
name = "reflection_aligned_sizeof_allocatedinline_5107"
file = "aligned_sizeof_allocatedinline_5107.jl"
expected = true
description = "sizeof(T) for struct types plus Base.aligned_sizeof / Base.allocatedinline / Base.datatype_alignment (Issue #5107), verified against upstream Julia 1.12. Builds on the #5100 max-of-field-alignments layout and #5104 isbits recursion. sizeof: primitives (Int 8, Bool 1, Float32 4, Char 4, Nothing 0); isbits immutable structs from the field layout (two-Int64 16, mixed Int8/Int64/Int8 24 with padding, packed three-Int8 3, Float32+Float64 16, empty 0, nested 24, immutable-with-String-field 16); mutable structs use the data-layout size not the pointer width (two-Int64 16, one-Int64 8, mixed 24); a mutable struct embedded as a field is boxed/by-pointer so the outer struct counts it as 8 bytes (ASOuterMut 16, field 2 at offset 8). datatype_alignment is the max of field alignments (Int64 8, Int8 1, Float32 4, struct max). allocatedinline true for concrete immutable types incl. ones with boxed fields (String-field immutable), false for mutable structs, String, and abstract Number. aligned_sizeof rounds sizeof up to the alignment for inline types and falls back to the pointer width (8) for non-inline (mutable/abstract) types. Return types: sizeof/aligned_sizeof/datatype_alignment are Int, allocatedinline is Bool. Struct names are multi-character to avoid the unrelated single-letter-name TypeVar misclassification (Issue #5252)"

