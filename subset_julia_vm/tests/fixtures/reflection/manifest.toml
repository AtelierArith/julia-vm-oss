expected = true
description = "methods(f): method count + iteration/collect for user-defined generic functions — length(methods(f)) matches the number of defined methods (single/multi/varargs/where), isempty is false, for-loops and collect iterate the Method entries (m.name, indexing, nargs accumulation), matching upstream Julia 1.12 on the portable surface. The exact Base.MethodList type name and precise Method show formatting (file/line) are deferred (Issue #5125)"

[[tests]]
name = "reflection_methods_listing_5125"
file = "methods_listing_5125.jl"
expected = true
description = "methods(f) listing reflection: upstream-style Method display and source-location fields (Issue #5125), verified against upstream Julia 1.12 with matching pass counts. show(m) / string(m) / println(m) render `name(::T...) @ Module file:line` instead of a raw struct dump (the print path now special-cases the Method struct, and the user Base.show(io, ::Method) gained the ` @ Module file:line` suffix). The .module (Module, prints as Main for top-level definitions), .file (Symbol), and .line (Int32, the FunctionInfo.def_line recovered from the IR Function.span) fields are populated and accessible; `module` is declared as the placeholder `mod` in struct Method and renamed to `module` in the compiler field table since the parser cannot accept the reserved keyword as a field name. string(Main) now renders the bare module name (was Module(Main)). Parity-safe: asserts STRUCTURE (startswith name(, contains ::Int64, contains ` @ `, positive line) not an exact path, since sjulia's fixture file/line differ from the upstream julia invocation. The Base.MethodList type name and Tuple{typeof(f), ...} .sig form remain deferred"

