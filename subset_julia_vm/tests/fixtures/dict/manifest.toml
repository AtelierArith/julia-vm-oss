[[tests]]
name = "dict_keys_values_pairs_pure_dispatch_6731"
file = "dict_keys_values_pairs_pure_dispatch_6731.jl"
expected = true
description = "keys/values/pairs on a Dict route through pure-Julia Dict{K,V} methods (base/dict.jl) with no Value::Dict builtin fallback (Issue #6731 slice 1). Their BASE_FUNCTION_ROUTES entries are now markers (no BuiltinOp), so the call dispatches to the pure parametric methods statically and through a dynamic Any-typed barrier; keys/values on a NamedTuple still work. The BuiltinOp/BuiltinId DictKeys/DictValues/DictPairs become dead-but-kept. Values vs julia 1.12."

[[tests]]
name = "dict_mutating_ops_pure_dispatch_6731"
file = "dict_mutating_ops_pure_dispatch_6731.jl"
expected = true
description = "Mutating Dict ops delete!/get!/empty!/merge! route through pure-Julia Dict{K,V} methods (base/dict.jl) with no Value::Dict builtin fallback (Issue #6731 slice 2). BASE_FUNCTION_ROUTES entries changed route()→marker(); BuiltinOp DictDelete/DictGetBang/DictEmpty/DictMergeBang moved to dead_but_kept. Verified statically, through a dynamic Any-typed barrier incl. the #6584 empty! trap, and that delete!/empty! on a Set still work. Values vs julia 1.12."

[[tests]]
name = "dict_carrier_removed_pure_struct_6731"
file = "dict_carrier_removed_pure_struct_6731.jl"
expected = true
description = "The Value::Dict Rust carrier was removed (Issue #6731): every Dict is a pure-Julia Dict{K,V} struct and the full public API (getindex/setindex!/get/get!/getkey/haskey/keys/values/pairs/delete!/merge!/empty!/pop!/eltype/keytype/valtype/construction/iteration) dispatches through its methods. The _dict_* intrinsics, BuiltinId _Dict*/DictNew/DictMerge/DictLen, and NewDict* Instrs are deleted; remaining Dict BuiltinIds are pure struct-dispatch trampolines. Verified incl. #6584 Any-typed empty! trap and that Set delete!/empty! still work. Values vs julia 1.12."

[[tests]]
name = "dict_inline_dict_real_struct_key_7173"
file = "inline_dict_real_struct_key_7173.jl"
expected = true
description = "Indexing an inline-chained `Dict(...)[key]` whose key is a module-qualified user struct `<: Real` (so the inferred Dict name carries a dot inside its type params, e.g. `Dict{M.R, Int64}`) dispatches to `getindex` instead of misrouting to numeric array indexing. `is_dict_struct_name` now splits on `{` before stripping a module prefix (Issue #7173). Bound vs inline parity; ordinary numeric array indexing and inline Int/String-keyed Dict indexing unaffected. Values vs julia 1.12."

[[tests]]
name = "dict_generic_datatype_keys_7940"
file = "dict_generic_datatype_keys_7940.jl"
expected = true
description = "Dict get/set keyed by a generic `DataType` value (a `where` type parameter, e.g. `D[T] = ...` / `D[T]`) compiles and dispatches to the Dict path instead of coercing the key to an I64 array index (\"Cannot convert DataType to I64\"). Covers haskey/write/read through a Dict argument, top-level concrete DataType keys with value-type preservation (no Int->Float64 coercion via DictSet routing), and `Dict{Type,Any}` (Issue #7940)."

