[[tests]]
name = "hof_isequal_curried_predicate_5662"
file = "hof_isequal_curried_predicate_5662.jl"
expected = true
description = "isequal(x) single-argument curried predicate form (y -> isequal(y, x)) works across HOFs: map/filter/findfirst/findall/count(isequal(k), v) and direct isequal(3)(3). Adds the 1-arg method in base/operators.jl (as a closure, like sjulia's curried operators #5127) and gates the isequal->Bool return-type inference (compile/expr/infer/julia_type.rs) on the 2-arg form so filter does not infer the predicate as Bool. Two-arg isequal (incl. NaN/missing) unchanged; upstream has no isless(x) curried form so isless(2) still errors. Issue #5662"

[[tests]]
name = "hof_count_tuple_5681"
file = "hof_count_tuple_5681.jl"
expected = true
description = "count(f, t::Tuple) counts elements satisfying f by iteration (count(iseven, (1,2,3,4))==2), including the empty tuple (0). Adds count(f::Function, t::Tuple) in base/reduce.jl; Array/range count unchanged. Partial fix of #5681 (filter/cumsum on tuples remain, blocked on a Tuple-from-collection constructor). Issue #5681"

[[tests]]
name = "hof_map_registry_inference_6604"
file = "hof_map_registry_inference_6604.jl"
expected = true
description = "map call-site lambda return-type inference stays precise after migrating the `map` rule onto the tfuncs registry path. The registry rule tfuncs::hof_ops::map_call_result receives the function-argument expression through the new TFuncContext::arg_exprs / HofLambdaAnalyzer seam and calls back into CoreCompiler to infer the lambda's mapped element type, so map(x -> x*2.0, Int[]) is Vector{Float64}, map(Float64, Int[]) is Vector{Float64}, map(abs, Int[]) preserves Vector{Int64}, and predicate lambdas yield Vector{Bool}. Qualified Base.map shares the path (Issue #6604)"

[[tests]]
name = "hof_remaining_registry_inference_6604"
file = "hof_remaining_registry_inference_6604.jl"
expected = true
description = "Return-type inference for the remaining HOFs after migrating them onto the tfuncs registry path via the HofLambdaAnalyzer seam: binary/n-ary broadcast & map, filter (element preserved), reduce/foldl/foldr, and mapreduce/mapfoldl/mapfoldr. The registry rules tfuncs::hof_ops::{nary_map,filter,reduce,mapreduce}_call_result drive lambda/operator inference through CoreCompiler, including the reduce-specific operator coverage (^) absent from the binary-map rule, so e.g. broadcast((x,y)->x+y*1.0, …) is Vector{Float64}, reduce(+, Int[]) is Int64, foldl(^, Int[]) is Int64, and mapreduce(x->x*1.0, +, Int[]) is Float64 (Issue #6604)"

[[tests]]
name = "hof_reducer_legacy_instr_removal_6733"
file = "reducer_legacy_instr_removal_6733.jl"
expected = true
description = "Legacy reducer HOF VM instructions removed (Issue #6733): FindAllFunc/FindFirstFunc/FindLastFunc/MapReduceFunc(WithInit)/MapFoldrFunc(WithInit)/MapFuncInPlace/FilterFuncInPlace/SumFunc/AnyFunc/AllFunc/CountFunc deleted from the Instr enum + exec/effects. any/all/count/sum/mapreduce/findall/findfirst/map!/filter! resolve through normal method dispatch to pure-Julia definitions (already dispatch-first via Issues #3728/#3731); range/LinRange/first/last and tuple destructuring (live TupleFirst codegen) keep working. Short-circuit semantics for any/all preserved. CACHE_VERSION 57→58. Verified vs julia 1.12."

[[tests]]
name = "hof_value_mode_nested_wrapper_result_6807"
