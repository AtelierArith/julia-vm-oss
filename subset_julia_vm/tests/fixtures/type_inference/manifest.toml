[[tests]]
name = "type_inference_nested_field_union_4856"
file = "nested_field_union_4856.jl"
expected = true
description = "Repeated nested immutable field reads (`x.inner.value`, `getfield(getfield(x, :inner), :value)`, triple-nested chains) preserve the inner field's declared `Union{T, Nothing}` type instead of widening to `Any`. Root cause was `StructField::as_julia_type` only returning `Some` for `TypeExpr::Concrete`, so user-struct-typed fields (parsed as `TypeExpr::Named`) fell to `ValueType::Any` and the lattice struct table lost the nested struct identity. Fixed in compile/mod.rs by routing typed fields through `TypeExpr::to_julia_type_lossy` (Issue #4856)"

[[tests]]
name = "type_inference_generic_only_reflection_precision_4985"
file = "generic_only_reflection_precision_4985.jl"
expected = true
description = "A generic single-method function whose body returns a literal reports the literal's concrete type from `Base.infer_return_type` / `Base.return_types`, both with an explicit `Tuple` signature and with no signature (generic-only state). Locks in the body-based reflection precision portion of #4985; the world-age 'reflection sees a later top-level method' portion remains tracked under #4985 / #4271 (Issue #4985)"

[[tests]]
name = "type_inference_branch_loop_return_join_limited_4273"
file = "branch_loop_return_join_limited_4273.jl"
expected = true
description = "Inference return-aggregation joins use comparison-aware join_limited so small / already-known structured unions built from branch (if/elseif) and loop-body (for-in / while) returns are preserved instead of collapsing to Any. A deep-first branch return seeds the accumulator and a later shallow Int return joins against it, keeping Union{Int64, Tuple{...depth6...}}; for-in and while small tuple / nullable unions are likewise preserved. Migrates the ForEach/While loop accumulator joins (previously plain join, unlike the already-migrated range-based For), the if/try branch return aggregation, the block-level Return/MaybeReturn aggregation, and the return-vs-fallthrough join, all routed through join_limited(.., compare_to = previous_return). Verified against upstream Julia 1.12 (Issue #4273)"
[[tests]]
name = "type_inference_typeof_eq_narrowing_5140"
file = "typeof_eq_narrowing_5140.jl"
expected = true
description = "typeof(x) === T / == T / !== T / != T (and the reversed operand order) narrow x in conditional branches, equivalent to x isa T for concrete T. A Union{Int,String} argument inferred via Base.infer_return_type matches upstream Julia (Int64 / Union{Int64,Float64}) instead of widening to Any, while x === nothing narrowing is preserved (Issue #5140)"

[[tests]]
name = "type_inference_union_struct_field_access_5601"
file = "union_struct_field_access_5601.jl"
expected = true
description = "Field access over a Union of struct types infers the join of the per-member field types (upstream getfield_tfunc over a Union) instead of widening to Any; a member lacking the field contributes Bottom. Previously (x::Union{A,B}).n inferred Any for all-struct unions — only struct+primitive unions narrowed (Issue #5601)"

[[tests]]
name = "type_inference_ambiguous_method_return_bottom_5603"
file = "ambiguous_method_return_bottom_5603.jl"
expected = true
description = "Base.infer_return_type reports Union{} and Base.return_types reports no concrete method result for an ambiguous method-table dispatch (Integer,Real vs Real,Integer called with Int64,Int64), while non-ambiguous signatures still infer the selected method return type, matching upstream Julia (Issue #5603)"

[[tests]]
name = "type_inference_bottom_return_snapshot_join_6523"
file = "bottom_return_snapshot_join_6523.jl"
expected = true
description = "A recorded Union{} (Bottom) method-return snapshot re-enters the inference lattice as Bottom (the identity of join), not Top: a caller branching between a call to a MULTI-method callee whose snapshot is Union{} (consulted via MethodSig.return_julia_type — single-method calls never convert through JuliaType) and a Float64 literal infers Float64 instead of Any. Root cause: the canonical JuliaType::Bottom spelling of Union{} fell through julia_type_to_lattice's `_ => Top` arm while the non-canonical Union(vec![]) spelling correctly lowered to Bottom (Issue #6523)"

[[tests]]
name = "type_inference_untyped_redef_inference_5938"
file = "untyped_redef_inference_5938.jl"
