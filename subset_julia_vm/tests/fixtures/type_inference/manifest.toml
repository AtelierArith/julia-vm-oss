[[tests]]
name = "type_inference_prescan_var_pi_6601"
file = "prescan_var_pi_6601.jl"
expected = true
description = "Function-body slot-typing pre-scan: an `Assign` RHS that is a bare `Var` is typed through the shared inference engine, except a bare `pi`/`π` Var keeps the legacy F64 special-case the empty-table engine lacks. `area(r) = (p = pi; g = r; p * g * g)` (and the `π` variant) compute pi*r*r == 12.566370614359172 as Float64 for r=2.0, matching upstream Julia (Issue #6601)"

[[tests]]
name = "type_inference_prescan_funcref_6601"
file = "prescan_funcref_6601.jl"
expected = true
description = "Function-body slot-typing pre-scan: an `Assign` RHS that is an `Expr::FunctionRef` (`f = sin`, `h = square`) is typed via a scoped seam shim reproducing legacy's `ValueType::Function` (the shared engine would widen to Any), and the function value stays callable through the slot. `f = sin; g = cos; f(0.0)+g(0.0) == 1.0` and `h = square; h(3.0) == 9.0` as Float64, matching upstream Julia (Issue #6601)"

[[tests]]
name = "type_inference_prescan_unaryop_6601"
file = "prescan_unaryop_6601.jl"
expected = true
description = "Function-body slot-typing pre-scan: an `Assign` RHS that is an `Expr::UnaryOp` is typed through the shared inference engine after the engine's `tfunc_not`/`tfunc_sub` were fixed to match upstream Julia — `!` (Not) always yields Bool, and `-` (Neg) preserves the concrete operand type, including `Complex{T}`. `d = -c` for `c = 1.0 + 2.0im` is ComplexF64 (-1.0 - 2.0im), and `x = !b` for `b = true` is Bool (false), matching upstream Julia (Issue #6601)"

[[tests]]
name = "type_inference_prescan_tuple_6601"
file = "prescan_tuple_6601.jl"
expected = true
description = "Function-body slot-typing pre-scan: an `Assign` RHS that is an `Expr::TupleLiteral` is typed through the shared inference engine after the engine's `TupleLiteral` arm was fixed to type ANY tuple literal as `Tuple` (upstream Julia: typeof((1, \"x\", [])) == Tuple{...}), instead of collapsing to Any when an element type is non-concrete. `t = (1, x, \"s\")` with a non-concrete `x` slot stays a Tuple and indexes correctly (t[1] + length(t[3]) == 2), an all-concrete `(1, 2.0)` sums to 3.0 (Float64), and an empty `()` has length 0, matching upstream Julia (Issue #6601)"

[[tests]]
name = "type_inference_prescan_fieldaccess_6601"
file = "prescan_fieldaccess_6601.jl"
expected = true
description = "Function-body slot-typing pre-scan: an `Assign` RHS that is an `Expr::FieldAccess` is typed through the shared inference engine after the engine learned the `Expr` builtin's fixed field types (head::Symbol, args::Vector{Any}) — the user struct-table path can't see `Expr`. `describe(:(g(1,2,3)))` reads `h = ex.head` / `a = ex.args` as field-access RHS slots and returns (:call, 4) (args includes the callee `:g`); `typeof(e.head)` is Symbol and `typeof(e.args)` is Vector{Any}, matching upstream Julia (Issue #6601)"

[[tests]]
name = "type_inference_prescan_index_6601"
file = "prescan_index_6601.jl"
expected = true
description = "Function-body slot-typing pre-scan: an `Assign` RHS that is an `Expr::Index` is typed through the shared inference engine as an engine-better class — the engine types `arr[i]` as the precise element type (legacy returned Any), and after this slice's shared `getindex`-tfunc String->Char fix and the engine Index-arm String-slice->String fix, types `s[i]` as Char and `s[1:2]` as String. `idx([10,20,30], \"hello\")` reads `a = arr[1]` / `sub = arr[1:2]` / `c = s[1]` / `ss = s[1:2]` as Index RHS slots returning (10, 2, 'h', \"he\"); typeof of `[10,20,30][1]` is Int64, of `\"hello\"[1]` is Char, and of `\"hello\"[1:2]` is String, matching upstream Julia (Issue #6601)"

[[tests]]
name = "type_inference_prescan_binaryop_6601"
file = "prescan_binaryop_6601.jl"
expected = true
description = "Function-body slot-typing pre-scan: an `Assign` RHS that is an `Expr::BinaryOp` is typed through the shared inference engine as an engine-better class — a new `tfunc_pow` types `a ^ b` as Int^Int->Int (legacy returned Any) and String^Int->String, `tfunc_mul` types `s * s` as String*String->String (legacy returned Any), and the Complex ops `z + x` / `z * z` adopt the canonical ComplexF64 (the bridge canonicalizes Struct{Complex{Float64}}->ComplexF64) where legacy returned F64 / Struct. `ops(2, 10, \"ab\", 1.0 + 2.0im, 3.0)` reads `p = a ^ b` / `cat = s * s` / `cf = z + x` / `cc = z * z` as BinaryOp RHS slots returning (1024, \"abab\", -3.0 + 4.0im, ...); typeof of `2 ^ 10` is Int64, of `\"ab\" * \"ab\"` is String, and of `(1.0 + 2.0im) + 3.0` is ComplexF64, matching upstream Julia (Issue #6601)"

[[tests]]
name = "type_inference_prescan_call_6601"
file = "prescan_call_6601.jl"
expected = true
description = "Function-body slot-typing pre-scan: an `Assign` RHS that is an `Expr::Call` is typed through the shared inference engine as the final corpus class (engine-better) — the shared `tfunc_sqrt` family (sqrt/exp/sin/cos/log) now preserves `Complex` so `exp(z)` is ComplexF64 (legacy widened to Any/Struct), `abs(Complex)` is Float64 (legacy returned ComplexF64), and `zeros(n)` is Vector{Float64} (legacy returned bare Array). `calls(1.0 + 2.0im, 3)` reads `e = exp(z)` / `a = abs(z)` / `zs = zeros(n)` as Call RHS slots returning (ComplexF64, 2.23606797749979, 3); typeof of `exp(1.0 + 2.0im)` is ComplexF64, of `abs(1.0 + 2.0im)` is Float64, and of `zeros(3)` is Vector{Float64}, matching upstream Julia (the #6601 divergence map is now empty) (Issue #6601)"

[[tests]]
name = "type_inference_early_return_narrowing_8545"
file = "early_return_narrowing_8545.jl"
expected = true
description = "Flow-sensitive early-return narrowing: when one arm of a branch terminates (return), the negated condition applies to the fall-through state instead of joining both arms — `isnothing(x) && return 0`, `x isa Int64 || return 0`, one-armed `if ... return ... end`, chained guards across >=2 blocks, and guards nested inside an outer branch all narrow `x` so `x + 1` and Base.infer_return_type see Int64, matching upstream Julia's Conditional lattice (Issue #8545)"

[[tests]]
name = "type_inference_interconditional_predicate_8545"
file = "interconditional_predicate_8545.jl"
expected = true
description = "InterConditional: single-argument user predicates whose body reduces to a conditional on their argument slot narrow at the call site — direct `isa` bodies, predicates delegating to other predicates (isnothing), and compound `&&`/`||` bodies with neutral non-narrowing leaves all translate into the caller's frame so `if pred(x)` / `pred(x) && return` narrow `x`, matching upstream Julia's InterConditional/from_interconditional (Issue #8545)"

[[tests]]
name = "type_inference_partial_struct_lattice_8544"
file = "partial_struct_lattice_8544.jl"
expected = true
description = "First-class PartialStruct lattice element: constructor-site per-field type facts survive as lattice values through argument passing into helpers, identity round trips (CachedReturn), getfield-by-index across a call boundary, nested obj.inner.v dot chains, branch joins of same-shape constructors, and parametric struct instantiation — Base.infer_return_type sees the concrete field type instead of widening untyped fields to Any, matching upstream Core.PartialStruct (Issue #8544)"

[[tests]]
name = "type_inference_partial_struct_inner_ctor_lattice_8739"
