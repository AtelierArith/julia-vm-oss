[[tests]]
name = "type_inference_nested_field_union_4856"
file = "nested_field_union_4856.jl"
expected = true
description = "Repeated nested immutable field reads (`x.inner.value`, `getfield(getfield(x, :inner), :value)`, triple-nested chains) preserve the inner field's declared `Union{T, Nothing}` type instead of widening to `Any`. Root cause was `StructField::as_julia_type` only returning `Some` for `TypeExpr::Concrete`, so user-struct-typed fields (parsed as `TypeExpr::Named`) fell to `ValueType::Any` and the lattice struct table lost the nested struct identity. Fixed in compile/mod.rs by routing typed fields through `TypeExpr::to_julia_type_lossy` (Issue #4856)"

[[tests]]
name = "type_inference_generic_only_reflection_precision_4985"
file = "generic_only_reflection_precision_4985.jl"
expected = true
description = "A generic single-method function whose body returns a literal reports the literal's concrete type from `Base.infer_return_type` / `Base.return_types`, both with an explicit `Tuple` signature and with no signature (generic-only state). Locks in the body-based reflection precision portion of #4985; the world-age 'reflection sees a later top-level method' portion remains tracked under #4985 / #4271 (Issue #4985)"

[[tests]]
name = "type_inference_const_specialization_parity_4272"
file = "const_specialization_parity_4272.jl"
expected = true
description = "Const-influenced inference (Bool branch select, Symbol field select, Nothing singleton, small-Int dispatch) produces correct runtime results across the pipeline, matching upstream Julia. Exercises the value classes handled by the shared const-specialization policy now used by both the compile cache key and the AoT specialization key (Issue #4272)"

[[tests]]
name = "type_inference_ternary_letblock_value_join_5180"
file = "ternary_letblock_value_join_5180.jl"
expected = true
description = "Value-position if/ternary/begin expressions type-join their branch expressions in infer_expr_type instead of widening to Any. Same-typed branches (I64 + I64) keep the concrete type so a ternary/begin/if used directly as a typed-array index or arithmetic operand preserves slot typing; mixed I64/F64 and incompatible Int/String branches still produce branch-correct runtime values matching upstream Julia. LetBlock infers the type of its body's tail-value statement (Issue #5180)"

[[tests]]
name = "type_inference_branch_loop_return_join_limited_4273"
file = "branch_loop_return_join_limited_4273.jl"
expected = true
description = "Inference return-aggregation joins use comparison-aware join_limited so small / already-known structured unions built from branch (if/elseif) and loop-body (for-in / while) returns are preserved instead of collapsing to Any. A deep-first branch return seeds the accumulator and a later shallow Int return joins against it, keeping Union{Int64, Tuple{...depth6...}}; for-in and while small tuple / nullable unions are likewise preserved. Migrates the ForEach/While loop accumulator joins (previously plain join, unlike the already-migrated range-based For), the if/try branch return aggregation, the block-level Return/MaybeReturn aggregation, and the return-vs-fallthrough join, all routed through join_limited(.., compare_to = previous_return). Verified against upstream Julia 1.12 (Issue #4273)"
[[tests]]
name = "type_inference_tuple_length_const_5142"
file = "tuple_length_const_5142.jl"
expected = true
description = "length of a fixed-arity tuple is propagated as Const(N) by the type lattice (mirroring upstream nfields_tfunc, which returns Const(length(x.types))). Enables constant folding and branch elimination on tuple-length while keeping observable runtime values identical to upstream Julia; a tuple with a Vararg tail keeps an unknown length (widens to Int64) (Issue #5142)"
[[tests]]
name = "type_inference_isa_flow_narrowing_codegen_5181"
file = "isa_flow_narrowing_codegen_5181.jl"
expected = true
description = "Flow-sensitive isa narrowing is wired into branch codegen: inside an `x isa T` (or `c1 && c2` chain) guarded then-branch, the compiler refines `self.locals[x]` to the concrete ValueType so typed loads / arithmetic specialize. Refinement is saved/restored around the branch so the else path and fall-through keep dynamic dispatch, and a reassignment inside the branch persists (Julia function scoping). Verified parity with upstream Julia for Int64/Float64/String/&&/struct guards plus the negation path (Issue #5181)"
[[tests]]
name = "type_inference_array_eltype_propagation_5083"
file = "array_eltype_propagation_5083.jl"
expected = true
description = "Array element types beyond Int64/Float64 (Int8/16/32, UInt8/16/32/64, Float32, Symbol, Complex) propagate through inference so `a[i]` yields the concrete element type instead of widening to Any. Root cause was value_type_to_lattice_with_table collapsing every unsupported ArrayElementType to LatticeType::Top, erasing the element type and forcing boxed access. Fixed by completing the ArrayElementType to ConcreteType mapping in abstract_interp/struct_info.rs (Issue #5083)"
[[tests]]
name = "type_inference_typeof_eq_narrowing_5140"
file = "typeof_eq_narrowing_5140.jl"
expected = true
description = "typeof(x) === T / == T / !== T / != T (and the reversed operand order) narrow x in conditional branches, equivalent to x isa T for concrete T. A Union{Int,String} argument inferred via Base.infer_return_type matches upstream Julia (Int64 / Union{Int64,Float64}) instead of widening to Any, while x === nothing narrowing is preserved (Issue #5140)"

[[tests]]
name = "type_inference_typeof_codegen_narrowing_5077"
file = "typeof_codegen_narrowing_5077.jl"
expected = true
description = "typeof(x) === T / == T / !== T guards feed branch codegen narrowing for Union{Int64,String}, so narrowed Int64 arithmetic can compile through typed loads/arithmetic while runtime results stay upstream-compatible (Issue #5077)"

[[tests]]
name = "type_inference_union_typed_array_literal_dispatch_5143"
file = "union_typed_array_literal_dispatch_5143.jl"
expected = true
description = "A small-Union-typed array literal (`Union{Int64,Float64}[1, 2.5, 3, 4.0]`) stores each element verbatim instead of coercing the `Float64` members to the first/`Int64` member, so per-element multiple dispatch picks the correct concrete method. Root cause: `heap_julia_type_array_element_type` only recognized `Pair`/`Dict`/`Set`/struct type-literal targets, so a `Union{...}` literal fell through `typed_array_literal_element_type` to the generic `getindex(::DataType, idx)` path that coerced each index to `Int64`. Fixed by recognizing `JuliaType::Union`/`Bottom`/abstract element types as verbatim-store typed literals (Issue #5143)"

[[tests]]
name = "type_inference_union_struct_field_access_5601"
file = "union_struct_field_access_5601.jl"
expected = true
description = "Field access over a Union of struct types infers the join of the per-member field types (upstream getfield_tfunc over a Union) instead of widening to Any; a member lacking the field contributes Bottom. Previously (x::Union{A,B}).n inferred Any for all-struct unions — only struct+primitive unions narrowed (Issue #5601)"

[[tests]]
name = "type_inference_number_isa_narrowing_5941"
file = "number_isa_narrowing_5941.jl"
expected = true
description = "An Int64 argument bound to an abstract-numeric parameter (`x::Number`/`x::Real`, statically `ValueType::F64` in the compiler locals) narrows correctly under `if x isa Int64`. compile_time_isa_result previously treated the representational static F64 as an exact runtime type and folded `x isa Int64` to a constant false, skipping the guarded branch; the fix defers isa folding to runtime for abstract-numeric params (Issue #5941)"

[[tests]]
name = "type_inference_ambiguous_method_return_bottom_5603"
file = "ambiguous_method_return_bottom_5603.jl"
expected = true
description = "Base.infer_return_type reports Union{} and Base.return_types reports no concrete method result for an ambiguous method-table dispatch (Integer,Real vs Real,Integer called with Int64,Int64), while non-ambiguous signatures still infer the selected method return type, matching upstream Julia (Issue #5603)"

[[tests]]
name = "type_inference_bottom_return_snapshot_join_6523"
file = "bottom_return_snapshot_join_6523.jl"
expected = true
description = "A recorded Union{} (Bottom) method-return snapshot re-enters the inference lattice as Bottom (the identity of join), not Top: a caller branching between a call to a MULTI-method callee whose snapshot is Union{} (consulted via MethodSig.return_julia_type — single-method calls never convert through JuliaType) and a Float64 literal infers Float64 instead of Any. Root cause: the canonical JuliaType::Bottom spelling of Union{} fell through julia_type_to_lattice's `_ => Top` arm while the non-canonical Union(vec![]) spelling correctly lowered to Bottom (Issue #6523)"

[[tests]]
name = "type_inference_untyped_redef_inference_5938"
file = "untyped_redef_inference_5938.jl"
expected = true
description = "An untyped, same-signature method redefinition is a replacement (last-definition-wins), not an ambiguous overload, so caller inference stays precise instead of collapsing to Any. `add_function` previously marked any same-name second definition as ambiguous and removed it from the function table; the fix compares fixed-param signatures and overwrites in place when they are equal (Issue #5938)"

[[tests]]
name = "type_inference_parametric_ctor_resolution_5922"
file = "parametric_ctor_resolution_5922.jl"
expected = true
description = "Parametric constructor return-type resolution stays precise after migrating the ctor gates to the tfuncs adapter's StructInstantiation seam: parametric struct ctors infer type args and instantiate on demand (eltype of [CtorPoint5922(1.0,2.0), ...] is the concrete instantiation), `{`-instantiated ctor names (Val{2}(), CtorPoint5922{Int64}()) resolve, and the parametric Rational ctor keeps Rational{Int64} (Issue #5922)"

[[tests]]
name = "type_inference_bottom_throw_return_6532"
file = "bottom_throw_return_6532.jl"
expected = true
description = "throw(x) models Union{} (Bottom) in return-type inference (upstream add_tfunc(throw,1,1,->Bottom,0)): an always-throwing function infers Union{} — including transitively through the pure-Julia error(...) wrappers — and a raising branch contributes nothing to the join (x > 0 ? throws() : 1.5 infers Float64; throw-in-loop keeps the non-raising String return). Runtime raising/catch behavior is unchanged (Issue #6532)"

[[tests]]
name = "type_inference_base_numeric_method_snapshot_precision_6547"
file = "base_numeric_method_snapshot_precision_6547.jl"
expected = true
description = "Base.infer_return_type keeps concrete call-site return types for multi-method Base numeric callees whose storage snapshots may be widened, including clamp, binomial, ndigits, widen, and copysign (Issue #6547)"

[[tests]]
name = "type_inference_prescan_var_pi_6601"
file = "prescan_var_pi_6601.jl"
expected = true
description = "Function-body slot-typing pre-scan: an `Assign` RHS that is a bare `Var` is typed through the shared inference engine, except a bare `pi`/`π` Var keeps the legacy F64 special-case the empty-table engine lacks. `area(r) = (p = pi; g = r; p * g * g)` (and the `π` variant) compute pi*r*r == 12.566370614359172 as Float64 for r=2.0, matching upstream Julia (Issue #6601)"

[[tests]]
name = "type_inference_prescan_funcref_6601"
file = "prescan_funcref_6601.jl"
expected = true
description = "Function-body slot-typing pre-scan: an `Assign` RHS that is an `Expr::FunctionRef` (`f = sin`, `h = square`) is typed via a scoped seam shim reproducing legacy's `ValueType::Function` (the shared engine would widen to Any), and the function value stays callable through the slot. `f = sin; g = cos; f(0.0)+g(0.0) == 1.0` and `h = square; h(3.0) == 9.0` as Float64, matching upstream Julia (Issue #6601)"

[[tests]]
name = "type_inference_prescan_unaryop_6601"
file = "prescan_unaryop_6601.jl"
expected = true
description = "Function-body slot-typing pre-scan: an `Assign` RHS that is an `Expr::UnaryOp` is typed through the shared inference engine after the engine's `tfunc_not`/`tfunc_sub` were fixed to match upstream Julia — `!` (Not) always yields Bool, and `-` (Neg) preserves the concrete operand type, including `Complex{T}`. `d = -c` for `c = 1.0 + 2.0im` is ComplexF64 (-1.0 - 2.0im), and `x = !b` for `b = true` is Bool (false), matching upstream Julia (Issue #6601)"

[[tests]]
name = "type_inference_prescan_tuple_6601"
file = "prescan_tuple_6601.jl"
expected = true
description = "Function-body slot-typing pre-scan: an `Assign` RHS that is an `Expr::TupleLiteral` is typed through the shared inference engine after the engine's `TupleLiteral` arm was fixed to type ANY tuple literal as `Tuple` (upstream Julia: typeof((1, \"x\", [])) == Tuple{...}), instead of collapsing to Any when an element type is non-concrete. `t = (1, x, \"s\")` with a non-concrete `x` slot stays a Tuple and indexes correctly (t[1] + length(t[3]) == 2), an all-concrete `(1, 2.0)` sums to 3.0 (Float64), and an empty `()` has length 0, matching upstream Julia (Issue #6601)"

[[tests]]
name = "type_inference_prescan_fieldaccess_6601"
file = "prescan_fieldaccess_6601.jl"
expected = true
description = "Function-body slot-typing pre-scan: an `Assign` RHS that is an `Expr::FieldAccess` is typed through the shared inference engine after the engine learned the `Expr` builtin's fixed field types (head::Symbol, args::Vector{Any}) — the user struct-table path can't see `Expr`. `describe(:(g(1,2,3)))` reads `h = ex.head` / `a = ex.args` as field-access RHS slots and returns (:call, 4) (args includes the callee `:g`); `typeof(e.head)` is Symbol and `typeof(e.args)` is Vector{Any}, matching upstream Julia (Issue #6601)"

[[tests]]
name = "type_inference_prescan_index_6601"
file = "prescan_index_6601.jl"
expected = true
description = "Function-body slot-typing pre-scan: an `Assign` RHS that is an `Expr::Index` is typed through the shared inference engine as an engine-better class — the engine types `arr[i]` as the precise element type (legacy returned Any), and after this slice's shared `getindex`-tfunc String->Char fix and the engine Index-arm String-slice->String fix, types `s[i]` as Char and `s[1:2]` as String. `idx([10,20,30], \"hello\")` reads `a = arr[1]` / `sub = arr[1:2]` / `c = s[1]` / `ss = s[1:2]` as Index RHS slots returning (10, 2, 'h', \"he\"); typeof of `[10,20,30][1]` is Int64, of `\"hello\"[1]` is Char, and of `\"hello\"[1:2]` is String, matching upstream Julia (Issue #6601)"

[[tests]]
name = "type_inference_prescan_binaryop_6601"
file = "prescan_binaryop_6601.jl"
expected = true
description = "Function-body slot-typing pre-scan: an `Assign` RHS that is an `Expr::BinaryOp` is typed through the shared inference engine as an engine-better class — a new `tfunc_pow` types `a ^ b` as Int^Int->Int (legacy returned Any) and String^Int->String, `tfunc_mul` types `s * s` as String*String->String (legacy returned Any), and the Complex ops `z + x` / `z * z` adopt the canonical ComplexF64 (the bridge canonicalizes Struct{Complex{Float64}}->ComplexF64) where legacy returned F64 / Struct. `ops(2, 10, \"ab\", 1.0 + 2.0im, 3.0)` reads `p = a ^ b` / `cat = s * s` / `cf = z + x` / `cc = z * z` as BinaryOp RHS slots returning (1024, \"abab\", -3.0 + 4.0im, ...); typeof of `2 ^ 10` is Int64, of `\"ab\" * \"ab\"` is String, and of `(1.0 + 2.0im) + 3.0` is ComplexF64, matching upstream Julia (Issue #6601)"

[[tests]]
name = "type_inference_prescan_call_6601"
file = "prescan_call_6601.jl"
expected = true
description = "Function-body slot-typing pre-scan: an `Assign` RHS that is an `Expr::Call` is typed through the shared inference engine as the final corpus class (engine-better) — the shared `tfunc_sqrt` family (sqrt/exp/sin/cos/log) now preserves `Complex` so `exp(z)` is ComplexF64 (legacy widened to Any/Struct), `abs(Complex)` is Float64 (legacy returned ComplexF64), and `zeros(n)` is Vector{Float64} (legacy returned bare Array). `calls(1.0 + 2.0im, 3)` reads `e = exp(z)` / `a = abs(z)` / `zs = zeros(n)` as Call RHS slots returning (ComplexF64, 2.23606797749979, 3); typeof of `exp(1.0 + 2.0im)` is ComplexF64, of `abs(1.0 + 2.0im)` is Float64, and of `zeros(3)` is Vector{Float64}, matching upstream Julia (the #6601 divergence map is now empty) (Issue #6601)"

[[tests]]
name = "type_inference_reflection_predicates_pure_julia_6738"
file = "reflection_predicates_pure_julia_6738.jl"
expected = true
description = "isbits/ismutable/hasfield are pure-Julia public wrappers (base/reflection.jl) over isbitstype/ismutabletype/_fieldnames primitives; match upstream across types and as first-class function values; ismutable(String) divergence fixed (Issue #6738)"
