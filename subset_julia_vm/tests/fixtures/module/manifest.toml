expected = true
description = "Module with using Statistics statement"

[[tests]]
name = "module_with_struct"
file = "module_with_struct.jl"
expected = true
description = "Basic struct definition inside module"

[[tests]]
name = "module_with_parametric_struct"
file = "module_with_parametric_struct.jl"
expected = true
description = "Parametric struct with function inside module"

[[tests]]
