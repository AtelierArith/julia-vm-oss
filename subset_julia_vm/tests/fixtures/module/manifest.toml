[[tests]]
name = "baremodule_basic"
file = "baremodule_basic.jl"
expected = 1.0
description = "Baremodule syntax without automatic Base import"

[[tests]]
name = "module_base_show_dispatch_7172"
file = "module_base_show_dispatch_7172.jl"
expected = true
description = "Issue #7172: Base.show defined inside a module is dispatched by print/string"

[[tests]]
name = "module_qualified_constructor_7172"
file = "module_qualified_constructor_7172.jl"
expected = true
description = "Issue #7172: module-qualified struct constructor M.Point(...) and parametric M.Vec2(...)"

[[tests]]
name = "module_qualified_inner_constructor_7631"
file = "module_qualified_inner_constructor_7631.jl"
expected = true
description = "Issue #7631: module-qualified struct constructor M.Widget() dispatches to the 0-arg inner constructor"

[[tests]]
name = "module_qualified_parametric_inner_constructor_7955"
file = "module_qualified_parametric_inner_constructor_7955.jl"
expected = true
description = "PR #7955: module-qualified parametric constructor M.S(args) dispatches to a matching short-name inner constructor instead of default field construction"

[[tests]]
name = "module_qualified_parametric_inner_field_access_7958"
file = "module_qualified_parametric_inner_field_access_7958.jl"
expected = true
description = "Issue #7958: named field access w.x on a module-qualified parametric inner-constructor instance (Mod.Wrapped(41) -> new{T}(...)) resolves the field table (single/multi param, two same-typed fields) instead of erroring 'has no field x'; getfield(w,1) already worked"

[[tests]]
name = "module_qualified_function_value_before_type_fallback_7955"
file = "module_qualified_function_value_before_type_fallback_7955.jl"
expected = true
description = "PR #7955: module-qualified function value M.S wins over unrelated bare type fallback with the same short name, and qualified module type objects keep owner-qualified names"

[[tests]]
name = "module_conditional_export_7959"
file = "module_conditional_export_7959.jl"
expected = true
description = "Issue #7959: module-level conditional export statements update module names and using imports"

[[tests]]
name = "module_macro_conditional_export_7959"
file = "module_macro_conditional_export_7959.jl"
expected = true
description = "Issue #7959: exports inside a bare macro-expanded quote block (plain or conditional) record into module exports and using imports"

[[tests]]
name = "module_isdefined_alias_scope_7955"
file = "module_isdefined_alias_scope_7955.jl"
expected = true
description = "PR #7955: module aliases stay scoped to their owner while exported aliases remain visible through using"

[[tests]]
name = "module_isdefined_macro_bindings_7948"
file = "module_isdefined_macro_bindings_7948.jl"
expected = true
description = "Issue #7948: function-form isdefined(::Module, Symbol(\"@m\")) consults the macro binding table for owned/exported/imported macros"

[[tests]]
name = "module_selective_using_globals_7955"
file = "module_selective_using_globals_7955.jl"
expected = true
description = "PR #7955: selective using of module globals imports only explicitly selected bindings, including non-exported constants"

[[tests]]
name = "module_macro_module_literal_export_mirroring_7955"
file = "module_macro_module_literal_export_mirroring_7955.jl"
expected = true
description = "PR #7955: macro-expanded names($__module__) sees real module exports without treating hygiene-only members as exported"

[[tests]]
name = "module_qualified_outer_constructor_default_7729"
file = "module_qualified_outer_constructor_default_7729.jl"
expected = true
description = "Issue #7729: module-qualified ctor M.Num(s) reaches the field-count default ctor when the struct also has an outer constructor (has_func branch fallback)"

[[tests]]
name = "module_struct_display_7172"
file = "module_struct_display_7172.jl"
expected = true
description = "Issue #7172: in-scope module struct displays with unqualified type name (Point{Int64})"

[[tests]]
name = "module_callable_struct_7185"
file = "module_callable_struct_7185.jl"
expected = true
description = "Issue #7185: callable struct (functor) defined inside a module is dispatched (internal/external call, parametric, anonymous self, converting ctor)"

[[tests]]
name = "module_relative_named_import_parent_7574"
file = "relative_named_import_parent_7574.jl"
expected = true
description = "Issues #7574/#7594: relative named imports from parent/sibling modules are visible, including module function x"

[[tests]]
name = "module_bare_module_isa_shortname_7963"
file = "module_bare_module_isa_shortname_7963.jl"
expected = true
description = "Issue #7963: bare `Module` isa resolves to Base.Module, not a same-short-name module-local abstract type (Box() isa Module == false)"

[[tests]]
name = "module_base_sqrt_foreign_shadow_8042"
file = "module_base_sqrt_foreign_shadow_8042.jl"
expected = true
description = "Issue #8042: bare/Base.sqrt on an Any-typed Float64 must hit the builtin, not a foreign module's sqrt(::Any) (e.g. NaNMath.sqrt), which would recurse to a stack overflow"

[[tests]]
name = "module_short_type_name_value_8100"
file = "module_short_type_name_value_8100.jl"
expected = true
description = "Issue #8100: a module-private type whose name matches the single-letter/letter+digit type-variable spelling (E, T1), referenced as a value, resolves to its DataType (typeof === DataType, === the qualified name), not a TypeVar; genuine where {T} type params still work"

[[tests]]
name = "module_value_field_access_8113_8114"
file = "module_value_field_access_8113_8114.jl"
expected = true
description = "Issues #8113/#8114: member access through a Module value — nested sub-module (Outer.Inner.T1) and const module alias (const MA = Mod1; MA.S), for type/function/const members, 2+ levels deep incl. alias-rooted nested chains; local param named like a module still shadows it (Issue #7245)"
