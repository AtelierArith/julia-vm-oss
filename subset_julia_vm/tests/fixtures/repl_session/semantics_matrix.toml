name = "repl_session_semantics_matrix"
description = "REPL-specific soft-scope, ans, display suppression, multiline, error recovery, and redefinition behavior."

[[steps]]
name = "global_read_seed"
input = "x = 10"
success = true
stdout = ""
display = "10"

[[steps]]
name = "soft_scope_for_reads_global"
input = """
s = 0
for i in 1:2
    s += x + i
end
s
"""
success = true
stdout = ""
display = "23"

[[steps]]
name = "soft_scope_for_writes_existing_global"
input = """
for i in 1:2
    x += i
end
x
"""
success = true
stdout = ""
display = "13"

[[steps]]
name = "soft_scope_while_writes_existing_global"
input = """
i = 1
while i <= 2
    x += i
    i += 1
end
x
"""
success = true
stdout = ""
display = "16"

