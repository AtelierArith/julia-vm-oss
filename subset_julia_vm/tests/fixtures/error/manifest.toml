# Test manifest for error category

[[tests]]
name = "error_p0_error_types"
file = "test_p0_error_types.jl"
expected = true
description = "P0 error exception types - ErrorException, ArgumentError, etc."

[[tests]]
name = "error_throw_catch"
file = "throw_catch.jl"
expected = true
description = "Try/catch with DomainError and error message extraction"

[[tests]]
name = "error_explicit_throw"
file = "error_explicit_throw.jl"
expected = true
description = "Explicitly thrown exceptions (throw(), error()) are catchable and have correct types (Issue #2847)"

[[tests]]
name = "error_float_arithmetic"
file = "error_float_arithmetic.jl"
expected = true
description = "IEEE 754 float arithmetic: Inf, NaN, isinf, isnan, isfinite (Issue #2847)"

[[tests]]
name = "error_overflow_arithmetic"
file = "error_overflow_arithmetic.jl"
expected = true
description = "factorial(21) raises a catchable OverflowError (upstream message) instead of silently wrapping Int64; factorial(20) still succeeds (Issues #3046, #9326)"

[[tests]]
name = "error_try_finally"
file = "error_try_finally.jl"
expected = true
description = "try/catch/finally semantics: finally always runs regardless of exceptions (Issue #2847)"

[[tests]]
name = "error_nested_try"
file = "error_nested_try.jl"
expected = true
description = "Nested try/catch: inner exceptions, rethrow, sequential blocks (Issue #2847)"

[[tests]]
name = "error_negative_dimensions"
file = "error_negative_dimensions.jl"
expected = true
description = "Negative array dimensions produce catchable ArgumentError instead of silent overflow or VM errors (Issues #2880, #4040)"

[[tests]]
name = "error_division_by_zero"
file = "error_division_by_zero.jl"
expected = true
description = "Integer division by zero raises a catchable error (Issue #2918)"

[[tests]]
name = "error_bounds_error"
file = "error_bounds_error.jl"
expected = true
description = "Out-of-bounds array and tuple access raises catchable errors (Issue #2918)"

[[tests]]
name = "error_inexact_error"
file = "error_inexact_error.jl"
expected = true
description = "Inexact (lossy) float-to-integer conversion raises catchable InexactError (Issue #2918)"

[[tests]]
name = "error_type_error"
file = "error_type_error.jl"
expected = true
description = "Non-boolean in boolean context raises catchable TypeError (Issue #2918)"

[[tests]]
name = "error_pair_bounds_error"
file = "error_pair_bounds_error.jl"
expected = true
description = "Pair/tuple index out of bounds raises catchable BoundsError (Issue #3062)"

[[tests]]
name = "error_integer_inexact"
file = "error_integer_inexact.jl"
expected = true
description = "Integer-to-integer conversion out of range raises catchable InexactError (Issue #3063)"

[[tests]]
name = "error_tuple_first_second"
file = "error_tuple_first_second.jl"
expected = true
description = "first() on empty tuple raises catchable BoundsError (Issue #3068)"

[[tests]]
name = "error_set_pop_empty"
file = "error_set_pop_empty.jl"
expected = true
description = "pop! on empty Set raises catchable ArgumentError (Issue #3068)"

[[tests]]
name = "error_try_catch_widening"
file = "error_try_catch_widening.jl"
expected = true
description = "try/catch type-widening: variables assigned in both branches (Issue #3070)"

[[tests]]
name = "error_typeassert_typeerror_5146"
file = "error_typeassert_typeerror_5146.jl"
expected = true
description = "Failed type assertion TypeError stores offending value in `got` and formats upstream message 'expected T, got a value of type S' (Issue #5146)"

[[tests]]
name = "error_stack_overflow_5969"
file = "error_stack_overflow_5969.jl"
expected = true
description = "Runaway/infinite recursion raises a catchable StackOverflowError instead of OOMing (Issue #5969, prevention for #5966)"

[[tests]]
name = "error_eval_ancestor_catch_5972"
file = "error_eval_ancestor_catch_5972.jl"
expected = true
description = "An error raised inside an eval-driven nested dispatch is caught by an ancestor try/catch (StackOverflow/error/DomainError no longer silently swallowed) (Issue #5972)"

[[tests]]
name = "error_eval_nested_dispatch_catch_5979"
file = "error_eval_nested_dispatch_catch_5979.jl"
expected = true
description = "An error raised through a doubly/triply-nested eval is caught by an ancestor try/catch (the inner Immediate-builtin eval no longer double-handles and clobbers catch_ip) (Issue #5979)"

[[tests]]
name = "error_custom_exception_showerror_8256"
file = "custom_exception_showerror_8256.jl"
expected = true
description = "sprint(showerror, custom exception) dispatches to a package-defined Base.showerror extension (Issue #8256)"

[[tests]]
name = "error_runtime_exception_parity_8732_8744_8745_8747_8748"
file = "runtime_exception_parity_8732_8744_8745_8747_8748.jl"
expected = true
description = "Rust-raised/runtime exception paths remain catchable and construct upstream-shaped exception values: empty pop! ArgumentError, required keyword UndefKeywordError, Dict missing-key KeyError, Julia 1.12 InexactError(func,args), and MethodError showerror no longer crashes (Issues #8732/#8744/#8745/#8747/#8748)."

[[tests]]
name = "error_out_of_memory_budget_8702"
file = "out_of_memory_budget_8702.jl"
expected = true
description = "A known-size allocation that exceeds the VM memory budget raises a catchable OutOfMemoryError with upstream-shaped typeof/showerror (Issue #8702)."
env = { SJULIA_MEMORY_BUDGET_BYTES = "4096" }

[[tests]]
name = "error_method_error"
file = "error_method_error.jl"
expected = true
description = "MethodError is raised and catchable for undefined method dispatch. Registered while closing the fixture-coverage gap (Issue #9360)."

[[tests]]
name = "error_multiple_catch"
file = "error_multiple_catch.jl"
expected = true
description = "Multiple sequential try/catch blocks each catch their own exception. Registered while closing the fixture-coverage gap (Issue #9360)."

[[tests]]
name = "error_stack_overflow"
file = "error_stack_overflow.jl"
expected = true
description = "Unbounded / mutual recursion raises a CATCHABLE StackOverflowError (Issue #2918). This is a deliberate sjulia behavior: the bounded-recursion VM makes stack overflow catchable, unlike upstream julia where it corrupts state. Registered while closing the fixture-coverage gap (Issue #9360)."

[[tests]]
name = "error_string_index"
file = "error_string_index.jl"
expected = true
description = "Out-of-bounds / invalid string indexing raises a catchable error. Registered while closing the fixture-coverage gap (Issue #9360)."

[[tests]]
name = "error_fielderror_parity_10212"
file = "error_fielderror_parity_10212.jl"
expected = true
description = "Nonexistent-field access raises a catchable FieldError (Julia 1.12 shape) instead of TypeError for Expr/GlobalRef/QuoteNode/LineNumberNode/TypeVar, structs (getfield/dot/setfield!), NamedTuple, Ref, DataType, WeakRef, Array, RegexMatch, Generator, and Pairs; a missing module binding raises UndefVarError (Issues #10212/#10318)."

[[tests]]
name = "error_undefvar_module_scope_10318"
file = "error_undefvar_module_scope_10318.jl"
expected = true
description = "Accessing a binding missing from a module (SomeModule.undefined, getfield, or dynamic dot) raises a catchable UndefVarError whose message keeps the module scope ('not defined in `Main.<Module>`'), matching upstream 1.12; e.var stays the bare Symbol and Main resolves to `Main` not `Main.Main` (Issue #10318)."

[[tests]]
name = "error_static_field_fielderror_10319"
file = "error_static_field_fielderror_10319.jl"
expected = true
description = "Nonexistent-field access on a STATICALLY-known receiver type (a concrete struct, a DataType, or any other statically-typed primitive/tuple) defers to a catchable runtime FieldError instead of aborting compilation of the whole program, both for reads (dot access) and writes (field assignment on a mutable struct); valid field access on the same statically-known types keeps working (Issue #10319)."
