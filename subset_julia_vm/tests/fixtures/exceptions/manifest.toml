[[tests]]
name = "exceptions_conditional_branch_splat_call_visibility_11320"
file = "conditional_branch_splat_call_visibility_11320.jl"
expected = true
description = "A method defined in an untaken top-level if branch must stay undefined at runtime: a positional-splat call to it now raises UndefVarError before evaluating the splat argument (side stays 0, matching upstream's callee-before-arguments order for a keyword-free call), and the sibling keyword-argument call form raises the same UndefVarError after its legitimately-upstream-ordered argument evaluation (side_kw becomes 1). Root cause was the eager top-level-definition activation drain treating any statement-scanned function as unconditionally reached by source position, plus the splat dynamic-call path building a callable token with no visibility check at all (Issue #11320; siblings #11286/#10461)"

[[tests]]
name = "exceptions_throw_type_value_preserve_11554"
file = "throw_type_value_preserve_11554.jl"
expected = true
description = "throw(value) preserves the exact thrown value for ANY value, not just Exception subtypes: throw(Int32) binds the caught variable to the Int32 DataType itself (typeof == DataType), the caught value is usable to build a real downstream parametric type (Vector{T} === Vector{Int32}, isa true), and other non-Type values (Int, Float, Symbol, Tuple, Array) are preserved verbatim too — instead of every non-Struct/Any value being coerced into ErrorException(string(value)). Normal Exception throwing (throw(ErrorException(...)), error(msg)) is unchanged (Issue #11554)"

