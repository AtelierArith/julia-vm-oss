description = "Caught exceptions expose upstream's payload fields: BoundsError carries the actual container and complete index tuple, MethodError carries the real callable and arguments for compile-time and numeric-fast-path misses, rendered messages stay unchanged, and a nested MethodError cannot overwrite the outer rethrow payload (Issues #11374/#11647)"

[[tests]]
name = "exceptions_finally_rethrow_swallow_11306"
file = "finally_rethrow_swallow_11306.jl"
expected = true
description = "A finally block whose own body catches an explicit rethrow() with a nested try/catch must not swallow the exception whose unwind entered the finally: the enclosing catch still sees it. Covers the MWE, a nested catch that re-throws again, a double-nested finally, and an unrelated exception fully handled inside the finally. Root cause: the pending-finally rethrow marker was a scalar (rethrow_on_finally) any nested handler routing unconditionally clobbered; now a depth-aware stack (Vm::pending_finally_rethrows) truncated per Handler::finally_pending_len (Issue #11306)"

