[[tests]]
name = "exceptions_catch_binder_signature_shadow_11321"
file = "catch_binder_signature_shadow_11321.jl"
expected = true
description = "A `catch NAME` binder shadows an outer const/type alias spelled NAME for the extent of the clause, including inside a composite annotation (`Vector{T}`): the method definition now raises TypeError (the caught exception is not a Type) instead of silently freezing the annotation to the outer alias's target. A same-clause reassignment of the binder to a resolvable type before the definition is visible to it (dispatches on the new type within the clause). The shadow/rebinding does not leak past the clause's `end` — a definition after the try/catch still sees the outer alias (Issue #11321)"

[[tests]]
name = "exceptions_payload_fields_11374"
file = "exceptions_payload_fields_11374.jl"
