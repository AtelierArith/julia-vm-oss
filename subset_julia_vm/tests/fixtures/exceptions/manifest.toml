[[tests]]
name = "exceptions_catchable_hof_builtin_error_10406"
file = "catchable_hof_builtin_error_10406.jl"
expected = true
description = "A builtin/HOF per-element failure (sqrt(\"a\") directly, and per-element via map(sqrt, ...) / sum(sqrt, ...)) raises a catchable Julia exception a surrounding try/catch observes, instead of aborting the whole program with an uncatchable top-level Runtime error. Root cause: the VM run loop's terminal error arm returned bare-`?`-propagated errors straight out instead of routing catchable ones through the exception-handler machinery (now gated by is_catchable_vm_error so host/internal errors stay uncatchable). Asserts observability only; the caught type is a TypeError (sjulia numeric fast path) vs upstream's MethodError, a separately tracked parity refinement (Refs #10405/#10461) (Issue #10406)"

[[tests]]
name = "exceptions_numeric_fastpath_methoderror_10481"
file = "numeric_fastpath_methoderror_10481.jl"
expected = true
description = "A builtin numeric fast path (SqrtF64/FloorF64/CeilF64, CallBuiltin(Sqrt|Round|Trunc), CallDynamicOrBuiltin rounding, and the runtime intrinsic fallback used by HOF/broadcast per-element calls) whose operand fails the numeric check raises MethodError like upstream's dispatch miss, not the internal conversion TypeError. Covers direct sqrt/floor/ceil/round on a String, dynamic in-function calls, map/sum per-element failures, and broadcast, plus guards that the remap is error-path only: sqrt(-1.0) still DomainError and the numeric results are unchanged. Exact-type refinement deferred from #10406 (Refs #10461/#10405) (Issue #10481)"

[[tests]]
name = "exceptions_exception_taxonomy_funnel_11146"
file = "exception_taxonomy_funnel_11146.jl"
expected = true
description = "Exception CLASSES come from one funnel (VmError::exception_class, subset_julia_vm_bytecode/src/error.rs), not an ad-hoc choice at each raise site (Issue #10813 Phase 2a). Pins the upstream class for the constructs Phase 0/1a measured as divergent: convert-with-no-method and calling a non-callable value are MethodError (not TypeError); wrong-arity <: and a negative Memory size are ArgumentError; Memory OOB is BoundsError; a mid-character byte index is StringIndexError; a Diagonal shape mismatch is DimensionMismatch (all four of those used to be raised as a variant whose MESSAGE named a different class). Guards against over-correction: typeassert stays TypeError and Int(1.5) stays InexactError. Closes with the taxonomy's core invariant -- every catchable failure binds a real Exception, never a bare String. Verified against julia 1.12.6; uses explicit try/catch + isa because @test_throws still ignores its expected type on this base (Issue #10354) (Issue #11146)"

