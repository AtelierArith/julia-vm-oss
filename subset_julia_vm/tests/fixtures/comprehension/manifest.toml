description = "Module-body top-level generator and comprehension expressions collect nested `__gen_body_*` helpers from assignment RHS call arguments, so `sum(i*i for ...)`, `[x+1 for ...]`, and `collect(2x for ...)` work inside a module instead of raising UndefVarError (Issue #10227)"

[[tests]]
name = "comprehension_partition_iterate_protocol_10442"
