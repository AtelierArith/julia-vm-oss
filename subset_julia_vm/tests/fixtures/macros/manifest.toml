description = "@enum members bind at runtime (no UndefVarError), the enum type name resolves to a DataType, members convert to integers via Int(), the type is callable for value->member construction (Color(2) === blue), instances(Color) returns the declaration-ordered tuple, and display shows the member name rather than `Type(value)`. Also fixes the explicit-value lowering bug where `@enum Fruit apple=1` mis-read the `=` operator node as the member value (Issue #5139)"

