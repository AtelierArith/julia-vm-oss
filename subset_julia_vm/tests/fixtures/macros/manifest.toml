[[tests]]
name = "macros_show_macro_form_4865"
file = "show_macro_form_4865.jl"
expected = true
description = "`@show x` emits the value in show-form (matching upstream Julia's `julia/base/show.jl` lowering `println(EXPR_STR * \" = \", repr(value))`), so `@show \"positive\"` prints `x = \"positive\"` (with quotes) and `@show :foo` prints `x = :foo` (with the leading colon) instead of the previous print-form `x = positive` / `x = foo` (Issue #4865)"

[[tests]]
name = "macros_quoted_operator_4872"
file = "quoted_operator_4872.jl"
expected = true
description = "Bare operators inside a quoted expression (`:(%)`, `:(+)`, `:(*)`, `:(==)`, etc.) lower to `Symbol(text)` just like quoted identifiers, instead of crashing with `UnsupportedExpression(\"quote for operator not yet supported\")`. Mirrors the existing `NodeKind::Identifier` arm in `subset_julia_vm/src/lowering/expr/quote/cst_to_constructor.rs` (Issue #4872)"

[[tests]]
name = "macros_quote_vector_parametric_4890"
file = "quote_vector_parametric_4890.jl"
expected = true
description = "Vector literals (`:([1, 2, 3])`) lower to `Expr(:vect, ...)` and parametric type expressions (`:(Tuple{Int, Int})`) lower to `Expr(:curly, base, params...)` — mirrors upstream Julia's `base/expr.jl` lowering convention. Two top-level arms added in `subset_julia_vm/src/lowering/expr/quote/cst_to_constructor.rs` filling the catch-all gaps that surfaced after #4872 fixed the operator-quote slice (Issue #4890)"

[[tests]]
name = "macros_quote_lowering_matrix_4893"
file = "quote_lowering_matrix_4893.jl"
expected = true
description = "Regression-guard matrix for the quote-lowering pass in `cst_to_constructor.rs`: pins the literal / identifier / operator / aggregate / matrix / call / control-flow / assignment / ternary / range forms that currently lower correctly, and documents remaining `NodeKind` variants so the next contributor sees the audit results at-a-glance (Issue #4893)"

[[tests]]
name = "macros_macro_arg_matrix_literal_7733"
file = "macro_arg_matrix_literal_7733.jl"
expected = true
description = "Matrix literals passed as macro arguments arrive as upstream-shaped Expr(:vcat, Expr(:row, ...), ...) values instead of failing quote lowering with `quote for matrix_expression not yet supported` (Issue #7733)"

[[tests]]
name = "macros_quote_nothing_missing_symbol_4895"
file = "quote_nothing_missing_symbol_4895.jl"
expected = true
description = "`:(nothing)` / `:(missing)` quote to the Symbols `:nothing` / `:missing` (matching upstream Julia), not the literal `nothing` / `missing` values, while `:(true)` / `:(false)` stay literal Bool nodes. The value-keyword handling in `lowering/expr/quote/code_generation.rs` lets the Pure-Julia `@test` macro's trailing-`nothing` `quote ... end` block still resolve to the `nothing` value during macro expansion (Issue #4895)"

[[tests]]
name = "macros_quote_field_access_4899"
file = "quote_field_access_4899.jl"
expected = true
description = "`:(a.b)` lowers to `Expr(:., :a, QuoteNode(:b))` (upstream Julia's canonical shape) via a new `NodeKind::FieldExpression` arm in `lowering/expr/quote/cst_to_constructor.rs`, instead of crashing with `UnsupportedExpression(\"quote for field_expression not yet supported\")`. Covers bare field access and nested chains; the call-with-dotted-callee form is tracked separately as #4901 (Issue #4899)"

[[tests]]
name = "macros_quote_splat_4904"
file = "quote_splat_4904.jl"
expected = true
description = "`:(f(args...))` lowers to `Expr(:call, :f, Expr(:..., :args))` via a new `NodeKind::SplatExpression` arm in `lowering/expr/quote/cst_to_constructor.rs`. Covers leading splat, splat in the middle of an arg list, and splat of an arbitrary nested expression (Issue #4904)"

[[tests]]
name = "macros_symbol_dot_literal_4908"
file = "symbol_dot_literal_4908.jl"
expected = true
description = "`:.` and `:...` parse as the Symbols `Symbol(\".\")` and `Symbol(\"...\")`. Previously rejected with `ParseFailed` because `Token::Dot` / `Token::Ellipsis` are not in `Token::is_operator()` and fell through to the standalone-colon arm in `parse_colon_prefix`. Added an explicit arm; lets PRs #4903 / #4906 use the colon-literal sugar for field-access and splat Expr-head assertions instead of `Symbol(name)` workarounds (Issue #4908)"

[[tests]]
name = "macros_quote_metaquote_4911"
file = "quote_metaquote_4911.jl"
expected = true
description = "`:(:foo)` (meta-quote of a Symbol) lowers to `QuoteNode(:foo)` via a new `NodeKind::QuoteExpression` arm in `lowering/expr/quote/cst_to_constructor.rs`. Handles both the leaf form (parses Symbol name from leaf text) and the with-children form (recurses and wraps result in QuoteNode) (Issue #4911)"

[[tests]]
name = "macros_quotenode_egal_4915"
file = "quotenode_egal_4915.jl"
expected = true
description = "`===` on two QuoteNode values compares the wrapped inner values structurally (mirrors the `Expr` arm in the `Egal` builtin's main match). Previously fell through to `_ => false`. The `==` operator still errors with `Cannot convert QuoteNode to I64` at compile time; the compile-time fix is the remaining piece of #4915 (Issue #4915 — partial)"

[[tests]]
name = "macros_quote_metaquote_expr_4920"
file = "quote_metaquote_expr_4920.jl"
expected = true
description = "Meta-quote with a complex Expr inner (`:(:(x + y))`, `:(:(f(a, b)))`) now lowers to `Expr(:quote, complex_expr)` instead of `QuoteNode(complex_expr)`, matching upstream Julia's `QuoteNode(atom)` vs `Expr(:quote, complex)` discrimination. Atom-inner meta-quote (e.g. `:(:foo)`) continues to produce QuoteNode per PR #4914 (Issue #4920)"

[[tests]]
name = "macros_colon_literal_4923"
file = "colon_literal_4923.jl"
expected = true
description = "`:42`, `:3.14`, `:\"hello\"`, `:'A'` (colon-prefix on a literal) parses and evaluates to the literal value (`typeof(:42) === Int64`). Adds a literal-token arm to `parse_colon_prefix`, restructures `lower_quote_expr` to branch on `children.is_empty()` instead of the text-shape heuristic, and adds a missing `NodeKind::CharacterLiteral` arm to `cst_to_expr_constructor`. The nested case `:(:42) isa QuoteNode` still holds (Issue #4923)"

[[tests]]
name = "macros_colon_hex_type_4927"
file = "colon_hex_type_4927.jl"
expected = true
description = "`:0xFF`, `:0x100`, `:0b1010`, etc. preserve their hex/binary/octal UInt8/UInt16/… natural types instead of evaluating to Int64. The `cst_to_expr_constructor::IntegerLiteral` arm now delegates to the shared `lower_integer_literal` helper (which uses `parse_int_typed` and wraps in a UInt constructor for typed literals); decimal literals continue to evaluate to Int64 as the regression guard pins (Issue #4927)"

[[tests]]
name = "macros_quote_call_dotted_callee_4901"
file = "quote_call_dotted_callee_4901.jl"
expected = true
description = "`:(Base.foo(x))` — a call with a dotted callee — lowers to `Expr(:call, Expr(:., :Base, QuoteNode(:foo)), :x)` instead of collapsing the callee to a single `Symbol(\"Base.foo\")`. The `NodeKind::CallExpression` arm in `cst_to_constructor.rs` now recurses into the callee via `cst_to_expr_constructor` (which routes a `FieldExpression` callee through the arm added in PR #4903 for #4899) rather than extracting the callee's raw text. Plain-identifier and operator callees continue to emit `Symbol(text)` because their arms already do (Issue #4901)"

[[tests]]
name = "macros_quote_assign_dotted_lhs_4993"
file = "quote_assign_dotted_lhs_4993.jl"
expected = true
description = "`:(x.y = z)` — assignment with a dotted LHS — lowers to `Expr(:(=), Expr(:., :x, QuoteNode(:y)), :z)` instead of collapsing the LHS to a single `Symbol(\"x.y\")`. The `NodeKind::Assignment` arm in `cst_to_constructor.rs` now recurses into the target via `cst_to_expr_constructor` (routing a `FieldExpression` LHS through the arm added in PR #4903 for #4899). Structurally identical to PR #4992's fix for the `CallExpression` callee path. Plain identifier LHS continues to emit `Symbol(text)` via its own arm (Issue #4993)"

[[tests]]
name = "macros_quote_assign_typed_lhs_7622"
file = "quote_assign_typed_lhs_7622.jl"
expected = true
description = "`:(x::Int = nothing)` keeps the typed assignment LHS as `Expr(:(::), :x, :Int)` instead of collapsing it to `Symbol(\"x::Int\")` (Issue #7622)"

[[tests]]
name = "macros_show_multiarg_4868"
