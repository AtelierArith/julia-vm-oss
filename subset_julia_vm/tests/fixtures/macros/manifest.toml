description = "@show x y z with multiple arguments lowers and runs, returning the value of the last argument. base/macros.jl's `macro show(ex)` becomes `macro show(exs...)`, looping over arguments and emitting one _do_show(expr_str, value) per arg (mirroring upstream julia/base/show.jl) (Issue #4868)"

[[tests]]
name = "macros_macro_arg_space_paren_5494"
file = "macro_arg_space_paren_5494.jl"
expected = true
description = "Space-separated macro arguments are whitespace-sensitive at the `(`/`[` boundary, matching upstream Julia: `@m Ident (expr)` is two arguments (`Ident`, `(expr)`), `@m foo(bar)` is one call argument. The parser now sets `macro_arg_space_sensitive` while parsing each space-separated macro argument and `try_parse_postfix` refuses to fuse a `(`/`[` that is preceded by whitespace; the flag is cleared inside any grouping so sjulia's lenient `f (x)` call parsing at ordinary expression position is preserved. Fixes `@test_throws TypeError (1 + 1)::Float64` being mis-parsed as one argument `(TypeError(1 + 1))::Float64` (Issue #5494)"

[[tests]]
name = "macros_enum_runtime_5139"
