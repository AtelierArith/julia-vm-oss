description = "A genuine Vector{Any} keeps the Any[...] element-type prefix in show/print/string/repr even when its elements all print as a narrower implicit type (Any[1, 2, 3], Any[1.0, 2.0], Any[\"a\", \"b\"]), matching upstream's type-driven typeinfo_prefix (typeinfo_implicit(Any)==false). Issue #7303: sjulia's value-driven Any-eltype prefix derivation dropped the prefix for a homogeneous scalar run, printing [1, 2, 3]. Fix (_array_show_prefix in base/io.jl + array_show_prefix in vm/formatting/mod.rs): for an Any tag the prefix is dropped only when ALL elements are inference-widened composites (Pair/Tuple/nested array) — the cases sjulia widens to Any but upstream infers precisely ([1 => 1] stays bare); a scalar implicit run under Any means an explicit Any[...] literal and keeps the prefix. Narrow eltypes unregressed: Int[1,2]->[1, 2], Real[1,2]->Real[1, 2], Any[1,\"x\"]->Any[1, \"x\"]. Verified at parity vs julia 1.12.6 (scripts/fixture_julia_parity.sh)."

[[tests]]
name = "array_typed_struct_array_eltype_7304"
file = "typed_struct_array_eltype_7304.jl"
expected = true
description = "Vector{T}(undef, n) and the typed-array literal T[...] preserve a user-struct element type T (Vector{PP}/Vector{MM}) instead of widening to Vector{Any} (Issue #7304). sjulia kept builtin primitive eltypes but boxed user structs into ArrayElementType::Any because the type-name->element-type mapping only knew primitive names AND the StructOf(type_id) tag rendered as Any (no struct registry in julia_type_name/array_element_type_to_julia_type). Fix: produce StructOf(type_id) for registered user structs at construction (array_element_type_from_julia_type_resolved on NewMemoryDynamicTyped; heap_julia_type_array_element_type_resolved on the typed-literal compile path) and resolve StructOf back to the struct name at the typeof/eltype display boundary via struct_defs (memory_element_type_name / array_element_type_to_julia_type_resolved / array_wrapper_julia_type_resolved). Builtin primitives (Vector{Int8}, Int[...]) and Vector{Any} unregressed. Verified at parity vs julia 1.12.6 (scripts/fixture_julia_parity.sh)."

