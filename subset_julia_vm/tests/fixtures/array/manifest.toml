[[tests]]
name = "array_show_eltype_prefix_5236_5237"
file = "show_eltype_prefix_5236_5237.jl"
expected = true
description = "Array show emits the upstream typeinfo_prefix type prefix for non-implicit eltypes — Int8[...]/Float32[...]/Bool[1, 0]/Foo[...] and Any[...] for heterogeneous Any arrays — and nothing for implicit eltypes (Int64/Float64/Char/String/Symbol/implicit Tuple/Pair), across print/string/repr/sprint(show, ...). Mirrors base/arrayshow.jl typeinfo_prefix/typeinfo_implicit in base/io.jl _show_vector_compact/_show_matrix_compact and vm/formatting.rs array_show_prefix. Asserts only the cases where sjulia's inferred eltype already matches upstream Julia 1.12 (Issues #5236 / #5237)"

[[tests]]
