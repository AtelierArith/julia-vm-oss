description = "Issue #11113 (sibling of #11104): a const alias of a BASE/STDLIB-declared type (Pair, Regex, UnitRange, VersionNumber) used as a parameter annotation dispatches, at top level and module-local. Lowering's alias gate cannot see Base's declared type names (Base is lowered in an isolated pass, or never lowered at all under the Base cache), so the compiler resolves any bare-identifier const binding still unregistered after lowering through struct_table (Pure-Julia structs) and the compiler-visible builtin-type registry (native VM types with no struct_table entry) — both populated in either cache mode. Covers a parametric use of the alias and re-checks the #11104 builtin/program-declared controls alongside it."

