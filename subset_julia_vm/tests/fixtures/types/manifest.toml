description = "Issue #10934: a function-body parametric type expression consults the active lexical where-binder before classifying a builtin spelling as static. `f(x::Float64) where Float64<:Real = Vector{Float64}` now returns Vector{Int64} for an Int64 argument instead of freezing the body occurrence to builtin Float64; covers short/full/operator definitions, nested Vector/Dict/Tuple applications, the top type Any as a second builtin-name collision, runtime type-constructor bases (`F{Float64}`, `F{Vector{Float64}}`, and nested binder base `A{A{Int64}}`) whose source-text fast path must retain binders as runtime values, a binder shadowing a registered type alias in base position, and anonymous bounds (`Vector{<:Float64}`)."

[[tests]]
name = "types_where_binder_closure_body_11031"
file = "where_binder_closure_body_11031.jl"
