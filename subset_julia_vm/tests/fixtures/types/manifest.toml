[[tests]]
name = "types_where_binder_qualified_shadow_10280"
file = "where_binder_qualified_shadow_10280.jl"
expected = true
description = "Issue #10280 (epic #10049): a where-clause TypeVar binder shadows only the BARE (unqualified) spelling of its name; an explicitly module-qualified reference whose last component equals the binder name (`Core.Builtin` under `where Builtin`, or a user/Base-qualified path like `Base.RefValue{Int64}`) is NOT shadowed, so the binder is unused and the `where` collapses to the concrete DataType. Previously the keep-vs-drop check tokenized `Core.Builtin` and matched the bare token `Builtin`, wrongly keeping a spurious UnionAll. The fix skips `.`-preceded (module-qualified) tokens generally, not a `Core.` special case. Also guards that ordinary bare binders (including the #10100 builtin-name shadow `Int64<:Real`) still keep their where."

[[tests]]
name = "types_typejoin_partial_param_widen_10091"
file = "typejoin_partial_param_widen_10091.jl"
expected = true
description = "Issue #10091 (tech-debt epic #10049): typejoin's same-typename branch widens ONLY the differing parametric parameter positions to a fresh where-bound TypeVar (via UnionAll), keeping every agreeing parameter, instead of collapsing straight to the bare wrapper. Covers the MWE's two rows (differing trailing / leading param), a 3-param differing-middle-position case, and a value-kind (non-Type, rank-like) differing parameter. Trailing-differing cases assert lattice semantics via `<:` rather than display strings because of a separate known display-elision gap (Issue #10195). Also covers the dependent-bound follow-up (a later param's declared bound references an earlier one, e.g. `struct Dep2{A, B<:A}`): the earlier position's resolved value must substitute into the later position's bound (agreeing leading param, both differ, and a 2-level dependency chain with only the trailing or both trailing positions differing), otherwise the join escapes a free TypeVar and is not a valid upper bound. Issue #10252 guards that TypeVar identity cache entries from one dependent-bound wrapper do not leak into another wrapper that reuses the same parameter names. Also covers a partial UnionAll result fed back into typejoin as an operand (reduce/mapreduce-style accumulation), which must be unwrapped ahead of the DataType-only paths."

[[tests]]
name = "types_typejoin_dependent_bound_name_collision_10252"
file = "typejoin_dependent_bound_name_collision_10252.jl"
expected = true
description = "Issues #10252/#10261: dependent TypeVar bounds preserve owner-scoped object identity (`B.ub === A`, `C.ub === B`) across a UnionAll wrapper chain. Reproduces the Dep2/Dep3 same-name collision and requires exact upstream typejoin precision after the collision (`Dep3{Number,B,C} where {B<:Number,C<:B}`), in addition to both operands remaining subtypes. Also pins upstream `within_typevar` behavior for composite, upper, and lower bounds containing a free runtime variable, plus arbitrary-rank Array parameter identity."

