file = "where_subtype_existsright_5047.jl"
expected = true
description = "Exists-right subtype solving A <: (B where V...) where the RHS is a UnionAll value (#5569): finds bound-variable bindings making A <: B[bindings] under each var's bounds and the diagonal rule. Re-parses the rendered `Body where V` surface name into CoreType::UnionAll so the existing matches_unionall_pattern solver fires, and gates check_subtype off the legacy string heuristics for where-bearing operands. Covers diagonal (Tuple{Int,Int} true, Tuple{Int,String}/Tuple{Int,Real} false), bounds (Vector{Int}<:Vector{T} where T<:Real true, Vector{String} false, Tuple{T,T} where T<:Integer/AbstractString), multi-var (Tuple{T,S} where {T,S}, Dict{K,V} where {K,V}), Vararg (Tuple{Vararg{T}} where T), plus must-stay-correct invariant non-where guards. Bare-typevar-body collapse is covered separately by Issue #5570. Advances Issue #5047"

