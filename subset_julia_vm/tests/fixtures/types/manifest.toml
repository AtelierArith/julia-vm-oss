[[tests]]
name = "types_type_application_matrix_10556"
file = "type_application_matrix_10556.jl"
expected = true
description = "Issue #10556 prevention: static-vs-dynamic type-application parity matrix. Exercises T{args...} and Core.apply_type across static syntax vs runtime-held bases (local / function parameter) and positional vs one-or-more-splat forms, over valid full/partial applications and invalid upper-bound, lower-bound, over-arity (leftover params after binders), non-type-base, and concrete-base cases, comparing success values or thrown exception classes against upstream julia. Includes a user parametric type with upper+lower bounds and >=2 binders. Every ConstructParametricType*/ApplyTypeDynamic*/PushDataType opcode is emitted and pinned; scripts/check_type_application_matrix.sh fails when a new type-application opcode is unrepresented. The fixture asserts only cases matching upstream (parity-comparable); currently-diverging cases are tracked in docs/vm/TYPE_APPLICATION_MATRIX_SKIPLIST.tsv (#10643 chained-literal, #10654 literal bare base, #10586 under-applied builtin). #10554 (static-path bound/arity), #10642 (lower-bound >:), and #10587 (Core.apply_type bare base) are fixed on main and asserted on both static and dynamic paths."

[[tests]]
name = "types_string_ctor_value_param_10597"
file = "types_string_ctor_value_param_10597.jl"
expected = true
description = "Issue #10597: the uppercase `String` constructor applied to a where-bound value parameter (`g(::VP{v}) where {v} = String(v)`) compiles and dispatches `String(::Symbol)` on the runtime value instead of raising a spurious compile-time `Unknown function: String`. `String` has a pure-Julia method table but no builtin op, so the static builtin-fallback arm misrouted the runtime-unknown value-parameter argument to `compile_builtin_call`; the value-type-parameter argument now defers to runtime dynamic dispatch like an `Any`-typed argument. Keeps the sibling `string(v)` / `Symbol(v)` constructors and `String(x)` on a type-parameter value argument green."

[[tests]]
name = "types_pair_unionall_param_collapse_10635"
file = "pair_unionall_param_collapse_10635.jl"
expected = true
description = "Issue #10635: a `where` binder whose variable repeats in an earlier parameter position (`Pair{T, T} where T`, or nested as in `Pair{Vector{B}, B} where B`, and the same for user-defined two-parameter families) is no longer elided from the printed parameter list. `format_left_prefix_partial_unionall` now mirrors upstream `show_can_elide`: a trailing where-bound variable is dropped only when it does not also occur among the retained prefix parameters. This fixes both the collapsed display (`Pair{T}`) and structural subtyping (`x <: y` / `y <: x`), since `<:` stringifies through the collapsed name. Positive controls keep the #10192 partial-application shortening (`Pair{Int64, B} where B` -> `Pair{Int64}`) working, with token-boundary matching so `Bool` does not block eliding binder `B`."

[[tests]]
name = "types_apply_type_builtin_base_eligibility_10586"
file = "apply_type_builtin_base_eligibility_10586.jl"
expected = true
description = "Issue #10586: an under-applied builtin parametric family (Array{Float64}, Dict{String}) evaluates to a trailing UnionAll that is `isa UnionAll`, has `typeof == UnionAll`, equals Core.apply_type(Array, Float64), takes its remaining parameter (Array{Float64}{2} === Matrix{Float64}), and stays constructible (Array{Float64}(undef, n), zeros, ::Type{Array{T}} element binding); also regression-guards that Core.apply_type on a bare non-parametric base (Int64/Real/Bool/String, a non-parametric struct/abstract type, or one traced through a variable) raises TypeError (Issue #10587) and preserves #10422 fully-applied concrete-base TypeError."

[[tests]]
name = "types_where_binder_body_builtin_shadow_10934"
