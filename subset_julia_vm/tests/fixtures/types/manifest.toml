[[tests]]
name = "types_where_subtype_forallleft_5047"
file = "where_subtype_forallleft_5047.jl"
expected = true
description = "Forall-left subtype solving (B where V...) <: C where the LHS is a UnionAll value (#5569): introduces a fresh RIGID variable per bound var (confined to its declared bounds) and checks B[rigid] <: C for ALL such choices. substitute_typevar_bound rewrites the body's bound occurrences — parsed as unbounded typevars by from_julia_name — with the bound-carrying var so the declared upper bound flows into the check; combined with the exists-right solver (#5571) this yields forall-exists ALTERNATION for single/diagonal-var cases. Covers bare bounded var (Vector{T} where T <: AbstractVector / not Vector{Int}, Tuple{T,T} where T <: Tuple), builtin alias (Array <: AbstractArray), representative both-sides-where Issue #5049 cases (Tuple{T,T} where T <: Tuple{S,U} where {S,U} true, reverse false), alternation (Tuple{T} where T<:Integer <: Tuple{S} where S<:Real true, reverse false, invariant Vector{T} where T<:Integer <: Vector{S} where S<:Real true, diagonal Tuple{T,T} where T<:Integer <: Tuple{S,S} where S<:Real true via TypeVar-as-concrete-diagonal). Regression-guards exists-right (#5571) + invariant + non-where. Vector<:AbstractVector excluded (bare Vector renders as rank-erased Array). Advances Issue #5047 and closes Issue #5049"

[[tests]]
name = "types_nested_alias_param_subtype_5047"
file = "nested_alias_param_subtype_5047.jl"
expected = true
description = "Nested / alias-spelled parametric params in the exists-right where subtype solver. A nested parametric param (Box{Box{Int}}) renders with the 64-bit word alias Int (not canonical Int64), parsing to an opaque Named(Int); the subtype relation now resolves Named(Int)/Named(UInt) to Int64/UInt64 so the structured matcher runs the bound check on the concrete primitive (from_julia_name keeps the Named spelling so type-propagation/dispatch are unchanged). Covers nested bounded exists-right (Box{Box{Int}} <: Box{Box{T}} where T<:Integer/Number/Real true, String/Float64 false), UInt word alias (T<:Unsigned/Integer true, Signed false), alias in user where-bound clause (Box{Int} <: Box{T} where T<:Int), triple nesting + diagonal, and regression guards (explicit Int64, unbounded where T, plain invariant). Advances Issue #5047"

[[tests]]
name = "types_struct_forall_left_abstract_parent_5614"
file = "types_struct_forall_left_abstract_parent_5614.jl"
