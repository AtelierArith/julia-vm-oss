[[tests]]
name = "types_signature_forward_reference_eval_typed_param_gap_11025"
file = "signature_forward_reference_eval_typed_param_gap_11025.jl"
expected = true
description = "Upstream Julia raises UndefVarError at eval-time for a runtime-eval'd method signature naming a not-yet-defined type, because it evaluates signature annotations EAGERLY when the definition executes. sjulia now mirrors that (probe_eval_signature_annotations, the runtime sibling of the compiled path's Instr::LoadAny probes): the gap this file was split out to track — eval's typed-parameter path raised VmError::NotImplemented, which per Issue #8664 had no Julia exception object at all, so typeof(caught) was a bare String — is CLOSED by Issue #11146 (#10813 Phase 2a). The @test_broken wrappers and skip_julia_test are therefore removed exactly as Issue #10354 predicted they would be, and the assertions are real @test_throws (type-checking since #10354). Both interpreters now agree; verified against julia 1.12.6 (Issues #11025, #10354, #11146)."

