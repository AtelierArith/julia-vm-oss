description = "Forall-left where-form over a user-defined PARAMETRIC struct resolves its declared abstract parent: (Circle{T} where T) <: Shape is true upstream for struct Circle{T<:Real} <: Shape, but sjulia reported false. The where operand is decided authoritatively by the structured CoreType solver (it does not fall through to the runtime reflection table that handles brace-free Circle{Int} <: Shape), which lacked a (Struct, Named) arm AND never received parametric user structs in its STRUCT_PARENT_REGISTRY (they instantiate lazily, outside struct_defs, Issue #5052). Fix adds the (Struct, Named) arm to CoreType::is_subtype_of and seeds parametric_structs' (base name -> declared parent base name) into the inference registry alongside struct_defs/abstract_types. Covers explicit where (Circle{T} where T / where T<:Real / where T<:Integer), multi-level user-abstract chains (Dog{T} -> Mammal -> Animal), parametric abstract parent (MyVec{T} <: Wrapper{T} so bare Wrapper matches while invariant Wrapper{Int} does not), and negative/regression guards. Advances Issue #5047"

