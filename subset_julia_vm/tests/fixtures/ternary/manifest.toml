# Test manifest for ternary category

[[tests]]
name = "ternary_comparison_then_branch_8314"
file = "comparison_then_branch_8314.jl"
expected = true
description = "Comparison operator in a ternary then-branch parses; the `:` is the separator, not a range. Parenthesized ranges in the then-branch still work (Issue #8314)"

[[tests]]
name = "ternary_else_branch_range_8318"
file = "else_branch_range_8318.jl"
expected = true
description = "An unparenthesized range in the ternary else-branch keeps its `:` as a range operator: `cond ? a : b:c` is `cond ? a : (b:c)` (Issue #8318)"

