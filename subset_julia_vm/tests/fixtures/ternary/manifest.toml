[[tests]]
name = "ternary_multiline_newline_4862"
file = "multiline_newline_4862.jl"
expected = true
description = "Newline immediately after `?` (and after the inner `:`) in a multi-line ternary parses as a continuation; previously rejected with `ParseFailed(\"unexpected token '\\n' ..., expected expression\")` because the ternary dispatch path bypassed the binary-operator continuation loop (Issue #4862)"

