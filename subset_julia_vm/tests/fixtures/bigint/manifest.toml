# Test manifest for bigint category

[[tests]]
name = "bigint_predicates"
file = "predicates.jl"
expected = true
description = "BigInt predicates: iszero, isone, sign (Issue #416)"

[[tests]]
name = "bigint_string_macro"
file = "string_macro.jl"
expected = 8.0
description = "big string macro: big\"...\" creates BigInt literal (Issue #556)"

[[tests]]
name = "bigfloat_string_macro"
file = "big_float_literals.jl"
expected = true
description = "big string macro: big\"100.0\" creates BigFloat literal (Issue #554)"

[[tests]]
name = "bigint_type_preservation"
file = "type_preservation.jl"
expected = true
description = "BigInt type preservation for arithmetic operations (Issue #1688, #1696)"

[[tests]]
name = "bigint_power"
file = "power.jl"
expected = true
description = "BigInt power with Int64 exponent (Issue #1708)"

[[tests]]
name = "bigint_bigint_pow_7608"
file = "bigint_bigint_pow_7608.jl"
expected = true
description = "BigInt power accepts a BigInt exponent and preserves BigInt results (Issue #7608)"

[[tests]]
name = "bigint_big_type_inference"
file = "big_type_inference.jl"
expected = true
description = "big() return type correctly inferred for method dispatch (Issue #1910)"

[[tests]]
name = "bigfloat_arithmetic"
file = "bigfloat_arithmetic.jl"
expected = true
description = "BigFloat arithmetic, mixed-type promotion, and comparisons (Issue #2496)"

[[tests]]
name = "bigint_promotion"
file = "bigint_promotion.jl"
expected = true
description = "BigInt promotion, mixed-type operations, and subtype dispatch (Issue #2492, #2496)"

[[tests]]
name = "bigint_abstract_numeric_dispatch"
file = "abstract_numeric_dispatch.jl"
expected = true
description = "BigInt/BigFloat arithmetic inside ::Number/::Real/::Integer-typed functions (Issue #2498)"

[[tests]]
name = "bigint_promote_bigint_integer"
file = "promote_bigint_integer.jl"
expected = true
description = "BigInt promotion with integer types: promote(big(1), 3) returns (BigInt, BigInt) (Issue #2512)"

[[tests]]
name = "bigint_literal_inference_3530"
file = "literal_inference_3530.jl"
expected = true
description = "Int128/BigInt/BigFloat literals preserve their types in inference (Issue #3530)"

[[tests]]
name = "bigint_annotation_inference"
file = "annotation_inference.jl"
expected = true
description = "::BigInt/::BigFloat/::Symbol/::Nothing/::Missing annotations preserve their declared type instead of degrading to Top (Issue #3531)"

[[tests]]
name = "bigint_coercion_narrow_integers"
file = "coercion_narrow_integers.jl"
expected = true
description = "BigInt arithmetic accepts every primitive integer operand (Bool/UInt8-128/Int8-128) (Issue #3748)"

[[tests]]
name = "bigint_coercion_bigint_float"
file = "coercion_bigint_float.jl"
expected = true
description = "BigInt + Float64/Float32/Float16 promotes to BigFloat (Issue #3743)"

[[tests]]
name = "bigint_coercion_bigfloat_primitives"
file = "coercion_bigfloat_primitives.jl"
expected = true
description = "BigFloat arithmetic accepts every primitive numeric operand (Float32/16, Int128, narrow signed, unsigned, Bool) (Issue #3749)"

[[tests]]
name = "bigint_reference_identity_4886"
file = "reference_identity_4886.jl"
expected = true
description = "BigInt/BigFloat === follows reference identity for independently allocated equal values (Issue #4886)"

[[tests]]
name = "bigint_any_array_slot_addition_8262"
file = "any_array_slot_addition_8262.jl"
expected = true
description = "Adding BigInt values loaded through an Any array slot preserves BigInt instead of widening to Float64 (Issue #8262)"

[[tests]]
name = "bigint_matrix_bigint_assignment_8266"
file = "matrix_bigint_assignment_8266.jl"
expected = true
description = "Assigning BigInt into a Matrix{BigInt} slot reads back as BigInt instead of widening to Float64 (Issue #8266)"

[[tests]]
name = "bigint_inv_bigint_7309"
file = "inv_bigint_7309.jl"
expected = true
description = "inv(::BigInt) returns a BigFloat (inv(big(2)) == 0.5) instead of integer division (1 ÷ 2 == 0); mirrors upstream inv(x::Integer) = float(one(x))/float(x), while inv(::Int)/inv(::Float64) stay Float64 (Issue #7309)"
