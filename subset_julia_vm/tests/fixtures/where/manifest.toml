# Test manifest for where category

[[tests]]
name = "where_basic_unbounded"
file = "basic_unbounded.jl"
expected = true
description = "Function with unbounded where clause (where T)"

[[tests]]
name = "where_bounded_real"
file = "bounded_real.jl"
expected = true
description = "Function with bounded where clause (where T<:Real) - identity function"

[[tests]]
name = "where_short_function"
file = "short_function.jl"
expected = 6.0
description = "Short function syntax with where clause"

[[tests]]
name = "where_multiple_params"
file = "multiple_params.jl"
expected = true
description = "Function with multiple type parameters in where clause - returns first arg"

[[tests]]
name = "where_parametric_complex"
file = "parametric_complex.jl"
expected = true
description = "Parametric dispatch: Complex{Float64} matches Complex{T} where T<:Real"

[[tests]]
name = "where_unionall_basic"
file = "unionall_basic.jl"
