expected = true
description = "Issue #8158: a module-qualified call Module.f(x) defers to runtime multiple dispatch exactly like the unqualified f(x). When the argument is statically Any (an untyped parameter or a keyword arg with a default) and the callee has a catch-all f(::Any) method, the qualified path previously bound the catch-all statically and silently skipped a more-specific method (the SciMLBase _callbacks(::CallbackSet) mis-dispatch that disabled every callback in a CallbackSet). The shared should_runtime_dispatch policy now drives both the bare and qualified call paths. Covers single-arg and multi-arg qualified calls via positional and keyword arguments, the catch-all still winning for a non-matching value, and a precisely-typed direct call; parity-clean with upstream julia."

