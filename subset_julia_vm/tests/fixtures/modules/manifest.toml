[[tests]]
name = "modules_struct_dispatch_owner_identity_11076"
file = "module_struct_dispatch_owner_identity_11076.jl"
expected = true
description = "Issue #11076 (dispatch-matching sibling of Issue #11021, both found investigating Issue #10989): a same-named GENERIC struct declared in sibling/nested modules and referenced BARE (no explicit `{...}`) as a method parameter type no longer makes dispatch wrongly ambiguous; the runtime matcher's `Vm::type_matches` (vm/dispatch.rs) now applies the SAME asymmetric owner rule as #11021 (`subset_julia_vm_types::types::struct_owners_compatible`, exposed `pub` and reused, not re-derived) before falling through to the module-stripped fast path or the owner-blind `check_subtype` fallback. A genuine (non-module) ambiguity is still correctly reported. Scope note (see in-file comment): non-generic sibling-module structs, explicitly-parametric annotations (`x::A1x.Box{Int}`), and bare names colliding with the internal builtin-container family list hit a DIFFERENT, deeper bug -- `MethodTable::add_method` silently collapses the second same-family method at REGISTRATION time because `core_signature` (`CoreType`) is module-stripped -- tracked separately as Issue #11094, deferred to Issue #11078."

[[tests]]
