[[tests]]
name = "modules_method_body_private_type_object_8410"
file = "method_body_private_type_object_8410.jl"
expected = true
description = "Issue #8410: an ordinary module method body that returns or calls an unqualified module-private type object resolves that type in the defining module, not the caller global scope"

[[tests]]
name = "modules_dynamic_parametric_ctor_8070"
file = "dynamic_parametric_ctor_8070.jl"
expected = true
description = "Dynamic local-var call `t = A.Pt; t(1.0, 2.0)` of a PARAMETRIC struct's `DataType` value (including a re-exported `const Pt = A.Pt` via `using .B`) infers the type parameters from the argument values and constructs the parametric instance, matching the static `A.Pt(1.0, 2.0)` form; 1- and 2-type-parameter structs and struct-valued fields covered (Issue #8070)"

[[tests]]
name = "modules_module_qualified_base_shadow_8079"
file = "module_qualified_base_shadow_8079.jl"
expected = true
description = "A module that defines its OWN `log2`/`log10` (shadowing the Base library function) and forwards to the explicitly-qualified `Base.log2`/`Base.log10` reaches the BASE implementation instead of re-dispatching the qualified call to its own same-signature shadow (which self-recurses NaNMath.log2 → Base.log2 → NaNMath.log2 → … into a spurious StackOverflowError). Covers qualified calls, the negative-domain NaN branch, and the `ceil(Int, -log2(eps(Float64)))` expression reached deep inside a nested closure both within the module and qualified across a module boundary — the Optim BFGS line-search context (Issue #8079)"

[[tests]]
name = "modules_local_datatype_applytype_ctor_8101"
file = "local_datatype_applytype_ctor_8101.jl"
expected = true
description = "Applying explicit type parameters to the runtime `DataType` value of a parametric struct held in a local variable (`t = A.Pt; t{Float64}(1.0, 2.0)`) constructs `A.Pt{Float64}`, honouring the explicit `{Float64}` and converting the arguments (Int → Float64) — the explicit-`{T}` analogue of the no-type-arg dynamic form `t(1.0, 2.0)` (Issue #8070). Previously failed at compile time with `Unknown parametric struct: t`. Covers Int-arg conversion, a non-`T` free field, the re-exported `const` alias, and typeof parity with the static form (Issue #8101)."

[[tests]]
name = "modules_using_import_as_alias_8117"
file = "using_import_as_alias_8117.jl"
expected = true
description = "`import/using X: y as z` symbol renames and `import X as Y` whole-module renames now bind the alias name to the imported entity instead of being a no-op (Issue #8117). Covers selective symbol aliases via both `using .Mz: q as qq` and `import .Mw: w as ww`, a whole-module alias `import LinearAlgebra as LA` (qualified `LA.dot`), a selective stdlib alias `using LinearAlgebra: dot as ddot`, and a `Base` alias `import Base: sin as mysin` (Base renames bind to the bare global name). The original name stays unbound, matching upstream."

[[tests]]
name = "modules_qualified_call_runtime_dispatch_8158"
file = "module_qualified_call_runtime_dispatch_8158.jl"
expected = true
description = "Issue #8158: a module-qualified call Module.f(x) defers to runtime multiple dispatch exactly like the unqualified f(x). When the argument is statically Any (an untyped parameter or a keyword arg with a default) and the callee has a catch-all f(::Any) method, the qualified path previously bound the catch-all statically and silently skipped a more-specific method (the SciMLBase _callbacks(::CallbackSet) mis-dispatch that disabled every callback in a CallbackSet). The shared should_runtime_dispatch policy now drives both the bare and qualified call paths. Covers single-arg and multi-arg qualified calls via positional and keyword arguments, the catch-all still winning for a non-matching value, and a precisely-typed direct call; parity-clean with upstream julia."

[[tests]]
name = "modules_same_module_const_function_alias_8254"
file = "same_module_const_function_alias_8254.jl"
expected = true
description = "A same-module `const` function alias remains callable from later method bodies (`const f = isempty; g(x) = f(x)`) by loading the qualified module binding instead of an unqualified global (Issue #8254)."

[[tests]]
name = "modules_nested_module_order_binding_8269"
