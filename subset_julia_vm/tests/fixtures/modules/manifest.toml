description = "A module that defines its OWN `log2`/`log10` (shadowing the Base library function) and forwards to the explicitly-qualified `Base.log2`/`Base.log10` reaches the BASE implementation instead of re-dispatching the qualified call to its own same-signature shadow (which self-recurses NaNMath.log2 → Base.log2 → NaNMath.log2 → … into a spurious StackOverflowError). Covers qualified calls, the negative-domain NaN branch, and the `ceil(Int, -log2(eps(Float64)))` expression reached deep inside a nested closure both within the module and qualified across a module boundary — the Optim BFGS line-search context (Issue #8079)"

[[tests]]
