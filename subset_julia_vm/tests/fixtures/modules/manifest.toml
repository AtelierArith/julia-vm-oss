[[tests]]
name = "modules_submodule_alias_first_using_wins_11176"
file = "submodule_alias_first_using_wins_11176.jl"
expected = true
description = "Issue #11176 (found auditing module_aliases for Issue #11032, Phase 2a continuation): when two different `using` imports bring a same-named submodule into scope from different parent modules, the FIRST import wins (matching upstream Julia's warn-and-ignore rule for the conflicting later one) instead of whichever module `imported_submodule_aliases` happened to iterate last under HashSet order. Fixed by rebuilding module_aliases from the already-available source-ordered resolved_usings with first-wins entry semantics. Two scopes pin both orderings of the same conflict so the result is proven to be source-order-driven, not name/hash-order-driven."

