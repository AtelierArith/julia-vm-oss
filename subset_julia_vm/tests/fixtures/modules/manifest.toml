description = "Issue #10220, follow-up to #10078/#10257, root cause diagnosed in #10294: unlike the #10078 fixture (which only proves Base compiles without erroring), this actually calls Base's own `Iterators.partition` end-to-end -- construction, `iterate`, `collect`, `length` -- after a same-named module struct's bare-name alias clobbers Base's own `Partition` bare-table slot; `CoreCompiler::visible_using_modules_for_name` (subset_julia_vm_compile/src/compile/core_compiler.rs) ignored `in_base_function_scope` and qualified Base's own bare `Partition(itr, Int64(n))` call against the user's `using`-imported module, corrupting every subsequent `Iterators.partition` call with a `DynamicToI64` runtime error; fixed by gating that method on `in_base_function_scope` so every caller uniformly falls through to the origin-aware bare-name path"
