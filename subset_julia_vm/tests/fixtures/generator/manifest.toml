[[tests]]
name = "generator_float16_collect_eltype_9301"
file = "float16_collect_eltype_9301.jl"
expected = true
description = "collect over a Float16-valued generator narrows the container element type to Float16 (Vector{Float16}), not Any, matching the Float32/Float64/Int/Bool producers. Float16 gains a dedicated ArrayElementType tag (boxed Any storage, mirroring Int128/UInt128) so typeof/eltype/collect, Vector{Float16}(undef, n), the typed literal Float16[...] (with convert(Float16, x) on Int elements), and dispatch on a bound Vector{Float16} all report Float16 (Issue #9301). Fix-forward (PR #9368) threads the same Float16 arm through the sibling element-type maps so the empty typed literal Float16[], the dot-broadcast constructor Float16.(xs), the range comprehension and map over a bound Float16 array all narrow to Vector{Float16} too. Every container-eltype check is folded into the final asserted value (not just println) so a regression in any sibling map flips the result to false. The inline-constructor comprehension body also yields Float16 element VALUES (Issue #9382), so both the container type and exact element values are asserted"

[[tests]]
name = "generator_filtered_generator_length_methoderror_9320"
file = "filtered_generator_length_methoderror_9320.jl"
expected = true
description = "length(filtered generator) raises a MethodError instead of returning the UNFILTERED base length (Issue #9320). Upstream models `(x for x in it if p(x))` as `Generator(map, Iterators.Filter(p, it))` with `IteratorSize(::Type{<:Filter}) == SizeUnknown()`, so `length(::Filter)` is undefined and `length(g)` throws; sjulia previously delegated to the base iterator and returned 5 for `(x for x in 1:5 if x>2)`. Asserts the MethodError for named-predicate, array-base, and captured-predicate (runtime-callable) filtered generators, that an UNFILTERED generator keeps a well-defined length, and that collect/sum/for-iteration over filtered generators stay correct (they drive the iterate protocol, never `length`)"
[[tests]]
name = "generator_filtermap_exception_state_unwind_9319"
file = "filtermap_exception_state_unwind_9319.jl"
expected = true
description = "An exception thrown inside a driven generator/HOF callable (filtered-generator FilterMap predicate or map body, or a plain map/Broadcast body) and caught by an ancestor try/catch must not leave a stale broadcast/generator driver behind. The VM re-enters such a driver keyed to the callable frame's depth; a leaked state was re-triggered by a later unrelated function returning at the same depth, silently re-running the stale __gen_body (phantom 'Division by zero' from a previous generator body, or a duplicated side effect). The fix unwinds the driven-callable state stacks (broadcast_states / generator_iterate_state / composed_call_state / sprint_state) to the handler's frame floor alongside the frame truncation in Vm::handle_error (and the register-trampoline Err unwind). Covers FilterMap map-body and predicate exceptions, plain Broadcast body exceptions, a try/catch inside the driven callable, a rethrow through the outer try, and a fresh collect after a caught exception (Issue #9319)"

