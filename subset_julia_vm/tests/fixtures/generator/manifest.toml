[[tests]]
name = "generator_lazy_generator_body_9103"
file = "lazy_generator_body_9103.jl"
expected = true
description = "A generator expression with an arbitrary (non-f(var)) body is LAZY: side effects fire at collect/iteration time (never at construction), g.iter keeps the original iterator, bodies inside function scopes and top-level let/@testset blocks capture enclosing locals, and consumers apply the mapping (collect/sum/first/maximum/minimum/prod/join/any/all/count/Tuple/comprehension/zip/iterate/for). map/reduce over a lazy generator fuse into a composed callable (Generator(f, Generator(g, it)) -> Generator(f∘g, it)); builtin-named functions work inside composed calls. Filtered non-trivial bodies are now lazy too (Issue #9127, ordering asserted in filtered_generator_lazy_9127.jl); consumer gaps documented in Issue #9128 (Issue #9103)"

[[tests]]
name = "generator_filtered_generator_lazy_9127"
file = "filtered_generator_lazy_9127.jl"
expected = true
description = "A FILTERED generator with a non-trivial body, and a generator with a tuple-destructuring binding, are LAZY: side effects fire at collect/iteration time (recorded via a module-global log so the lifted body/predicate reference a global, not a captured local), never at construction. The lowering lifts the body into __gen_body_N and the filter predicate into __gen_pred_N (with a destructuring prologue for (a,b) bindings) so both compile onto the lazy FilteredFunctionIndex path; consumers (collect/sum/first/count) apply the mapping correctly. A Dict / KeySet / ValueIterator base (whose iterate is pure Julia) is materialized once at generator construction so collect/sum/first/count over `(k+v for (k,v) in dict)` work while the body mapping stays lazy. An empty FILTERED collect with a transparent predicate keeps its inferred eltype (`collect(x^2 for x in 1:4 if x>100)` -> `Int64[]`, not `Union{}[]`) because the runtime FilterMap finalizer threads the inferred element type when the compiler can prove the predicate shape. Filtered generators whose lifted body/predicate live in a function scope and/or CAPTURE an enclosing local are now lazy too (Issue #9271; ordering asserted in filtered_generator_function_scope_lazy_9271.jl)"

[[tests]]
name = "generator_filtered_generator_function_scope_lazy_9271"
file = "filtered_generator_function_scope_lazy_9271.jl"
expected = true
description = "A FILTERED generator whose lifted body/predicate live in a FUNCTION SCOPE (so __gen_body_N / __gen_pred_N are locals) and/or CAPTURE an enclosing local is LAZY: side effects fire at collect/iteration time, never at construction (asserted via an explicit `constructed` log entry ordered before any `body ...`). Covers the capture case (filter `x > k` captures `k`), the zero-capture-but-function-scope case, lazy `for` iteration, non-collect consumers (sum/count/first), inferred eltype preservation for an all-filtered-out collect (`Int64[]`, not `Union{}[]`), and value correctness across shapes. The fix carries the map/predicate as a runtime-callable FilteredRuntimeValue pair (mirroring the unfiltered MakeGeneratorRuntime path from Issue #9103) instead of the bare-index FilteredFunctionIndex path that would drop the captured environment (Issue #9271)"

