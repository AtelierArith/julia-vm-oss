[[tests]]
name = "generator_simple_desugar_9200"
file = "simple_generator_desugar_9200.jl"
expected = true
description = "Issue #9200 S2: the SIMPLE generator form (f(x) for x in iter) — single scalar binding, unfiltered — is desugared in lowering to the upstream Base.Generator(func, iter) shape (julia-syntax.scm expand-generator / func-for-generator-ranges): body === var uses `identity`, otherwise the body is lifted into an anonymous function referenced by value. Verifies against upstream julia that this preserves every observable behavior: identity generators, mapped generators over range/array/tuple/Float ranges, collect over a generator whose iterator is itself a generator (generator fusion — the outer mapping applies to the inner generator's MAPPED values, not its base), laziness (side effects fire at iteration not construction), the source iterator evaluated once at construction, an error in the body firing at iteration, collect eltype preservation, and IteratorSize/length/size unchanged (post S1 / #9379). Filtered (S3), tuple-destructuring, product/multi-range and flatten (S4) forms stay on the existing MakeGenerator path"

[[tests]]
name = "generator_filtered_desugar_9200"
file = "filtered_generator_desugar_9200.jl"
expected = true
description = "Issue #9200 S3: the FILTERED single-scalar-binding generator (f(x) for x in iter if p(x)) desugars in lowering to the upstream Base.Generator(f, Base.Iterators.Filter(p, iter)) shape (julia-syntax.scm expand-generator); the compiler collapses the Filter-valued iterator back onto the native lazy filtered-generator representation (FilteredFunctionIndex / MakeGeneratorRuntimeFiltered, #9127 / #9271) so laziness and every consumer stay identical. Verifies at parity with upstream julia: consumers (collect/sum/first/count/isempty/for + captured predicate) drive the iterate protocol; the TYPE-LEVEL Base.IteratorSize(typeof(filtered)) reports SizeUnknown() (the S1 leftover deferred by iterator_traits_9379.jl — typeof's iterator parameter is now Iterators.Filter with IteratorSize(::Type{<:Filter})==SizeUnknown()); length/size raise a MethodError while unfiltered stays well-defined; a filtered generator flowing into a SPECIALIZED counted-loop function iterates via the iterate protocol and returns the correct sum (Issue #9353); laziness (side effects and a body error fire at iteration, not construction); and an all-filtered-out collect preserves the inferred eltype (Int64[], Issue #9127)"

[[tests]]
name = "generator_iterator_traits_9379"
file = "iterator_traits_9379.jl"
expected = true
description = "Base.IteratorSize / size of a generator match upstream at the VALUE level (Issue #9379, foundation slice of the #9200 generator-desugar epic). A filtered generator conceptually wraps Iterators.Filter (IteratorSize == SizeUnknown()), but sjulia collapses the filter into the native generator callable, so the trait is resolved via the SAME structural callable-variant check as length/isempty (#9320) — driven off the representation, not a type-name string. Asserts: IteratorSize(filtered) is SizeUnknown() (named/captured/array-base predicates), IteratorSize(unfiltered) is HasShape{1}, IteratorSize/IteratorEltype(typeof(unfiltered)) parity, value-level IteratorSize over vector/matrix/3-D array based generators preserves HasShape{N} (#9393), size(unfiltered over 1:5) == (5,) and over array bases preserves shape, size(filtered) and size(::Generator, dim) raise MethodError, length(filtered) MethodError (kept from #9320), and collect/sum consumers stay correct. The TYPE-LEVEL IteratorSize(typeof(filtered)) now reports SizeUnknown after the Filter-desugar slice #9200 S3."

[[tests]]
name = "generator_product_flatten_desugar_9200"
file = "product_flatten_generator_desugar_9200.jl"
expected = true
description = "Issue #9200 S4: the PRODUCT (comma multi-binding `for x in a, y in b`) and FLATTEN (whitespace nested `for x in a for y in b`) generator forms desugar in lowering to the upstream julia-syntax.scm expand-generator shapes — Base.Generator(func, Iterators.product(a, b)) (func maps the product's destructured tuple) and Iterators.flatten(Generator(x -> Generator(y -> f(x,y), b), a)). Verified at parity with upstream julia: a comma product carries the product's N-D shape so collect yields a Matrix (2-D and 3-D, matching [f for x, y]); a flatten yields a Vector in column-major nesting order (including a dependent inner range); consumers (collect/sum/first/prod/for) drive the iterate protocol; a filter wraps the innermost iterator in an Iterators.Filter so a filtered product collapses to a SizeUnknown Vector and a filtered FLATTEN composes the S3 filtered-generator collapse per nesting level (fixes #9325, the previously-rejected `nested generators not supported` combination); and laziness holds for both forms (side effects fire at iteration in column-major order, not construction). The product UndefVarError on main is fixed by the desugar; the VM recovers the ProductIterator/Product shape in collect_iterator/materialize_generator_base_if_needed. Flatten-of-generators collect eltype (Vector{Any} vs julia Vector{Int64}) is a separate deferred gap and deliberately NOT asserted"

[[tests]]
name = "generator_float16_comprehension_value_9382"
file = "float16_comprehension_value_9382.jl"
expected = true
description = "An inline Float16(x) constructor call (or any Float16-typed body expression) in a single-iterator comprehension body yields Float16 element VALUES, not Float64 (Issue #9382). The container tag was already Vector{Float16} (#9301 / PR #9368) but the body push matched F16 into the default `_` arm of the single-iterator comprehension's body_type dispatch, which coerced the value through compile_expr_as(F64); F16 now rides the same value-preserving boxed StoreAny/LoadAny push path as F32 and the other small numerics. Asserts typeof of an element and exact element values for the plain comprehension, the collect-ed generator, a Float16 arithmetic body, and a filtered comprehension, plus the Float32/Float64 analogues that were already correct (F64 keeps its dedicated typed push path)"

