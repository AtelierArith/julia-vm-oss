[[tests]]
name = "optim_objective_named_f"
file = "optim_objective_named_f.jl"
expected = true
description = "Objective bound to a variable literally named `f` works under BFGS (explicit gradient + finite-difference closure factory) and GradientDescent — capture name collision fixed, W-42 removed (Issue #8080)"
