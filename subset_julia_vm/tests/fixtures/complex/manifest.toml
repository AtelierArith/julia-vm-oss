[[tests]]
name = "complex_real_equality_5966"
file = "complex_real_equality_5966.jl"
expected = true
description = "Mixed Complex/Real == and != terminate and match upstream. Without the upstream ==(z::Complex, x::Real) / ==(x::Real, z::Complex) methods (isreal(z) && real(z) == x), Real == Complex matched only the promote-based ==(x::Number, y::Number) fallback; when promote(Real, Complex) failed to widen the Real operand to Complex, that fallback re-dispatched ==(::Number,::Number) on the unchanged (Real, Complex) pair forever — an unbounded VM call stack that non-deterministically OOM'd the full suite (complex/promotion chunks). Adds the four mixed ==/!= methods (Issue #5966)."

[[tests]]
name = "complex_isnan_isinf_bound_6518"
file = "complex_isnan_isinf_bound_6518.jl"
expected = true
description = "isnan/isinf/transpose on Complex{T} where T<:Real keep their T<:Real bound across the prelude-program / method-table caches. TypeParam.bound (legacy mirror of upper_bound) is #[serde(skip)], so a plain derive left it None after the prelude Program was bincode-round-tripped, silently dropping the where T<:Real constraint and making the caches non-transparent (serde round-trip diverged bound: None vs Some(\"Real\")). The fix reconstructs bound from upper_bound on deserialization; behavior matches upstream for Float and Int Complex element types (Issue #6518)."

[[tests]]
name = "complex_typed_array_literal_int_convert_6771"
file = "complex_typed_array_literal_int_convert_6771.jl"
expected = true
description = "Typed Complex array literal with Int (or Float) elements converts each element to the declared element type, mirroring upstream `T[a,b,...]` => convert(T,a). ComplexF64[1,2][1] === 1.0+0.0im (was raw Int). Two storage paths: bare alias ComplexF64[...] stored elements verbatim into boxed Memory (compile path now emits convert(eltype,x) per element); parametric Complex{Float64}[...] routes through the interleaved-Complex Array push which rejected raw scalars (push/set now accept a real scalar as (x,0)). === / eltype / typeof assertions detect the type tag vs value mismatch that the == promotion hid (Issue #6771)."

[[tests]]
name = "complex_imag_arith_array_literal_6851"
file = "complex_imag_arith_array_literal_6851.jl"
expected = true
description = "An annotation-free array literal of imaginary-arithmetic elements (`[1.0 + 2.0im, 3.0 + 4.0im]`) now infers `Vector{ComplexF64}` (and the Float32 variant `Vector{ComplexF32}`) instead of falling back to `Vector{Any}`. The ValueType inference of `1.0 + 2.0im` (i.e. `1.0 + 2.0 * im`) dispatched the `*`/`+` Base operators whose declared return type is `Any`, dropping the Complex element type; the fix mirrors the JuliaType path's `Real op Complex{T} -> Complex{promote(...)}` promotion recovery in the ValueType path. The constructor form (`[Complex(...)]`) and the typed-literal form (`ComplexF64[...]`) already worked (Issue #6851)."

[[tests]]
name = "complex_real_mixed_array_literal_6867"
file = "complex_real_mixed_array_literal_6867.jl"
expected = true
description = "An annotation-free array literal mixing `Complex` and `Real` elements (`[1.0 + 0.0im, 2.0]`) now infers the promoted `Vector{ComplexF64}` / `Vector{ComplexF32}` instead of `Vector{Any}`, filling the Complex×Real gap left by the same-kind-only fix in Issue #6851. The compile-time element-type narrowing had no Complex×Real rule, so it widened to `Any`; the fix reduces the element types with Julia's `promote_type` / Complex `promote_rule` (`promote_type(Complex{Float64}, Float64) == ComplexF64`) and widens each real element into the inline Complex storage via the `Complex{T}(x, 0)` constructor. Regression-guards the motivating case `norm([1.0+0.0im, 2.0]) == 2.23606797749979`, which previously raised a runtime type error from the generic fallback (Issue #6867)."

[[tests]]
name = "complex_ordering_error_7605"
file = "complex_ordering_error_7605.jl"
expected = true
description = "Complex/Real ordering comparisons (`<`, `<=`, `>`, `>=`, either operand order) now raise a clear \"Complex numbers are not orderable\" error instead of silently comparing real parts and returning a Bool (e.g. `complex(1.0,2.0) < 3` was `true`). The generic `<(x::Real, y::Real)` in promotion.jl loosely matched a Complex operand under specialization; explicit parametric `Complex{T} where {T<:Real}` ordering methods (mirroring the `==(Complex, Real)` exclusion from Issue #5966) close the hole. Complex × Complex already raised a MethodError and is left unchanged (Issue #7605)."

[[tests]]
name = "complex_array_fallback_parity_7876"
file = "complex_array_fallback_parity_7876.jl"
expected = true
description = "Guarantees the interleaved-Complex Rust array fast paths (broadcast `.+ .- .*`, scalar product, `abs.`/`conj.`/`real.`/`imag.`, `sum` reduction, matrix×vector and matrix×matrix matmul) return exactly what the pure-Julia scalar Complex multiple-dispatch path (the gold-standard fallback) returns. The interleaved `[re0, im0, ...]` representation is a no-JIT performance tradeoff (RUST_BOUNDARY_JUSTIFICATION.md condition 4, Issue #7876); this fixture is the fallback-equivalence guard that breaks if a future representation change makes the fast path diverge. Verified to pass identically under upstream julia."

[[tests]]
name = "complex_int_literal_arith_9169"
file = "complex_int_literal_arith_9169.jl"
expected = true
description = "Scalar `+ - * /` on integer-component Complex values built via the `a + b*im` literal path (`z = 2 + 3im`) now preserve the integer element type (`Complex{Int64}`) instead of silently widening to `ComplexF64`; the `Complex(a, b)` constructor path, already correct, is included as a same-fixture regression guard. Root cause #1 (`subset_julia_vm_compile/src/compile/core_compiler.rs`, `julia_type_to_value_type_with_ctx`): a bare `::Complex` method parameter (`Base.:+(x::Real, z::Complex) = ...`, no element type) resolved at compile time to an arbitrarily-guessed registered instantiation instead of `ValueType::Any`, hard-wiring the method body's field access / struct construction to whichever `Complex{T}` happened to be in the struct table first. Root cause #2 (`subset_julia_vm_compile/src/compile/expr/binary/user_defined.rs`, `compile_user_defined_binary_op`): once root cause #1 was fixed and the method's own return type became imprecise, the Complex-result-type recovery promoted the method's *declared* (bare) parameter types instead of the actual call-site argument types; a bare `Complex` name fails the `Complex{`-prefix check in `julia_type_to_type_name` and silently defaulted to `\"Float64\"`, so the promoted-name struct-table lookup missed and fell through to a hardcoded `Complex{Float64}` safe default for every bare-`Complex`-typed operator call. A related gap (`abstract_interp/engine/mod.rs`, `infer_parametric_struct_constructor`) is fixed alongside: an unregistered `Complex{T}` instantiation's placeholder `type_id: 0` was reinterpreted downstream as a real struct-table index instead of being treated as absent. Covers Complex{Int64}, Complex{Int32}, Complex{Bool} (via `im`'s `Complex{Bool}` component-type promotion), and confirms Complex{Float64} arithmetic is unaffected (Issue #9169)."

[[tests]]
name = "complex_slot_pair_sroa_9198"
file = "complex_slot_pair_sroa_9198.jl"
expected = true
description = "Complex{Float64} slot-pair SROA (Issue #9198 S2, `compile::complex_sroa`): a proven-ComplexF64 loop local is unboxed into two f64 re/im slots so `z = z*z + c` and `real`/`imag`/`abs2`/`z.re`/`z.im`/`+=`/subtraction/real*complex/conj compile to fused typed-f64 slot ops with zero per-iteration heap allocation. Value parity with boxed Complex arithmetic (byte-identical to upstream Julia): accumulation loops, mandelbrot escape-time iteration counts (both `real(z)*real(z)+imag(z)*imag(z)` and `abs2(z)` conditions), and escape boundaries where the unboxed value is materialized back to a boxed `Complex{Float64}` — returned mid-loop, `push!`ed into an array, and captured by a closure (which forces the SROA gate to bail and keep the local boxed)."

[[tests]]
name = "complex_struct_sroa_s3_9198"
file = "complex_struct_sroa_s3_9198.jl"
expected = true
description = "2-field isbits-struct slot-pair SROA generalization (Issue #9198 S3, `compile::complex_sroa`): three new qualifying families beyond S2's Complex{Float64}-only gate, each byte-identical to the boxed form (verified against upstream Julia 1.12.6). (1) `im`-literal initializers with provably-Float64 coefficients (`z = 0.0 + 0.0im`) are recognized as Complex{Float64} and unbox, while an integer coefficient (`2im` = Complex{Int64}) still bails; (2) a boxed `::ComplexF64` PARAMETER used as a decomposed operand in `z = z*z + c` (mandelbrot kernel spelling `mandel_point(cr + ci*im, maxiter)`), its re/im hoisted to f64 locals at function entry; (3) any user immutable struct with exactly two Float64 fields (`struct V2; x::Float64; y::Float64; end`) unboxes construction `V2(a,b)` and field reads `p.x`/`p.y` — with the struct materialized back to a boxed value at escape (return). Covers the mandelbrot escape-time count (8278 at 30x20x50), im-literal accumulation, user-struct field arithmetic, and user-struct escape materialization."

[[tests]]
name = "complex_sqrt_int_abs_width_9342"
file = "complex_sqrt_int_abs_width_9342.jl"
expected = true
description = "sqrt(Complex{Int}) no longer aborts the whole program with a fatal, span-less compile-time error (even when unreachable, e.g. an uncalled `f() = sqrt(-1 + 0im)` definition): integer/rational Complex sqrt promotes to Complex{Float64} via `sqrt(z::Complex{<:Union{Integer,Rational}}) = sqrt(float(z))` (spelled as an explicit Complex{Float64} constructor so the inner sqrt statically routes to the concrete method), and the compiler's static-routing failure in compile/expr/builtin.rs falls back to that promotion instead of erroring. Also guards abs width preservation: abs(::Complex{Float16/Float32}) returns the same-width float (via hypot) instead of widening to Float64, while abs(::Complex{Int}) stays Float64 (Issue #9342)."

[[tests]]
name = "complex_inverse_trig_8813"
file = "complex_inverse_trig_8813.jl"
expected = true
description = "Inverse trigonometric / inverse hyperbolic functions asin/acos/atan/asinh/acosh/atanh for Complex{Float64} arguments, ported from upstream julia base/complex.jl (Issue #8813). Previously raised MethodError (asin/acos/atan) or a runtime type error (asinh/acosh/atanh) since only the forward transcendentals (sin/cos/tan/exp/log/sqrt) had Complex methods. Verifies both the exact upstream values for z = 1.0 + 2.0im and the principal-branch round-trip identities sin(asin(z)) ≈ z etc. The asin/acos/acosh implementations reconstruct the conjugate inline via complex(real(w), -imag(w)) instead of sqrt(conj(w)) to sidestep the compile-time sqrt static-routing bug that mis-routes the Any-inferred conj(...) result to the real SqrtF64 path (Issue #9342 / W-54)."

