name = "arrays_index_assign_specialized_6346"
file = "index_assign_specialized_6346.jl"
expected = true
description = "1D Vector{Int64}/Vector{Float64} setindex! loops remain compatible while lazy specialization emits a typed IndexAssign fast path (Issue #6346)"

[[tests]]
name = "arrays_index_assign_multidim_fallback_6346"
file = "index_assign_multidim_fallback_6346.jl"
expected = true
description = "Multi-dimensional IndexAssign keeps using the generic fallback path outside the 1D typed lazy-specialization shape (Issue #6346)"

[[tests]]
name = "arrays_rank1_wrapper_index_untyped_param_6806"
file = "rank1_wrapper_index_untyped_param_6806.jl"
expected = true
description = "Indexing a rank-1 Array{T} wrapper through an untyped parameter (raw IndexLoad) reads the element directly from the MemoryRef-backed storage instead of dispatching getindex per index. Characterization of value and bounds semantics across the #6806 PR B fast path; verified against upstream Julia (Issue #6806)."

[[tests]]
name = "arrays_multidim_wrapper_index_untyped_param_6806"
file = "multidim_wrapper_index_untyped_param_6806.jl"
expected = true
description = "Indexing a MemoryRef-backed Array{T,N} wrapper through an untyped parameter (raw IndexLoad) reads the element directly from storage for both linear-index and full per-dimension index modes, extending the #6806 PR B fast path to multi-dimensional reads. Verified against upstream Julia (Issue #6806)."

[[tests]]
name = "arrays_setindex_wrapper_untyped_param_6806"
file = "setindex_wrapper_untyped_param_6806.jl"
expected = true
description = "Writing into a numeric Array{T} wrapper through an untyped parameter (a[i]=v, raw IndexStore) writes directly into MemoryRef-backed storage instead of dispatching setindex! per write. Characterizes value, Int->Float coercion, aliasing, linear matrix write, and bounds semantics; verified against upstream Julia (Issue #6806)."

[[tests]]
name = "arrays_build_buffer_devariant_6807"
file = "build_buffer_devariant_6807.jl"
expected = true
description = "The incremental array build buffer (NewArray*/PushElem*/Finalize*), emitted by the lazy specializer for typed array literals and the empty Vector{String} constants, produces arrays with identical value, element-type, ordering, mutation and special-layout semantics after being de-varianted onto the Value::Memory representation (the last live producer of the legacy Value::ExprArgs carrier). Verified against upstream Julia (Issue #6807)."

[[tests]]
name = "arrays_constructor_producers_wrapper_6807"
file = "constructor_producers_wrapper_6807.jl"
expected = true
description = "VM-level array producers — range materialization (MakeRange/MakeRangeF64), RNG arrays (rand/randn), and matrix ops — emit the MemoryRef-backed Array{T,N} wrapper instead of the legacy Value::ExprArgs carrier, and the wrapper behaves identically through length/eltype/indexing/sum/map. Verified against upstream Julia (Issue #6807)."

[[tests]]
name = "arrays_literal_native_finalize_elemtypes_6846"
file = "literal_native_finalize_elemtypes_6846.jl"
expected = true
description = "Array literals finalize Memory into the Array{T,N} wrapper natively across element types (complex/struct/primitive/mixed/multidim/empty) (Issue #6846)"

[[tests]]
name = "arrays_type_name_memoization_6846"
file = "type_name_memoization_6846.jl"
expected = true
description = "Array wrapper type identity (typeof/isa/eltype/ndims/dispatch) is stable across diverse element types and ndims under the memoized CoreType::from_julia_name parse and the cheap array_wrapper_julia_type derivation (Issue #6846)"

[[tests]]
name = "arrays_growth_amortized_6873"
file = "growth_amortized_6873.jl"
expected = true
description = "Appending to an Array{T} wrapper grows the backing Memory in place via amortized (geometric) Vec growth instead of exact-size realloc + copy-all per push (which made comprehensions / push! loops O(n^2)). Values, ordering, element type, mixed push!/index-mutate, and `c = d` aliasing all survive the internal reallocations. Verified against upstream Julia 1.12 (Issue #6873, found via Issue #6846)."

[[tests]]
name = "arrays_slice_producers_wrapper_6807"
file = "slice_producers_wrapper_6807.jl"
expected = true
description = "Array-slice producers (a[range]/a[idxvec]/m[rows,cols]/n-dim) emit the MemoryRef-backed Array{T,N} wrapper; slices are fresh, independently-mutable arrays (Issue #6807)"

