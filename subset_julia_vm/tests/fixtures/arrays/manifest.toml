file = "hcat_vcat_flatten_elements_7203.jl"
expected = true
description = "Issue #7203: matrix/hcat/vcat literals with array or range row elements ([g 4], [1:2 3:4], [[1 2] [3 4]], [g; row], [A B; C D]) flatten/materialize those elements column-/row-wise like upstream Julia instead of boxing them as Any elements (or crashing); all-scalar literals keep the direct fast path"

[[tests]]
