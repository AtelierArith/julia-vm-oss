[[tests]]
name = "arrays_2d_view_linear_setindex_5816"
file = "arrays_2d_view_linear_setindex_5816.jl"
expected = true
description = "Linear getindex/setindex! on a 2D view (SubArray) reads/writes the column-major element through the view's per-dimension indices and parent, not the 1D-contiguous offset+i. v[1]=100 sets A[1,2]; the routed pure-Julia setindex! returns the collection so the post-IndexStore StoreBack does not clobber the view binding; values stay Int. 1D view + Float 2D view regression (Issue #5816)."

