[[tests]]
name = "floatfuncs_float_decomp_pure_julia_6740"
file = "float_decomp_pure_julia_6740.jl"
expected = true
description = "exponent/significand/frexp/issubnormal/nextfloat/prevfloat are pure Julia (base/float.jl) over reinterpret + IEEE bit-field helpers; match upstream across Float64/Float32/Float16 (old builtins were Float64-only) incl Inf/NaN/±0/subnormal/2-arg and exponent(Integer) (Issue #6740)"

[[tests]]
name = "floatfuncs_rounding_pure_julia_6742"
file = "rounding_pure_julia_6742.jl"
expected = true
description = "floor/ceil/round/trunc are pure Julia (base/floatfuncs.jl) over the CPU intrinsics floor_llvm/ceil_llvm/trunc_llvm/rint_llvm (Issue #6742, #6726 slice 1/3). round uses round-half-to-even (default RoundNearest). Covers: plain ties-to-even (round(2.5)==2.0, fixing the old dynamic-dispatch f64::round half-away bug), Float32 preservation, integer identity (floor(5)===5), typed forms (round(Int8,3.5)===Int8(4), type preserved), digits/sigdigits/base keywords now pure Julia (round(3.7,digits=2,base=2)==3.75 honors base; the Rust *Digits builtins are no longer reached), and all RoundingMode variants (TiesUp/TiesAway/FromZero/Up/Down/ToZero) in base/rounding.jl. Values verified against julia 1.12. (Rational rounding return-type tracked separately by #6775.)"

[[tests]]
name = "floatfuncs_signbit_narrow_floats_9529"
file = "signbit_narrow_floats_9529.jl"
expected = true
description = "signbit(Float32)/signbit(Float16) are bit-level (reinterpret to Int32/Int16 then integer signbit), mirroring upstream floatfuncs.jl; the generic sign-comparison signbit(x) cannot see -0.0f0 / Float16(-0.0)'s sign bit (Issue #9529)"

