[[tests]]
name = "set_carrier_removed_pure_struct_6732"
file = "set_carrier_removed_pure_struct_6732.jl"
expected = true
description = "The Value::Set Rust carrier (HashSet ops + _set_* intrinsics + Set* BuiltinIds) was removed (Issue #6732): every Set is a pure-Julia Set{T} struct over Dict{T,Nothing} (base/set.jl) and the public API (construction/push!/in/delete!/pop!/length/isempty/empty!/eltype/iteration + union/intersect/setdiff/symdiff/issubset) dispatches through its methods. The builtins_sets/ module, Value::Set variant, and Set BuiltinIds are deleted; Set Instrs are kept decodable-but-unreachable. Verified Dict still works alongside. Values vs julia 1.12."
