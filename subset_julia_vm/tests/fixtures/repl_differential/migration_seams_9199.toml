# --- direct intra-eval / script-mode dual #9400 -----------------------------
# Single eval, redefinition textually between two direct calls. Both models now
# return upstream's 12 (ra=1, rb=2). Function-body propagation remains #9650.
[[steps]]
name = "s6_reset_before_intra_eval"
action = "reset"

[[steps]]
name = "s6_intra_eval_9400"
input = """
wd6_9199() = 1
ra9199 = wd6_9199()
wd6_9199() = 2
rb9199 = wd6_9199()
ra9199 * 10 + rb9199
"""
expect_success = true
expect_display = "12"
expect_type = "Int64"

# --- LV2 (Issue #9199): live-append delta path -----------------------------
# Under Persistent these steps run on ONE live VM (relocatable delta main spliced
# in place); Legacy rebuilds the world each eval. The corpus pins Legacy ≡
# Persistent for the exact cases the live path covers: many prior globals, a
# reassignment landing on the CORRECT live frame-0 slot (the slot-collision bug
# the LV1 note called out), a brand-new global growing frame-0 after many evals,
# and read-modify-write accumulation across evals.
[[steps]]
name = "lv2_reset_before_globals"
action = "reset"

