name = "repl_differential_migration_seams_9199"
description = """
Migration-seam corpus for the REPL eval-model epic (Issue #9199, Slice 2). Drives \
the exact seams the persistent-VM migration will touch — scalar/global defs, \
method (re)definition across evals, structs + field access, using/import + macro \
persistence, error cases + recovery, display forms, reset() dropping state, and \
(isolated last) closures. Both sides run the current model today (self-comparison); \
S3+ flips side B to the persistent model and this same corpus catches divergence. \
Goldens authored from sjulia output (REPL_DIFF_DUMP=1); refresh them the same way \
after a deliberate behavior change. S3+ appends steps here as constructs cut over. \
S4 appended the module/using-import once-initialization seam: `using`/`import` a \
stdlib across evals, `using` twice, redefine a global after import, call-driven \
mutable module state (non-diverging), and module `__init__` once-init (the reviewed \
models_diverge rows where Legacy re-runs `__init__` every eval and Persistent runs \
it once, matching upstream). \
LV5b (#9723) appended the per-module-kind seam: submodule references, module-level \
struct construction + struct-array const mutation, and module redefinition state \
reset (upstream semantics, Issue #10232). \
Display goldens are only asserted for concrete scalars (Int/Float/Bool/String) — \
container/struct/closure displays are internal Debug reprs (type_id / lambda \
counters) and are pinned via `type` + `success` instead.
"""

