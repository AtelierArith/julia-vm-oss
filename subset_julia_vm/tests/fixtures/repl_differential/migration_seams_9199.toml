# and lost factory-local captures such as `n`. Captured closures now decline
# FunctionRef reconstruction and use the same seed_globals value-carry fallback
# as other non-source-reconstructible values, so Legacy and Persistent both keep
# the closure environment intact (see docs/vm/ADR_REPL_EVAL_MODEL.md,
