[[steps]]
name = "s5_mutual_even_def"
input = "myeven9199(n) = n == 0 ? true : myodd9199(n - 1)"
expect_success = true
expect_type = "Function"

[[steps]]
name = "s5_mutual_odd_def"
input = "myodd9199(n) = n == 0 ? false : myeven9199(n - 1)"
expect_success = true
expect_type = "Function"

[[steps]]
name = "s5_mutual_even_call"
