# same-eval def+construct+use (the type is installed before the appended main's
# `NewStruct`), a mutable struct, and a redefinition with a wider layout. All
# goldens verified against upstream `julia` 1.12 (which — since 1.12 — also allows
# the struct redefinition). Abstract / primitive / enum type definitions now
# PERSIST across evals (session accumulation + re-merge, symmetric with structs —
# Issue #9701; pinned by the `t9701_*` rows below); their live-VM type-registry
