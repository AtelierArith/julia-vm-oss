# ============================================================================
# S4 (Issue #9199): module / using-import once-initialization.
#
# Under the PERSISTENT model a user module is realized ONCE: its `__init__` side
# effects fire on the eval that defines it and are suppressed on every subsequent
# accumulate-and-recompile pass, matching upstream `run_module_init` (a module's
# `__init__` runs once per realization — julia/base/loading.jl). Under LEGACY the
# whole accumulated program re-runs each eval, so `__init__` re-fires — the
# observably-wrong per-eval re-run this slice fixes. `using`/`import` of stdlib
# packages, macro persistence, and call-driven mutable module state stay identical
# across both models (differentially non-diverging). Package `using X` modules are
# NEVER suppressed (their `__init__` establishes per-VM state that must re-run in
# each eval's fresh VM) — they route through the legacy re-run path under both
# models. See docs/vm/ADR_REPL_EVAL_MODEL.md (#9199 S4 / #8994 / #5296).
# ============================================================================

[[steps]]
name = "s4_reset_before_modules"
action = "reset"

# --- using / import a stdlib across multiple evals (non-diverging) ---------
[[steps]]
name = "s4_using_linalg"
input = "using LinearAlgebra"
expect_success = true

[[steps]]
name = "s4_linalg_det_across_eval"
input = "det([1.0 2.0; 3.0 4.0])"
expect_success = true
# Float display omitted (Rust `-2.0`→`-2` vs Julia formatting); the A==B
# cross-check + type pin the behavior.
expect_type = "Float64"

[[steps]]
name = "s4_linalg_dot_across_eval"
input = "dot([1, 2, 3], [4, 5, 6])"
expect_success = true
expect_display = "32"
expect_type = "Int64"

