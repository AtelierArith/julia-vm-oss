# ============================================================================
# S6 (Issue #9199): world-age / precise-invalidation of method redefinition
# across evals, and the reachability boundary vs the script-mode dual #9400.
#
# WHAT IS REACHABLE TODAY (these rows, all Legacy ≡ Persistent AND matching
# upstream `julia`): a method redefined in eval N is visible from eval N+1's
# call sites but is NOT retroactively applied to eval N's already-run code — the
# upstream world-age invariant (`julia/src/gf.c`: a call sees only methods
# defined in worlds ≤ its own; a redefinition bumps the world counter). In the
# REPL this holds for free because the EVAL BOUNDARY is the world boundary: the
# earlier eval's call already ran (and its global result is fixed) before the
# later eval redefines, and the later eval re-resolves against the current
# method table. Both models agree because both realize cross-eval visibility the
# same way (full recompile on a definition eval — S5 routes DEFINITIONS to the
# full path; #9197 S6 / PR #9485 is the runtime per-name backedge invalidation
# the future live-VM slice will use to make this a world-counter fact instead of
# a recompile artifact). Verified against upstream julia:
#   scenA 11/110 · scenB 21/1001 · scenC 0/0/100/100.
#
# NOW REACHABLE FOR DIRECT TOP-LEVEL CALLS (the `s6_intra_eval_9400` row):
# source-visible top-level dispatch fixes the direct #9400 script-mode dual.
# A same-signature redefinition placed textually between two direct calls in one
# eval now yields upstream's 12 under both models. Calls that enter an
# earlier-defined function body still need runtime world propagation; see #9650.
# See docs/vm/ADR_REPL_EVAL_MODEL.md (§S6) and Issues #9400 / #8452 / #9197.
# ============================================================================

[[steps]]
name = "s6_reset_before_worldage"
action = "reset"

# --- scenA: redefine a method between two evals, call it in both -----------
