# Legacy ≡ Persistent: the observable result MUST match a full recompile.
# Values verified against
# upstream julia (51 / true / true / 210 / 11 / 12). See docs/vm/ADR_REPL_EVAL_MODEL.md (§S5).
# ============================================================================

[[steps]]
