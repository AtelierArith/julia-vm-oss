# --- call-driven mutable module state (no __init__): identical across models
# A module const array mutated by a *called function* (not by init) is persisted
# by `restore_module_globals` under BOTH models — non-diverging (Issue #5296). S4
# only suppresses `__init__` re-runs, never the module body's const bindings.
[[steps]]
name = "s4_reset_before_mutable_module"
action = "reset"

[[steps]]
name = "s4_mutable_module_def"
input = """
module Log9199
    const entries = Int[]
    bump() = (push!(entries, length(entries) + 1); length(entries))
end
"""
expect_success = true

[[steps]]
name = "s4_mutable_module_bump1"
input = "Log9199.bump()"
expect_success = true
expect_display = "1"
expect_type = "Int64"

[[steps]]
name = "s4_mutable_module_bump2"
input = "Log9199.bump()"
expect_success = true
expect_display = "2"
expect_type = "Int64"

[[steps]]
name = "s4_mutable_module_len"
input = "length(Log9199.entries)"
expect_success = true
expect_display = "2"
expect_type = "Int64"

# --- module __init__ once-init: THE S4 divergence (value observable) -------
# Persistent: `Mi9199.__init__` (push!es to `seen`) runs ONCE at the definition
# eval, so `cnt()` stays 1 — matching upstream. Legacy re-runs the program every
# eval, so __init__ re-fires and `cnt()` grows 2, 3, … . Reviewed models_diverge
# cutover row (ADR: pin Persistent's upstream-correct behavior).
[[steps]]
name = "s4_reset_before_init_module"
action = "reset"

[[steps]]
name = "s4_init_module_def"
input = """
module Mi9199
    const seen = Int[]
    function __init__()
        push!(seen, 1)
    end
    cnt() = length(seen)
end
"""
expect_success = true

[[steps]]
name = "s4_init_module_cnt_first"
input = "Mi9199.cnt()"
models_diverge = true
# Legacy: __init__ re-ran once more this eval, so seen == [1, 1].
expect_success = true
expect_display = "2"
expect_type = "Int64"
# Persistent: __init__ ran only at the definition eval — matches upstream.
expect_success_persistent = true
expect_display_persistent = "1"
expect_type_persistent = "Int64"

[[steps]]
name = "s4_init_module_cnt_second"
input = "Mi9199.cnt()"
models_diverge = true
# Legacy keeps re-running __init__: seen grows again.
expect_success = true
expect_display = "3"
expect_type = "Int64"
# Persistent stays at the once-initialized value.
expect_success_persistent = true
expect_display_persistent = "1"
expect_type_persistent = "Int64"

# --- module __init__ once-init: stdout observable --------------------------
# A module whose __init__ prints: the definition eval prints in BOTH models
# (non-diverging). The later `f()` calls diverge in stdout ONLY — Legacy re-prints
# every eval, Persistent stays silent (init already ran). Asserted via
# `expect_stdout_persistent` (Issue #9199 S4).
[[steps]]
name = "s4_reset_before_print_module"
action = "reset"

[[steps]]
name = "s4_print_module_def"
input = """
module Mp9199
    function __init__()
        println("mp-init")
    end
    f() = 1
end
"""
expect_success = true
expect_stdout = "mp-init\n"

[[steps]]
name = "s4_print_module_f_first"
input = "Mp9199.f()"
models_diverge = true
# Legacy re-runs the module body + __init__, so it prints again.
expect_success = true
expect_stdout = "mp-init\n"
expect_display = "1"
expect_type = "Int64"
# Persistent: __init__ suppressed after realization — no re-print.
expect_success_persistent = true
expect_stdout_persistent = ""
expect_display_persistent = "1"
expect_type_persistent = "Int64"

[[steps]]
name = "s4_print_module_f_second"
input = "Mp9199.f()"
models_diverge = true
expect_success = true
expect_stdout = "mp-init\n"
expect_display = "1"
expect_type = "Int64"
expect_success_persistent = true
expect_stdout_persistent = ""
expect_display_persistent = "1"
expect_type_persistent = "Int64"

# --- reset() re-arms module init (S4 exit criterion: reset = fresh session) -
# After reset the session has realized no modules, so redefining the module runs
# its __init__ again under Persistent (the re-definition prints in both models);
# the post-reset `f()` call is again suppressed under Persistent only.
[[steps]]
name = "s4_reset_rearms_init"
action = "reset"

[[steps]]
name = "s4_print_module_redef_after_reset"
input = """
module Mp9199
    function __init__()
        println("mp-init")
    end
    f() = 1
end
"""
expect_success = true
expect_stdout = "mp-init\n"

[[steps]]
name = "s4_print_module_f_after_reset"
input = "Mp9199.f()"
models_diverge = true
expect_success = true
expect_stdout = "mp-init\n"
expect_display = "1"
expect_type = "Int64"
expect_success_persistent = true
expect_stdout_persistent = ""
expect_display_persistent = "1"
expect_type_persistent = "Int64"

