# heuristic but NOT yet covered by the differential corpus: a TUPLE global assigned
# once and read/indexed across LATER evals (#8243), and a MULTI-STATEMENT single
# input that defines two globals then evaluates an expression, with both globals
# read back across later evals. Both are Legacy ≡ Persistent AND match upstream
