# --- LV5 (Issue #9199): simple user module realized once on the LIVE VM --------
# A simple `module M … end` (functions + const bindings) is realized on the eval
# that DEFINES it (full recompile, which parks that VM); every later eval that
# only REFERENCES the module re-enters the parked VM, so the module's mutable
# const state persists IN the VM across evals — the structural close of #5296 for
# this subset, without `restore_module_globals`. Observationally identical across
# both models (Legacy fakes the same state via the restore machinery), verified
# against upstream `julia`.
[[steps]]
name = "lv5_reset_before_module"
action = "reset"

[[steps]]
name = "lv5_module_def"
input = """
module Lv5Log9199
    const entries = Int[]
    bump() = (push!(entries, length(entries) + 1); length(entries))
    peek() = length(entries)
end
"""
expect_success = true

# Cross-eval mutable module state (the #5296 core): the second call sees the
# first call's `push!`. Under Persistent this now runs on the live VM.
[[steps]]
name = "lv5_module_bump1"
input = "Lv5Log9199.bump()"
expect_success = true
expect_display = "1"
expect_type = "Int64"

[[steps]]
name = "lv5_module_bump2"
input = "Lv5Log9199.bump()"
expect_success = true
expect_display = "2"
expect_type = "Int64"

# Module const read across evals resolves against the live module.
[[steps]]
name = "lv5_module_len"
input = "length(Lv5Log9199.entries)"
expect_success = true
expect_display = "2"
expect_type = "Int64"

# A pure module function call across evals (no mutation) — identical both models.
[[steps]]
name = "lv5_module_peek"
input = "Lv5Log9199.peek()"
expect_success = true
expect_display = "2"
expect_type = "Int64"

# --- LV5: module __init__ runs ONCE (the S4 divergence, now on the live path) --
# Persistent realizes the module once, so `__init__` (which pushes to `seen`)
# fires only at definition and `cnt()` stays 1 — matching upstream `julia`.
# Legacy re-runs the whole program each eval, re-firing `__init__` → 2, 3, … .
[[steps]]
name = "lv5_reset_before_init_module"
action = "reset"

[[steps]]
name = "lv5_init_module_def"
input = """
module Lv5Mi9199
    const seen = Int[]
    function __init__()
        push!(seen, 1)
    end
    cnt() = length(seen)
end
"""
expect_success = true

[[steps]]
name = "lv5_init_module_cnt_first"
input = "Lv5Mi9199.cnt()"
models_diverge = true
# Legacy re-ran __init__ this eval: seen == [1, 1].
expect_success = true
expect_display = "2"
expect_type = "Int64"
# Persistent: __init__ ran only at the definition eval — matches upstream.
expect_success_persistent = true
expect_display_persistent = "1"
expect_type_persistent = "Int64"

[[steps]]
name = "lv5_init_module_cnt_second"
input = "Lv5Mi9199.cnt()"
models_diverge = true
expect_success = true
expect_display = "3"
expect_type = "Int64"
expect_success_persistent = true
expect_display_persistent = "1"
expect_type_persistent = "Int64"

