expect_success = true
expect_display = "true"
expect_type = "Bool"

[[steps]]
name = "s5_mutual_odd_call"
input = "myodd9199(7)"
expect_success = true
expect_display = "true"
expect_type = "Bool"

# a method that calls an earlier-defined method (callee defined first)
