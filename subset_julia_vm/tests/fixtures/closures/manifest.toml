[[tests]]
name = "closures_arrow_index_assign_body_8007"
file = "arrow_index_assign_body_8007.jl"
expected = true
description = "An arrow lambda whose single-expression body is an index/field assignment (x -> (x[2] = v), x -> (x.u[2] = v)) lowers to a closure that performs the mutation, instead of failing with 'missing lambda body' / 'assignment target must be identifier'; index/field assignment in expression position yields the assigned RHS value (Issue #8007)"

[[tests]]
name = "closures_iife_arrow_control_flow_8018"
file = "iife_arrow_control_flow_8018.jl"
expected = true
description = "An immediately-applied anonymous arrow lambda ((x -> body)(arg)) inside a function body lowers to a normal value-yielding call, not a tail return of the enclosing function: the continuation after the IIFE runs (returning a bool), and arithmetic on the IIFE result works instead of the lifted lambda's return leaking out (returning the lambda value early) or failing to compile with 'Cannot convert Nothing to I64' (Issue #8018)"

[[tests]]
name = "closures_fullform_iife_nested_8030"
file = "fullform_iife_nested_8030.jl"
expected = true
description = "An immediately-applied FULL-FORM anonymous function ((function(x) body end)(arg)) inside an enclosing function body lifts the lambda into a nested FunctionDef embedded in the LetBlock body (collected as a nested function of the frame) instead of routing through build_indirect_call, which buried the FunctionDef in a LetBlock binding the collector never visits — so the lambda compiles and dispatch no longer fails with 'Function <parent>#__anonymous_function_N not found'; covers capture of an outer local, multiple params, control-flow nesting, the with-LambdaContext (macro-containing) path, the top-level form, and arrow-form equivalence (Issue #8030)"

[[tests]]
name = "closures_closure_factory_name_collision_8080"
file = "closure_factory_name_collision_8080.jl"
expected = true
description = "A module-private closure factory _grad(f) returning a closure that captures `f`, built from an inner-constructor body and invoked deep inside a nested line-search-style loop, resolves the captured `f` correctly even though three distinct `f` bindings collide (the global `f`, the optimize/factory parameter `f`, and the captured `f`); renaming the global to `myf` gives the identical result — regression for the capture name collision behind Optim W-42 (Issue #8080)"

[[tests]]
name = "closures_nested_local_shadows_global_8105"
file = "nested_local_shadows_global_8105.jl"
expected = true
description = "A nested LOCAL function sharing a name with an existing GLOBAL function shadows that global within its enclosing scope while leaving the global intact elsewhere: zero-arg `g()`/`h()`, the value-reference variant (`f = zztop; f()` resolves to the global, `make_zztop()` to the inner zztop), argument forms, a recursive nested `fact` that must self-recurse to the LOCAL (not the global), typed-method visibility, the no-global-counterpart case, and globals intact after the enclosing call. Root causes: the inliner did not treat a nested FunctionDef name as a local binding (inlined the global body at the call site), and nested functions were registered in the shared short-name method table where signature dedup let the inner method replace the global's (Issue #8105)"

[[tests]]
name = "closures_recursive_nested_closure_8118"
file = "recursive_nested_closure_8118.jl"
expected = true
description = "A nested function that captures an enclosing local (a closure) can call itself recursively and call a mutually-recursive sibling: the self/sibling reference resolves through the captured environment instead of failing as 'Unknown function'. Covers self-recursion capturing a value (MWE1), pure mutual recursion (MWE2), self-recursion doing real work, mutually-recursive even/odd predicates, mutual recursion where only the callee captures an enclosing local, where both siblings capture it, three-way mutual recursion capturing a local, and regression guards for a non-recursive escaping closure and a captured function argument. prescan_mutual_closure_captures propagates a sibling closure's enclosing-local captures into every member that (transitively) calls it (sibling names excluded — reconstructed, not data-captured), so each member can reconstruct the others from the shared captures (Issue #8118)"
