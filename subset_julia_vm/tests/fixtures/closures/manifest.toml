[[tests]]
name = "closures_scalar_capture_reassign_6262"
file = "scalar_capture_reassign_6262.jl"
expected = true
description = "A closure capturing a scalar local observes later reassignments (Julia Core.Box cell semantics) instead of a stale value snapshot. A post-lowering pass (lowering/closure_box.rs) boxes a local as Ref when it is captured by a closure and reassigned >=2 times at its scope's top level, rewriting binding/reads/reassignments to Ref form in the scope and the closure; single-assignment captures stay unboxed (Issue #6262)"

[[tests]]
name = "closures_testset_closure_capture_reassign_6281"
file = "testset_closure_capture_reassign_6281.jl"
expected = true
description = "A closure capturing a scalar local to an @testset block (or a bare begin block) observes later top-level reassignments of that local, like the function-local case in #6262. Such bodies lower to nested empty-binding let blocks (Stmt::Expr(LetBlock{bindings:[]})), so the boxing pass (lowering/closure_box.rs) descends into empty-binding let blocks as defining scopes to unify the binding, its reassignments, and the capturing closure. The final boolean is the regression guard (a stale value snapshot makes it false); inner @tests are diagnostics. Matches upstream Julia (Issue #6281)"

[[tests]]
name = "closures_time_block_closure_capture_6288"
file = "time_block_closure_capture_6288.jl"
expected = true
description = "A closure capturing a variable local to a @time/@elapsed block compiles (previously failed 'Undefined variable' even read-only) and observes later reassignments (Core.Box semantics), including `r = @time begin … end` as an assignment value. @time lowers its body to `#result# = let … end` (an empty-binding let block as an assignment value), so the lambda-capture pre-analysis (compile/mod.rs) and the boxing pass (lowering/closure_box.rs) descend into that form. Final boolean is the regression guard; inner @tests are diagnostics; @testset regression included. Matches upstream Julia (Issues #6288/#6281)"

