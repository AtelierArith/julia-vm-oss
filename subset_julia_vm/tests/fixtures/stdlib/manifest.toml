[[tests]]
name = "stdlib_printf_pure_julia_6746"
file = "printf_pure_julia_6746.jl"
expected = true
description = "@sprintf/sprintf is a pure-Julia C-style Printf engine (base/printf.jl, Issue #6746, #6730 slice 1/4). Parses flags/width/.precision/conversion and lays out integers, hex/octal, strings and chars in pure Julia; the float conversions %f/%e/%E/%g/%G delegate to the Rust _printf_fmt_float boundary (Ryu float→string). Fixes the old behavior that ignored width/precision/flags and dropped default float precision (%f now → 6 digits). Covers integer width/zero-pad/+/space/precision, %#x/%08x/%#o, float precision/width/left/zero/sign, %e/%E/%g, %s width/precision, %c, %%. Uses the standard @sprintf macro; values verified against upstream julia 1.12."

