[[tests]]
name = "stdlib_random_rng_independent_instances_9270"
file = "random_rng_independent_instances_9270.jl"
expected = true
description = "Two same-seed RNG values bound to separate variables must be INDEPENDENT: interleaved rand(m1)/rand(m2) draws repeat pairwise for MersenneTwister and Xoshiro, randn is likewise independent, plain assignment (m2 = m1) aliases one mutable engine so draws diverge, and first draws of two constructions match. Regression for the CSE bug that value-numbered a second MersenneTwister(seed)/Xoshiro(seed) constructor into a reuse of the first engine (Issue #9270; same class as zeros/ones aliasing, Issue #7176)"

