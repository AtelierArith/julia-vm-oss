[[tests]]
name = "stdlib_random_mersenne_twister_ctor_7306"
file = "random_mersenne_twister_ctor_7306.jl"
expected = true
description = "MersenneTwister(seed) construction: constructible (bare and Random.-qualified), rand/randn return finite values, same seed -> same sequence (reproducible across two constructions), distinct seeds differ, rand(m,n)/randn(m,n) vectors, isa AbstractRNG, typeof name, threads through untyped/::MersenneTwister/::AbstractRNG params. Backed by a deterministic MT19937-64 engine; stream is NOT bit-identical to upstream julia's dSFMT MersenneTwister (Issue #7306)"
