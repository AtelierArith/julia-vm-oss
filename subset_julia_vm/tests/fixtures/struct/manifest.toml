[[tests]]
name = "struct_global_new_helper_11005"
file = "global_new_helper_11005.jl"
expected = true
description = "Issues #11005/#11179/#11183/#11186/#11187/#11197/#11204: a struct body may declare a differently named `global` helper whose body calls `new`/`new{T}` (upstream's `Rational`/`unsafe_rational` shape). The helper is registered as an ordinary global method with privileged access to the enclosing struct's `new`, including through ordinary nested functions and a lifted closure but stopping at runtime @eval global-function boundaries; direct and nested ownerless calls use ordinary name lookup and raise UndefVarError, transparent begin/let/assignment-RHS/@kwdef paths keep the helper, and mixed positional/multiple-splat `new` preserves every argument."

