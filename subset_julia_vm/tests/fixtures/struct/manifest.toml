[[tests]]
name = "struct_parametric_inner_ctor_with_outer_8121"
file = "parametric_inner_ctor_with_outer_8121.jl"
expected = true
cache_sensitive = true
description = "Issues #8121/#10959/#11003/#11019: parametric constructor self identity survives Base-cache method-table restore. Covers braced inner vs plain inner vs bare outer vs explicit outer, runtime type binding, cross-binder self correlation, built-in/user/lexically-scoped alias redefinitions, distinct qualified-owner bounds and bare/qualified lexical-bound redefinitions, owner-scoped and module-local nested-type selection, structured bounds, runtime misses, and positional-default forwarding stubs."

[[tests]]
name = "struct_runtime_bound_alias_matrix_11142"
file = "runtime_bound_alias_matrix_11142.jl"
expected = true
description = "Issue #11142: runtime parametric-struct bounds use the same visible type-alias expansion for exact qualified and unique bare aliases, including Union targets, through both Core.apply_type and runtime new{T} construction. Resolver unit coverage separately locks ambiguous bare aliases and lower-bound expansion."

[[tests]]
name = "struct_qualified_alias_binder_collision_11019"
