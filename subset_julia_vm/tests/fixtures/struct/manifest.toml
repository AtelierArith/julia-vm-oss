[[tests]]
name = "struct_parametric_inner_ctor_outer_where_10959"
file = "parametric_inner_ctor_outer_where_10959.jl"
expected = true
description = "Issues #10959/#10967/#10993: explicit `Foo{T}(...)` selects the declared explicit-parametric inner even when a bare outer has the same value signature and `where T`; bare calls still reach the outer, whose runtime T binding is forwarded to the normalizing inner body. Runtime expressions remain dynamic, duplicate inner definitions remain last-definition-wins, and statically known explicit parameters participate in value-signature overload selection."

[[tests]]
name = "struct_getproperty_override_8127"
file = "getproperty_override_8127.jl"
expected = true
description = "Issue #8127: a custom `Base.getproperty(::T, ::Symbol)` override intercepts property access `x.f` — Julia lowers `x.f` to `getproperty(x, :f)` (default falls back to `getfield`). Computed (non-declared) properties resolve through the override, and declared-field access still works via the override's getfield fallback, both at top level and through a typed function parameter. Covers a Rotations.QuatRotation-style wrapper that stores one field and exposes derived components."

[[tests]]
name = "struct_alloc_loop_safepoint_10102"
file = "struct_alloc_loop_safepoint_10102.jl"
expected = true
description = "Issue #10102: struct-allocating loops stay correct after the memory-waterline safepoint moved off the per-instruction dispatch path onto loop back-edges (jump_to) + Call/Return boundaries (handle_pending_call_depth_overflow). A per-iteration struct allocation, an array of live structs kept across the loop, and nested-call allocation all produce upstream-correct sums even when a back-edge compaction relocates live struct-heap storage."

[[tests]]
name = "struct_per_element_return_safepoint_10102"
file = "struct_per_element_return_safepoint_10102.jl"
expected = true
description = "Issue #10102 follow-up: per-element struct/tuple/named-tuple/dict-returning drivers (struct-constructor broadcast, struct/named-tuple comprehensions, tuple broadcast, dict-returning function in a loop) stay correct after the container Return arms (ReturnStruct/ReturnTuple/ReturnNamedTuple/ReturnDict/ReturnSet) gained the handle_pending_call_depth_overflow safepoint postlude that the scalar Return arms already carried — restoring safepoint symmetry so a struct-returning HOF/generator callee (which bypasses jump_to and the Call postlude) still brackets struct-heap growth with a memory-waterline check."
