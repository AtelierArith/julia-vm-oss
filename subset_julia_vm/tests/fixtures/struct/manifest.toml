[[tests]]
name = "struct_global_helper_macro_context_11179"
file = "global_helper_macro_context_11179.jl"
expected = true
description = "Issues #11179/#11193: a struct-body `global` helper (#11005) is an ordinary global method, so its body must be lowered through the central LambdaContext routing authority — the privileged `new` comes from `Function.new_struct_name`, orthogonally. Locks the MACRO case specifically: a user-defined macro call inside a helper body (short and long form, with and without a `where` binder). An earlier fix (#11179, commit d0dfe0578) kept `new` working by lowering these helpers context-FREE, which made a user macro in the body fail to lower at all (`UnsupportedFeature { kind: MacroCall }`) while every audit stayed green."

