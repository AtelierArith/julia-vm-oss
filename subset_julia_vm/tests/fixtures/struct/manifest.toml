file = "inline_parametric_ctor_promote_7284.jl"
expected = true
description = "An inline `Foo(3).x` access where the user outer constructor promotes its args (v = float(x); Foo{typeof(v)}(v)) infers the promoted field type, not Foo{Int64}, instead of failing with 'expected I64, got Float64'; the default-constructor path keeps its precise Int field type (Issue #7284)"

[[tests]]
name = "struct_outer_ctor_default_ctor_reachable_7793"
file = "outer_ctor_default_ctor_reachable_7793.jl"
expected = true
description = "A user OUTER constructor (which registers the struct name as a function) must not hide the synthesized field-count default constructor for a bare or module-qualified top-level call whose arity differs from the outer ctor. Adds the field-count default-ctor fallback to the multi-arg / static-miss NoMethodFound recovery arms and the qualified compile_module_call_via_method_table path; preserves same-arity outer-ctor overloads, the full-arity recursion guard, and inner-constructor structs (Issue #7793, family of #7729)"

[[tests]]
name = "struct_outer_ctor_nonconvertible_methoderror_7793"
file = "outer_ctor_nonconvertible_methoderror_7793.jl"
expected = true
description = "PR #7826 regression guard: when an outer ctor exists but a matching-arity call's argument types are convertible to NEITHER the outer ctor NOR the concrete field types, the field-count default-constructor fallback must NOT manufacture the default ctor (which would raise an uncatchable compile-time 'Cannot convert ...' error). A side-effect-free coercion_accepts pre-check makes such calls fall through to normal dispatch, producing a CATCHABLE runtime MethodError matching upstream julia, while convertible/declared paths keep working (Issue #7793)"

[[tests]]
name = "struct_parent_typevar_shadows_global_7840"
file = "parent_typevar_shadows_global_7840.jl"
expected = true
description = "A struct's own declared type parameters are lexically scoped and must shadow any same-named top-level global/alias when the declared parent type is lowered. A global `T = Int64` must NOT freeze `struct Wrap{T} <: AbstractVector{T}` to `AbstractVector{Int64}` (which wrongly made `Wrap{Float64} <: AbstractVector{Float64}` false); the parent template stays parametric (Issue #7840)"

[[tests]]
name = "struct_multiparam_inner_ctor_typeof_7972"
file = "multiparam_inner_ctor_typeof_7972.jl"
expected = true
description = "Issue #7972: a multi-parameter parametric struct built through its inner constructor new{A,B,...}(...) reports ALL type parameters in typeof (P3{Int64,Float64}, T3{Int64,Float64,Bool}), not just the first; single-parameter structs (S1{T}, Rational, Complex) keep working"

[[tests]]
name = "struct_guarded_generic_field_assign_7941"
file = "struct_guarded_generic_field_assign_7941.jl"
expected = true
description = "A generic function that guards a field assignment with `isdefined` (e.g. `if !isdefined(G, :__attrs); G.__attrs = ...; end` with `G::T where T`) compiles even though no in-scope struct declares the field; the assignment is deferred to a runtime SetFieldByName instead of being rejected at compile time with \"Unknown field\". Concrete-struct field validation is unchanged (a bad field on a known struct still errors). Also covers the runtime guarded assign to an existing field through a generic receiver (Issue #7941)."

[[tests]]
name = "struct_dynamic_new_type_params_7935"
file = "struct_dynamic_new_type_params_7935.jl"
expected = true
description = "An inner constructor whose `new{...}` type parameters are computed by calls (e.g. `new{elem_type(R), elem_type(coefficient_ring(R))}(R)`) evaluates each type-arg expression at runtime and builds the COMPUTED concrete parametric type (typeof(r).parameters == (MyElem, MyElem)) instead of collapsing to {Any}. The unqualified type-name display matches the existing `new{T}` inner-ctor path (Issue #7935)."

[[tests]]
name = "struct_parametric_ctor_no_widen_methoderror_8102"
file = "parametric_ctor_no_widen_methoderror_8102.jl"
expected = true
description = "The default constructor of a parametric struct `Foo{T}; a::T; b::T; end` is `Foo(a::T, b::T) where T`: every `::T` field's argument must unify to ONE concrete T without promotion. `Foo(1, 2.0)` has no matching default method and raises a MethodError (it must NOT widen to `Foo{Float64}`); only the explicit `Foo{Float64}(1, 2.0)` form converts. Same-T constructions, independent type params, and non-`T` free fields still succeed. Verified at parity with upstream Julia (Issue #8102)."

