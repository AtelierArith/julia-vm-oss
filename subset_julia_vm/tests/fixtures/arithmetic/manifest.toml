[[tests]]
name = "arithmetic_scalar_getindex_4814"
file = "scalar_getindex_4814.jl"
expected = true
description = "Scalars (Number / AbstractChar subtypes) act as 0-dim collections: `x[1] == x` returns the scalar, `x[i]` for `i != 1` raises `BoundsError`. Unlocks `vcat(scalar, vec, ...)` whose Pure-Julia body indexes each arg via `args[i][j]` (Issue #4814)"

[[tests]]
name = "arithmetic_length_char_4871"
file = "length_char_4871.jl"
expected = true
description = "`length(::Char)` / `length(::BigInt)` / `length(::BigFloat)` return 1 — completing the `Number ∪ AbstractChar` scalar carrier list used by the `Length` builtin so it matches the same hierarchy `is_scalar_indexable_value` (PR #4870 / Issue #4814) uses for scalar `getindex` (Issue #4871)"

[[tests]]
name = "arithmetic_ndims_char_4878"
file = "ndims_char_4878.jl"
expected = true
description = "`ndims(::Char)` returns 0 like other scalar carriers (Number subtypes already worked). Same pattern as `length(::Char)` (#4871) — the `Char` carrier was missing from the builtin's allow-list. Now delegates to the shared `is_scalar_carrier` predicate (#4875 / PR #4877) so the `Number ∪ AbstractChar` boundary stays in lock-step across `length`, `getindex`, and `ndims` (Issue #4878)"

[[tests]]
name = "arithmetic_bigint_egal_4883"
file = "bigint_egal_4883.jl"
expected = true
description = "`x === x` is reflexive for `BigInt` and `BigFloat` bound to the same local (and for `y = x` aliases). Previously fell through the `Egal` builtin's main match to `_ => false` because `BigInt` / `BigFloat` arms were missing — now compares by value via new arms. sjulia stores BigInt/BigFloat as value types, so the fix accepts a documented tradeoff for cross-instance same-value `===` (returns true vs upstream's false) in exchange for self-comparison correctness (Issue #4883)"

[[tests]]
name = "arithmetic_narrow_int_wrapping_5205"
file = "narrow_int_wrapping_5205.jl"
expected = true
description = "Narrow-integer arithmetic (Int8/Int16/UInt8, +/-/*) wraps modularly like upstream Julia across flattened chains (`a + b + c`), parenthesized chains, runtime dynamic dispatch in untyped functions, callable operator values, and the vararg `map(+, ...)` / `map(*, ...)` paths. Regression from #5192 made the range-checked `convert` throw InexactError when narrow-int arithmetic widened an intermediate to Int64 and converted back; the fix keeps narrow-int compile-time and runtime results in the narrow type while preserving #5192's explicit `convert(Int8, 300)` InexactError (Issues #5205, #6512). Issue #6597 re-evaluates the #6512 `::Function` carve-out (now removed; `type_matches` routes `::Function` through the shared subtype engine) and adds a re-evaluation block covering direct callable operators, `map(op, ...)`, and CRITICALLY empty narrow-int / Bool `reduce` / `mapreduce` (the #6528/#6529 regression must not throw)"

