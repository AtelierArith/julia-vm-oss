[[tests]]
name = "dispatch_parametric_struct_where_bound_5646"
file = "dispatch_parametric_struct_where_bound_5646.jl"
expected = true
description = "A parametric user struct argument dispatches to a method whose type parameter is bounded by a user abstract type (f(x::T) where {T<:Shape} with struct Circle{T<:Real} <: Shape). Previously NoMethodFound: the struct-parent dispatch fallback gate (needs_struct_parent_fallback) has a (TypeVar bound, Struct) arm but julia_type_matches_with_struct_parents lacked the matching arm, so the fallback triggered yet the match check fell through to false; and parametric user structs were absent from the struct_parents map (they instantiate lazily outside struct_defs, Issue #5052) so the chain could not accept Circle<:Shape nor reject an unrelated Box{T}. Fix adds the (TypeVar, Struct) and (Struct var, Struct) arms to the match function and seeds parametric structs' base-name->parent into struct_parents. Covers parametric/non-parametric/abstract-arg positives, multi-level user-abstract chain (Dog{T}->Mammal->Animal), parametric abstract parent (MyVec{T}<:Wrapper{T} matches bare Wrapper), and fallback-selecting negatives for unrelated structs. Advances #5047"

[[tests]]
name = "dispatch_single_beats_vararg_5924"
file = "single_beats_vararg_5924.jl"
expected = true
description = "An exact-arity fixed-parameter method outranks a same-projection vararg method for a call matching the fixed arity (g(::Int) beats g(::Int...) for g(1)), independent of declaration order. Root cause: MethodTable::add_method dedup collapsed g(x::Int) and g(x::Int...) into one method because neither the structured core_signature (Tuple{Int} for both) nor the legacy params projection encoded the Vararg marker, so the second definition replaced the first and dispatch fell back to registration order. Fix guards the dedup on matching vararg structure (vararg_param_index / vararg_fixed_count) so the two remain distinct methods; the existing scorer (which already ranks the fixed method strictly higher) then selects it. Controls verify g(2,3)/g() route to the vararg method and a multi-arg fixed method beats a trailing vararg, matching upstream Julia (Issue #5924)"

