[[tests]]
name = "dispatch_splat_vararg_forward_type_apply_11539"
file = "splat_vararg_forward_type_apply_11539.jl"
expected = true
description = "Splatting the SAME vararg collection forward into a runtime type-application curly (Foo{M,N,T,n}(xs...), a local-variable trailing value parameter, an inline-call one, and a module-qualified struct) must resolve identically to the non-splat form (Foo{M,N,T,n}(xs)): the compiler now builds the runtime DataType callee (emit_parametric_type_arg_value + ApplyTypeDynamic) and invokes it through the splat-aware runtime call path instead of falling through to compile_splat_call (which mis-resolved the whole curly text as an undefined variable name) or into owned_constructor_name_in_scope's eager compile_runtime_datatype_value_call (which rejected a where-bound runtime type variable); the VM's CallFunctionVariableWithSplat handler was also missing the DataType/Struct/StructRef callee arms CallFunctionVariable already had (Issue #11539)"
