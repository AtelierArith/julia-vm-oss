[[tests]]
name = "dispatch_param_shadows_builtin_type_constructor_10146_10268"
file = "param_shadows_builtin_type_constructor_10146_10268.jl"
expected = true
description = "A function-scope parameter named after a NON-numeric builtin type constructor (String/Bool/BigInt) shadows the global constructor throughout the body, matching upstream Julia lexical scoping: `f(String) = String(2)` called as `f(x -> x + 10)` calls the PARAMETER (the lambda), returning 12, not the builtin String constructor. Complements the numeric case (Float64/Int64, Issue #10146) covered by functions/parameter_shadows_numeric_constructor_10146.jl (PR #10417, the lazy runtime specializer fix) — this fixture covers the REMAINING surface #10417 left unfixed: static return-type inference (src/compile/abstract_interp/engine/mod.rs), which previously fell through to the builtin-constructor transfer-function registry for any unresolved local-bound call, mis-declaring a String-shadowed function's return type as Str and CRASHING a caller with \"Type error: expected String, got Int64\". Reporting Any when the callee name is env-bound closes that gap. Also covers non-shadowed builtin-constructor calls (String from Char array; unshadowed numeric conversion) and the pre-existing shadowed-plain-value-reference case (Issue #10268)"

[[tests]]
name = "dispatch_where_binder_shadows_builtin_type_10407"
file = "where_binder_shadows_builtin_type_10407.jl"
expected = true
description = "A where-clause binder whose name collides with a builtin/global type name (`h(x::Float64) where {Float64}`) must be a fresh method-local TypeVar shadowing the global BOTH in the signature and in the body, matching upstream lexical scoping. Two coupled fixes: (1) lowering resolved the annotation to the builtin concrete type before the TypeVar conversion pass, so dispatch spuriously raised `MethodError: no method matching h(::Int64)` — parse_type_name now resolves an active where-binder name (ScopedExclusion, Issue #7847 mechanism) as a plain Struct so convert_params_with_type_vars rewrites it into the TypeVar with declared bounds; (2) the lazy runtime specializer (src/vm/specialize) baked the builtin type object/constructor into the specialized body for any name not in its locals, so `Float64(2)` returned `2.0` even when the TypeVar was bound to Int64 — where binders are now registered as Any locals so compile_var/compile_call emit dynamic LoadAny consulting the per-call frame type_bindings (extending the Issue #10146 local-callee gate to where binders). Shadowing is name-based: `x::Int` under `where {Int64}` still resolves to the global Int alias. Covers short/full form, plain value load of the binder, bounded colliding binder (bounds still restrict dispatch), the non-colliding `where {T}` control, and unshadowed builtin conversions. Distinct from the parameter-shadowing fix #10146/#10268 (PR #10417). Verified against upstream julia 1.12 (Issue #10407)"

[[tests]]
name = "dispatch_parametric_ctor_callable_parity_10502"
file = "parametric_ctor_callable_parity_10502.jl"
expected = true
description = "Prevention audit for Issue #10502 (follow-up to #10405/PR #10487): pairs DIRECT parametric constructor syntax with FIRST-CLASS DataType callable forms (bound variable, map) for the public parametric constructors beyond the array/ctor_direct_vs_callable_parity_10213 coverage — Dict{K,V} (varargs/empty/vector-of-pairs), Rational{T} with Bool/Int32/BigInt sibling parameterizations each resolving to their OWN instantiation, and Complex{T} including the default-constructor-fallback-after-dispatch-miss class (Complex{Int64}(re, im) must keep constructing even though generic Complex{T} candidates exist). Negative guards: InexactError for Rational{Bool}(2), catchable MethodError for String arguments to Rational/Complex callables. User-struct directions: a generic TypeVar ctor method (G{T}(::String) where {T}) is shared across instantiations (direct/bound/map), and a method defined only on one concrete instantiation stays invisible to sibling parameterizations (miss-free assertions only — the default-ctor-suppression crash and the non-convertible-argument divergence are tracked as Issues #10592/#10593 and documented in the fixture header instead of asserted). Sibling-selectable argument shape (Codex review on PR #10601): a Bool-only method on one concrete instantiation is paired with sibling default-ctor calls taking the SAME Bool argument (direct/bound/map), so a candidate-augmentation leak surfaces as a wrong value/type instead of needing the #10593-blocked MethodError direction. Verified against upstream julia 1.12 (Issue #10502)"

[[tests]]
name = "dispatch_module_function_identity_matrix_11088"
file = "module_function_identity_matrix_11088.jl"
expected = true
description = "Same-named functions declared in sibling modules must NOT compare ==/=== as one value (the function/method-domain analog of Issue #11021's same-named-struct collapse), found investigating Issue #10990 (Phase 3 of the semantic-ID epic #10459, FunctionId/MethodId). emit_function_value_named (subset_julia_vm_compile/src/compile/core_compiler.rs) always baked the BARE declared name into a resolved function value's runtime type identity — correct for Issue #10077 (the SAME declaration must report the SAME typeof regardless of qualified-vs-bare/imported access) but over-applied: it did not distinguish that case from two DIFFERENT declarations that merely share a bare name across sibling modules. Fixed by checking, at the point a qualified access's identity name is chosen, whether ANOTHER module's qualified method-table key also ends in the same bare name (a non-destructive key-existence check, immune to MethodTable::add_method's same-signature dedup which can otherwise silently evict one sibling's entry from the shared bare-name table, Issue #8079) — using the qualified spelling as the identity only when a sibling declaration exists. Covers direct sibling-module collision (===/==/typeof, both directions), nested-module same-name collision, self-identity sanity, calling correctness, and the Issue #10077 invariant (bare-vs-qualified access to the SAME declaration keeps identical typeof) in one matrix, mirroring modules/module_struct_identity_matrix_11021.jl's structure. Verified against upstream julia 1.12.6 (Issue #11088, #10990, #10459)"

