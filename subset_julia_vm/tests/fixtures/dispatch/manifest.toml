[[tests]]
name = "dispatch_callable_struct_vararg_self_11386"
file = "callable_struct_vararg_self_11386.jl"
expected = true
description = "Bound-form callable structs `(self::Type)(args)` with a vararg call overload dropped the bound self instance during runtime dispatch: callable_struct_needs_self originally judged applicability from candidate arity alone, which cannot distinguish an anonymous vararg method (`(::Type)(a, xs...)`) from a bound vararg method (`(self::Type)(xs...)`) since both present the same fixed-arity/vararg-index shape (Issue #11386). A follow-up heuristic (comparing the first parameter's JuliaType name against the method's own `__callable_<TypeName>` registration suffix) fixed that but misclassified an anonymous method whose own first parameter merely happens to be annotated with the struct's own type, e.g. `(::B)(x::B, xs...)`, as bound-form (Issue #11553). Fixed for good by determining bound-ness structurally at *definition* time: lowering marks the synthesized `self` parameter's name with a reserved marker (ground truth, not inferred from type/arity), which survives into `FunctionInfo::params[0].0` and is aliased back to the user's chosen identifier via a body prologue. Covers fixed-arity (control/no regression), plain vararg, splatted vararg, kwargs+vararg callable-struct calls (Issue #11386), and an anonymous-form self-typed-first-vararg-parameter method that must NOT bind self (Issue #11553), verified against upstream julia 1.12.6"

[[tests]]
name = "dispatch_repeated_where_param_conflict_11231"
file = "repeated_where_param_conflict_11231.jl"
expected = true
description = "A method `where` parameter that repeats across positions (Pair{T,T}, nested Wrap2{T,Boxx{T}}, three-occurrence Trip3{T,T,T}, built-in Tuple{T,T}) must unify to the SAME type; a second conflicting binding rejects the candidate instead of silently accepting any combination. Issue #11231 fixed the struct-to-struct binding extractor in both subset_julia_vm_types/src/types/julia_type/comparison.rs (legacy rendered-Struct path) and subset_julia_vm_types/src/inference_core/dispatch_resolver/core_match.rs (structured CoreType matcher), plus the VM's post-selection extract_type_bindings_for_selected_method fallback in subset_julia_vm_vm/src/vm/dispatch.rs, to merge bindings with a conflict-aware unify-check (type equality) rather than a raw insert/extend. Issue #11490 (different root cause, found while writing this fixture) fixed a SEPARATE compile-time-only bug: a literal built-in Tuple{...} type argument used a single-arg static-dispatch fast path (core_static_datatype_exact_match in subset_julia_vm_compile/src/compile/expr/call/dispatch.rs) that checked each where-bound Tuple element independently with no shared binding state, so Tuple{Int,String} wrongly matched Tuple{T,T}; fixed by threading a HashMap<String,CoreType> of typevar bindings through the recursive match (anonymous covariant/contravariant `_` placeholders exempted). Covers both static and runtime (variable-bound) dispatch. Verified against upstream julia 1.12.6 (Issues #11231, #11490)"

