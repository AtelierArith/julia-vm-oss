[[tests]]
name = "dispatch_alias_where_bound_parametric_struct_8406"
file = "alias_where_bound_parametric_struct_8406.jl"
expected = true
description = "Where-clause bounds written through a type alias are expanded before method-table registration, so GenericPolyRing{T,R} where T<:RingElement accepts BigInt through the alias union and runtime dispatch reaches the method body (Issue #8406)"

