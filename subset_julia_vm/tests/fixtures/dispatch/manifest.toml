[[tests]]
name = "dispatch_abstractmatrix_no_loose_match_function_7334"
file = "dispatch_abstractmatrix_no_loose_match_function_7334.jl"
expected = true
description = "A `::AbstractMatrix` (= `AbstractArray{T,2}`) method parameter only matches 2-D array values: a function singleton (`typeof(sin)`) must NOT loose-match it. The compile-time struct-parents fallback no longer conservatively accepts a function-singleton struct name as a subtype of an arbitrary abstract bound (it resolves through its known built-in `Function` supertype instead), so `h(sin)` selects the specific `h(::Function)` method and a lone `g(::AbstractMatrix)` raises a MethodError for `g(sin)`, matching upstream Julia (Issue #7334, same conservative-accept class as #7266; unblocks the #7275 `scatter(sin)` path)"

[[tests]]
name = "dispatch_morespecific_partial_order_5926"
file = "dispatch_morespecific_partial_order_5926.jl"
expected = true
description = "Method specificity consults the upstream morespecific partial order (subtype-decidable fragment) before the integer score: container vs abstract supertype (Vector{T} vs AbstractVector), diagonal Tuple{T,T} vs Tuple{Any,Any}, bounded where-params (Vector{<:Integer} vs Vector{<:Real}, previously a spurious ambiguity), and nested parametrics dispatch to the more specific method, matching upstream Julia; the override is gated on the argument tuple being a subtype of the chosen signature so an imprecise (Any) argument still defers to runtime dispatch (no codegen over-commit) (Issue #5926, part of #5072)"

