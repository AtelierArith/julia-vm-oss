[[tests]]
name = "dispatch_qualified_base_builtin_function_value_identity_10284"
file = "qualified_base_builtin_function_value_identity_10284.jl"
expected = true
description = "Residual of Issue #10077: `Base.<fn>` for the small `is_base_function` allowlist (sqrt/floor/ceil/round/println, operators via function_name_to_binary_op) still baked the qualified `\"Base.<fn>\"` spelling into the captured FunctionValue's name because these BuiltinOp/intrinsic-backed names have no genuine `\"Base.<fn>\"` entry in method_tables to resolve candidates through (unlike Pure Julia Base functions such as Base.map/Base.sin, unaffected by this bug), making `isa Function` false and `typeof` diverge from the bare-access identity. Fixed by resolving candidates through the bare `<fn>` method-table key (where Base's own extensions/methods for these names actually live) while still emitting the bare display name, mirroring the general Base.<fn>-as-value convention (Issue #8137); covers isa Function, typeof identity, direct calling, and HOF-callback (map/filter) correctness for the allowlist and representative operators, plus a regression guard for is_base_function's type/constructor-name entries (Int/String/Char/Ref/IOBuffer), which require the type-name check in compile_module_function_ref to run before the is_base_function branch so they keep resolving as DataType values, not Function values (Issue #10284, #10255)"

[[tests]]
name = "dispatch_comprehension_concrete_array_family_10206"
file = "comprehension_concrete_array_family_10206.jl"
