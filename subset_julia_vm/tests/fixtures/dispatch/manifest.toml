description = "A multi-iterator comprehension's rank-known/element-unresolved bare Vector/Matrix alias (Issue #6817) previously statically matched NO method against a CONCRETE ::Array{Any,N}-typed candidate (only abstract AbstractVector/AbstractMatrix candidates triggered the runtime-dispatch-deferral fallback), raising a spurious compile-time MethodError for rank >= 2 instead of deferring to runtime dispatch on the genuinely Matrix{Any}/Array{Any,N} runtime value. Fixed by broadening the fallback's array-family probe to abstract-or-concrete (core_is_array_family_type); covers a variable-bound and an inline rank-2 comprehension, a rank-1 non-regression, and a 3-D comprehension against a bare ::Array/::Array{Any,3} pair. Verified against upstream julia 1.12 (Issue #10206)"

