[[tests]]
name = "control_flow_block_value_control_flow_tail_9358"
file = "block_value_control_flow_tail_9358.jl"
expected = true
description = "A `try`/`catch` (or `if`) used as the EXPRESSION VALUE of a block yields the branch value, not `nothing` (Issue #9358). A `begin ... end` block in value position and the `x = begin ... end` assignment fast path dropped the value of a trailing control-flow statement, running it for effect and defaulting to `nothing` — the headline symptom was a generator/comprehension body wrapped in `begin ... try ... catch ... end end` collecting `nothing` for every element while side effects fired correctly. Fixed generally (compile_block_value + append_begin_rhs_assignment route a trailing Stmt::If/Stmt::Try through if_stmt_into_value_expr/try_stmt_into_value_expr; the shared block-tail-value rewriter now descends nested `if`/elseif chains). Verified at parity with upstream julia: the #9358 generator MWE + bracket comprehension + if-body generator (value + side-effect order); begin-block-as-value with if/elseif, try/catch, try/else, and finally tails at top level and function tail; a no-match `if` and a loop tail keep the `nothing` value; #7617 non-tail assignment visibility preserved; nested control-flow tails"

