[[tests]]
name = "control_flow_assign_statement_tail_value_10431"
file = "assign_statement_tail_value_10431.jl"
expected = true
description = "General fix (Issue #10431, discovered while closing #10254): assignment statements return their RHS value across indexed, field, dict, and tuple-destructuring shapes in plain function, branch, begin, and try tail positions. Includes a macro same-span negative guard for genuine nested blocks. Independent literals use explicit IR since #10444; flat nonliteral RHS uses explicit IR since the partial #10464 generalization; dependent/nested/rest forms retain the generated-temp fallback."

