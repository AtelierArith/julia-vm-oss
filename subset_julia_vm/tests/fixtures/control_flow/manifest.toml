expected = true
description = "A local initialized to Nothing retains a physical backing value when only one control-flow branch widens it to Any, including flat destructuring assignment; the non-assigning path returns nothing instead of UndefVarError (Issue #10819)"

[[tests]]
name = "control_flow_nothing_initialized_trycatch_loop_widen_10820"
file = "nothing_initialized_trycatch_loop_widen_10820.jl"
expected = true
description = "Prevention follow-up to #10819 (Issue #10820): extends the branch-widening matrix to try/catch (assigning try path vs. assigning catch path) and to a loop that may execute zero times, for a local initialized to Nothing and widened to Any on only one path. The non-assigning path still reads back nothing instead of UndefVarError"
