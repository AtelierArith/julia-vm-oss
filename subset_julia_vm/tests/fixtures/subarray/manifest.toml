[[tests]]
name = "subarray_reshapedarray_type_surface_5137"
file = "reshapedarray_type_surface_5137.jl"
expected = true
description = "reshape(::Array) remains Array while reshape(::SubArray) exposes a ReshapedArray{T,N,P,Tuple{}}-style AbstractArray surface with parent delegation and SubArray aliasing (Issue #5137)"

[[tests]]
name = "subarray_matrix_range_view_5137"
file = "matrix_range_view_5137.jl"
expected = true
description = "Matrix UnitRange/UnitRange view exposes a 2D SubArray surface with parent aliasing and shape-preserving collect copy (Issue #5137)"

[[tests]]
name = "subarray_matrix_colon_view_5137"
file = "matrix_colon_view_5137.jl"
expected = true
description = "Matrix views with Colon indices expose a 2D SubArray surface with parent aliasing and shape-preserving collect copy (Issue #5137)"

[[tests]]
name = "subarray_matrix_dim_dropping_view_5137"
file = "matrix_dim_dropping_view_5137.jl"
expected = true
description = "Matrix view with a scalar Int index drops that dimension, yielding a 1D SubArray (row/column slice) with parent aliasing and read/write reflection (Issue #5137)"

[[tests]]
name = "subarray_view_3d_range_5137"
file = "view_3d_range_5137.jl"
expected = true
description = "3D range view view(A::Array{T,3}, r1, r2, r3) returns a 3D SubArray with column-major linear/Cartesian read and write-through to the parent and a shape-preserving collect into Array{T,3} (Issue #5137)"

[[tests]]
name = "subarray_map_over_view_5137"
file = "map_over_view_5137.jl"
expected = true
description = "map(f, v) over a SubArray materializes the view via collect(::SubArray) first (the runtime collect iterator path does not recognize the SubArray struct), so 1D/2D/dimension-dropping view mapping matches upstream without mutating the parent (Issue #5137)"

[[tests]]
name = "subarray_reshape_view_iterate_5137"
file = "reshape_view_iterate_5137.jl"
expected = true
description = "reshape(view(...), n) produces a 1D ReshapedArray over a SubArray; linear iterate/collect/map/sum (via the element getindex delegating to the SubArray parent) match upstream column-major reads without mutating the parent (Issue #5137)"

[[tests]]
name = "subarray_broadcast_over_view_5137"
file = "broadcast_over_view_5137.jl"
expected = true
description = "Broadcasting over a SubArray view (arithmetic, math functions, comparisons, 1D/2D/dimension-dropping) participates in the pure-Julia broadcast pipeline as the aliased array (shape/axes, eltype inference, Extruded loop, non-Extruded BitVector path, scalar/2D fast-path guards) instead of being treated as a scalar (Issue #5137)"

[[tests]]
name = "subarray_range_view_5137"
