[[tests]]
name = "iterators_hasshape_collect_dispatch_5850"
file = "iterators_hasshape_collect_dispatch_5850.jl"
expected = true
description = "IteratorSize over a statically-ranked array infers the concrete HasShape{N} (mirroring IteratorSize(::AbstractArray{T,N})=HasShape{N}()), so Base._collect statically dispatches to the ::HasShape method instead of the ::IteratorSize catch-all and collect preserves array shape. Sharpened in both the Expr::Call and Expr::ModuleCall (Base.IteratorSize) inference arms (Issue #5850)."
