[[tests]]
name = "range_reverse_returns_range_5661"
file = "range_reverse_returns_range_5661.jl"
expected = true
description = "reverse(::AbstractRange) returns a lazy range (StepRange for integer ranges, StepRangeLen for float), not a materialized Vector: reverse(1:5) is 5:-1:1, reverse(1:2:9) is 9:-2:1, reverse(0.0:0.5:2.0) is 2.0:-0.5:0.0. Adds reverse(r::AbstractRange) = last(r):(-step(r)):first(r) in base/range.jl; the generic array reverse still materializes. Checked via collect/typeof/isa/first/last/step/length (range ==/=== are separately broken). Issue #5661"

[[tests]]
name = "range_equality_5666"
file = "range_equality_5666.jl"
expected = true
description = "== and === on ranges (Issue #5666). == compiled to a Range->I64 coercion error; === returned false. Compiler now routes a statically-known range == operand to pure-Julia ==(::AbstractRange,...) (element-wise, like arrays; range==array works), with identity fallback for range-vs-scalar; the Egal builtin compares ranges structurally (immutable). Dynamic range == inside in/findfirst (Any-typed) remains a separate runtime-dispatch gap."

[[tests]]
name = "range_explicit_step_5667"
file = "range_explicit_step_5667.jl"
expected = true
description = "1:1:5 (explicit step 1) is a StepRange, not a UnitRange (Issue #5667). RangeValue gains an is_step_range flag set by a new MakeStepRangeLazy instruction (emitted for the 3-arg colon a:s:b); is_unit_range() now requires step==1 AND no explicit step. Covers typeof/isa/show/string/repr for explicit-step vs unit ranges, with values/iteration unchanged."

[[tests]]
name = "range_in_membership_5728"
file = "range_in_membership_5728.jl"
expected = true
description = "x in range membership (Issue #5728): the `in` builtin rejected Range as a container. Adds RangeValue::contains_value (arithmetic membership: (x-start)/step a non-negative integer < length) and a Range arm in the `in` handler. Covers unit/step/negative/float/char ranges, float-vs-int elements, and ∈/∉/predicate use."

[[tests]]
name = "range_in_array_membership_5725"
file = "range_in_array_membership_5725.jl"
expected = true
description = "A range as an element of a collection — (1:3) in [1:3,...], findfirst/findall over arrays of ranges (Issue #5725). The `in` builtin's value-equality helper gains a Range arm comparing element-wise via to_vec() (so 1:3 == 1:1:3 and all empty ranges are equal). Complements #5666 (static range ==)."

[[tests]]
name = "range_oneto_equality_5814"
file = "oneto_equality_5814.jl"
expected = true
description = "OneTo == OneTo (and != ) compares element-wise instead of falling to the numeric fast path; OneTo is a range struct so it must be recognized in the binary ==/!= range routing (Issue #5814)"

[[tests]]
name = "range_struct_indexed_by_range_5842"
file = "range_struct_indexed_by_range_5842.jl"
expected = true
description = "Indexing a range struct (OneTo) by a range dispatches getindex(::AbstractRange, ::AbstractRange); the struct base must not be coerced to the abstract param's native ValueType::Range (Issue #5842). Abstract container params (AbstractArray/AbstractRange) now skip arg coercion since concrete subtypes (OneTo struct, SubArray) have struct VM representations. Regression: this broke the eager full-Base compile because Base's view(r::OneTo, indices::UnitRange)=r[indices] failed with 'Cannot convert Struct(..) to Range'."

[[tests]]
name = "range_float_endpoint_7024"
file = "float_endpoint_7024.jl"
expected = true
description = "Floating step ranges keep an endpoint that is lost by raw quotient flooring, e.g. 0:0.1:0.3 has length 4 like upstream Julia (Issue #7024)"

[[tests]]
name = "range_for_head_nonliteral_float_step_7800"
file = "for_head_nonliteral_float_step_7800.jl"
expected = true
description = "Inline range literal with an integer start and a non-literal float step in a top-level for-head (e.g. 0:(2π/12):2π) iterates 13 times like upstream Julia, not zero; covers float-start and function-scope cases too (Issue #7800, follow-up to #3551)"
